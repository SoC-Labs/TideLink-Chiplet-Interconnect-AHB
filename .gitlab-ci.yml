    - cp "$WORK_DIR/cocotb/tidelink_ptp/results.xml"   cocotb/tidelink_ptp/ 2>/dev/null || true
    - cp "$WORK_DIR/cocotb/tidelink_ptp/run.log"       cocotb/tidelink_ptp/ 2>/dev/null || true
    - mkdir -p coverage_vdbs/cocotb
    - cp -r "$WORK_DIR/cocotb/tidelink_ptp/coverage.vdb" "coverage_vdbs/cocotb/tidelink_ptp.vdb" 2>/dev/null || true
    - cp -r "$WORK_DIR/cocotb/tidelink_ptp/sim_build/simv.vdb" "coverage_vdbs/cocotb/tidelink_ptp_simv.vdb" 2>/dev/null || true
  artifacts:
