    - cp "$WORK_DIR/uvm/tidelink_ptp_chain/sim_build/"*.log   uvm/tidelink_ptp_chain/ 2>/dev/null || true
    - mkdir -p coverage_vdbs/uvm
    - cp -r "$WORK_DIR/uvm/tidelink_ptp_chain/sim_build/simv.vdb" "coverage_vdbs/uvm/tidelink_ptp_chain.vdb" 2>/dev/null || true
  artifacts:
