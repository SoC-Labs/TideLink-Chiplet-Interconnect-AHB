# Two-Wlink pair-link bring-up sim — depends on the FPGA filelist
# (tidelink_fpga.flist references Xilinx-targeted PHY GPIO Verilog and
# the WAV-WLINK output dir). allow_failure while the env stabilises and
# any flist tweaks needed for pure-VCS regression land.
cocotb-wlink-pair:
  stage: new_module
  needs: [clone, preflight]
  tags:
    - vcs
  allow_failure: true
  <<: *vcs_cocotb_setup
  script:
    - echo "Running cocotb wlink_pair bring-up tests (6 tests)"
    - cd "$WORK_DIR/cocotb/wlink_pair" && make
  after_script:
    - mkdir -p cocotb/wlink_pair
    - cp "$WORK_DIR/cocotb/wlink_pair/results.xml"   cocotb/wlink_pair/ 2>/dev/null || true
    - cp "$WORK_DIR/cocotb/wlink_pair/run.log"       cocotb/wlink_pair/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - cocotb/wlink_pair/
    reports:
      junit:
        - cocotb/wlink_pair/results.xml
    expire_in: 30 days

# ============================================================================
# Stage 5: System Tests
# ============================================================================

cocotb-system:
  stage: system
  needs: [clone, preflight]
  tags:
    - vcs
  allow_failure: true
  <<: *vcs_cocotb_setup
  script:
    - echo "Running 25 cocotb tidelink_system stress tests"
    - cd "$WORK_DIR/cocotb/tidelink_system" && COVERAGE=1 make
  after_script:
    - mkdir -p cocotb/tidelink_system
    - cp "$WORK_DIR/cocotb/tidelink_system/results.xml"   cocotb/tidelink_system/ 2>/dev/null || true
    - cp "$WORK_DIR/cocotb/tidelink_system/run.log"       cocotb/tidelink_system/ 2>/dev/null || true
    - mkdir -p coverage_vdbs/cocotb
    - cp -r "$WORK_DIR/cocotb/tidelink_system/coverage.vdb" "coverage_vdbs/cocotb/tidelink_system.vdb" 2>/dev/null || true
    - cp -r "$WORK_DIR/cocotb/tidelink_system/sim_build/simv.vdb" "coverage_vdbs/cocotb/tidelink_system_simv.vdb" 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - cocotb/tidelink_system/
      - coverage_vdbs/cocotb/
    reports:
      junit:
        - cocotb/tidelink_system/results.xml
    expire_in: 30 days

uvm-system:
  stage: system
  needs: [clone, preflight]
  tags:
    - vcs
  allow_failure: true
  timeout: 90m
  <<: *vcs_uvm_setup
  script:
    - echo "Running 12 UVM tidelink_system tests"
    # UVM_LOW suppresses SVT AHB VIP's verbose end_of_elaboration psdisplay
    # (printed at UVM_MEDIUM); without this each test emits ~300 KB of VIP
    # config dump, exhausting GitLab's 4 MB job-log cap before sim completes.
    - make -C "$WORK_DIR/uvm/tidelink_system" run_all VERBOSITY=UVM_LOW || true
    - python3 "$WORK_DIR/ci/uvm_results_to_junit.py"
        "$WORK_DIR/uvm/tidelink_system/sim_build"
        "$WORK_DIR/uvm/tidelink_system/results.xml"
  after_script:
    - mkdir -p uvm/tidelink_system
    - cp "$WORK_DIR/uvm/tidelink_system/results.xml"      uvm/tidelink_system/ 2>/dev/null || true
    - cp "$WORK_DIR/uvm/tidelink_system/sim_build/"*.log   uvm/tidelink_system/ 2>/dev/null || true
    - mkdir -p coverage_vdbs/uvm
    - cp -r "$WORK_DIR/uvm/tidelink_system/sim_build/simv.vdb" "coverage_vdbs/uvm/tidelink_system.vdb" 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - uvm/tidelink_system/*.log
      - coverage_vdbs/uvm/
    reports:
      junit:
        - uvm/tidelink_system/results.xml
    expire_in: 30 days

uvm-ptp-stress:
  stage: system
  needs: [clone, preflight]
  tags:
    - vcs
  allow_failure: true
  <<: *vcs_uvm_setup
  script:
    - echo "Running 2 UVM tidelink_ptp_stress tests"
    - make -C "$WORK_DIR/uvm/tidelink_ptp_stress" run_all || true
    - python3 "$WORK_DIR/ci/uvm_results_to_junit.py"
        "$WORK_DIR/uvm/tidelink_ptp_stress/sim_build"
