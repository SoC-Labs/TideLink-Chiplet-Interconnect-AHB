# TideLink GitLab CI Pipeline
# Runs HAL lint, cocotb regression, and RTL Architect synthesis exploration

stages:
  - setup
  - lint
  - regression
  - synthesis
  - cleanup

variables:
  # Disable GitLab's built-in checkout — we clone manually
  GIT_STRATEGY: none
  # Workspace directory for the pipeline
  WORK_DIR: "${CI_BUILDS_DIR}/${CI_PROJECT_NAME}/${CI_PIPELINE_ID}"
  # Synopsys EDA tool paths
  VCS_HOME: /eda/synopsys/2022-23/RHELx86/VCS_2022.06-SP2
  VERDI_HOME: /eda/synopsys/2022-23/RHELx86/VERDI_2022.06-SP2
  RTLA_HOME: /eda/synopsys/2022-23/RHELx86/RTL_ARCHITECT_2022.06-SP2
  # Cadence Xcelium (provides HAL linter)
  XCELIUM_HOME: /eda/cadence/xcelium
  # Simulator selection for cocotb
  SIM: vcs
  # License server (update as needed)
  # SNPSLMD_LICENSE_FILE: "port@license-server"

# ── Clone ────────────────────────────────────────────────────────────────

clone:
  stage: setup
  script:
    - rm -rf "$WORK_DIR"
    - mkdir -p "$WORK_DIR"
    - git clone --branch "$CI_COMMIT_REF_NAME" --single-branch "$CI_REPOSITORY_URL" "$WORK_DIR"
    - cd "$WORK_DIR" && git checkout "$CI_COMMIT_SHA"
    - echo "Cloned $CI_COMMIT_SHORT_SHA into $WORK_DIR"

# ── Lint ─────────────────────────────────────────────────────────────────

hal-lint:
  stage: lint
  needs: [clone]
  tags:
    - xcelium
  before_script:
    - export PATH="$XCELIUM_HOME/tools/bin:$PATH"
  script:
    - echo "HAL version:" && hal -version 2>&1 | head -1
    - make -C "$WORK_DIR/lint" lint-standalone
  after_script:
    - cp -r "$WORK_DIR/lint/"*_hal.log "$WORK_DIR/lint/"*_hal.xml . 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - "*_hal.log"
      - "*_hal.xml"
    expire_in: 30 days

# ── Verification ─────────────────────────────────────────────────────────

cocotb-regression:
  stage: regression
  needs: [clone]
  tags:
    - vcs
  before_script:
    - export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
  script:
    - echo "Python version:" && python3 --version
    - echo "cocotb version:" && python3 -m cocotb --version || cocotb-config --version
    - echo "VCS version:" && vcs -ID 2>&1 | head -1
    - make -C "$WORK_DIR/cocotb" regression
  after_script:
    - mkdir -p cocotb
    - for env in tidelink_fifo tidelink_returner tidelink py_pair; do
        mkdir -p "cocotb/$env";
        cp "$WORK_DIR/cocotb/$env/run.log"      "cocotb/$env/" 2>/dev/null || true;
        cp "$WORK_DIR/cocotb/$env/.result"       "cocotb/$env/" 2>/dev/null || true;
        cp "$WORK_DIR/cocotb/$env/results.xml"   "cocotb/$env/" 2>/dev/null || true;
      done
  artifacts:
    when: always
    paths:
      - cocotb/*/run.log
      - cocotb/*/.result
    reports:
      junit:
        - cocotb/*/results.xml
    expire_in: 30 days

# ── RTL Architect ────────────────────────────────────────────────────────

rtl-architect:
  stage: synthesis
  needs: [clone]
  tags:
    - rtl_architect
  before_script:
    - export PATH="$RTLA_HOME/bin:$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
  script:
    - echo "RTL Architect version:" && rtl_architect -version 2>&1 | head -3
    - make -C "$WORK_DIR/syn/asic/rtl-architect" ra MODULE=tidelink
  after_script:
    - mkdir -p syn/asic/rtl-architect
    - cp -r "$WORK_DIR/syn/asic/rtl-architect/tidelink_ra_reports" syn/asic/rtl-architect/ 2>/dev/null || true
    - cp    "$WORK_DIR/syn/asic/rtl-architect/tidelink_ra.log"     syn/asic/rtl-architect/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - syn/asic/rtl-architect/tidelink_ra_reports/
      - syn/asic/rtl-architect/tidelink_ra.log
    expire_in: 30 days

design-compiler:
  stage: synthesis
  needs: [clone]
  tags:
    - design_compiler
  before_script:
    - export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
  script:
    - echo "DC version:" && dc_shell -version 2>&1 | head -3
    - make -C "$WORK_DIR/syn/asic/design-compiler" syn MODULE=tidelink
  after_script:
    - mkdir -p syn/asic/design-compiler
    - cp -r "$WORK_DIR/syn/asic/design-compiler/tidelink_dc_reports" syn/asic/design-compiler/ 2>/dev/null || true
    - cp -r "$WORK_DIR/syn/asic/design-compiler/tidelink_dc_output"  syn/asic/design-compiler/ 2>/dev/null || true
    - cp    "$WORK_DIR/syn/asic/design-compiler/tidelink_dc.log"     syn/asic/design-compiler/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - syn/asic/design-compiler/tidelink_dc_reports/
      - syn/asic/design-compiler/tidelink_dc_output/
      - syn/asic/design-compiler/tidelink_dc.log
    expire_in: 30 days

# ── Cleanup ──────────────────────────────────────────────────────────────

cleanup:
  stage: cleanup
  when: always
  script:
    - rm -rf "$WORK_DIR"
    - echo "Cleaned up $WORK_DIR"
