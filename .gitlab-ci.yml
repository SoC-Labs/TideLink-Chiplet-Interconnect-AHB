# TideLink GitLab CI Pipeline
# Runs lint, cocotb regression (204 tests), UVM, synthesis, and coverage.
#
# Stages:
#   1. setup      - Clone repo, validate tool paths
#   2. lint       - HAL lint on FIFO and new modules
#   3. regression - All cocotb (204 tests, 9 envs) and UVM (4 tests)
#   4. new_module - Additional cocotb/UVM for fc_adapter, top, integration
#   5. system     - System-level paired stress tests (cocotb + UVM)
#   6. fpga       - Real-board ci_pair_role_aware via fpgahub (background-tier
#                   lease; preempted by interactive acquires, retried on revoke)
#   7. synthesis  - Design Compiler: FIFO, FC adapter, tidelink_top
#   8. coverage   - Merge VCS coverage from all runs
#   9. pages      - Dashboard generation
#  10. cleanup    - Remove workspace
#
# Integration-branch pin map (feat/td-gpio-phy-integration)
# ---------------------------------------------------------
# The new GPIO-PHY training-pattern subsystem is wired in via two submodules.
# When working on this branch, the three repos must move together:
#
#   parent td-gpio-phy-integ      @ feat/td-gpio-phy-integration
#   tidelink-gpio-phy submodule   @ main         (>= commit 469a1ec)
#   axi-chiplet-controller        @ feat/td-gpio-phy-integration
#                                                 (>= commit 68d625d)
#
# What this pipeline picks up automatically:
#   * `clone` runs `git submodule update --init --recursive`, so both
#     submodule pointers come along with the parent commit.
#   * `hal-lint` (stage: lint) runs `lint-standalone` which includes
#     `tidelink_lane_checker` — the flist `flists/tidelink_lane_checker.flist`
#     points at deps/tidelink-gpio-phy/rtl/*.sv so the submodule RTL is
#     covered on every push.
#   * `cocotb-regression` (stage: regression) instantiates tidelink_top via
#     `cocotb/tidelink_top/`, which in turn flists in the submodule RTL via
#     `tidelink_lane_checker.flist`. The new eye-visibility port block in
#     deps/axi-chiplet-controller/logical/top/axi_chiplet_controller.sv is
#     therefore exercised by the existing tidelink_top + tidelink_system
#     cocotb envs.
#
# The submodules also have their own minimal CI (see
# deps/tidelink-gpio-phy/.github/workflows/ci.yml and
# deps/axi-chiplet-controller/.github/workflows/lint.yml) so each push to a
# submodule branch gets its own lint feedback before parent integration.

stages:
  - setup
  - lint
  - regression
  - new_module
  - system
  - fpga
  - synthesis
  - coverage
  - pages
  - cleanup
  - hwtest

variables:
  # Disable GitLab's built-in checkout -- we clone manually
  GIT_STRATEGY: none
  # Workspace directory for the pipeline
  WORK_DIR: "${CI_BUILDS_DIR}/${CI_PROJECT_NAME}/${CI_PIPELINE_ID}"
  # Synopsys EDA tool paths
  VCS_HOME: /eda/synopsys/2022-23/RHELx86/VCS_2022.06-SP2
  VERDI_HOME: /eda/synopsys/2022-23/RHELx86/VERDI_2022.06-SP2
  RTLA_HOME: /eda/synopsys/2022-23/RHELx86/RTL-ARCH_2022.12
  VIP_HOME: /eda/synopsys/2022-23/RHELx86/VC-VIP-SOC_2022.12
  # Cadence Xcelium (provides HAL linter)
  XCELIUM_HOME: /eda/cadence/xcelium
  # Synopsys SpyGlass (CDC lint)
  SPYGLASS_HOME: /eda/synopsys/2022-23/RHELx86/SPYGLASS_2022.06-SP2/SPYGLASS_HOME
  # ARM CMSDK -- configurable via CI variable
  CMSDK_DIR: "/research/AAA/ip_library/Corstone-101/BP210-r1p1-00rel0/BP210-BU-00000-r1p1-00rel0"
  # cmsdk_fpga_sram.v is missing from the Corstone-101 BP210 install above; pull
  # it from the standalone BP210 install. Flists reference ${CMSDK_FPGA_SRAM_V}.
  CMSDK_FPGA_SRAM_V: "/research/AAA/ip_library/BP210/BP210-BU-00000-r1p1-00rel0/logical/models/memories/cmsdk_fpga_sram.v"
  # PTP Hardware Clock (separate component, cloned for PTP tests)
  PHC_REPO: "https://git.soton.ac.uk/soclabs/chiplets/ptp-hardware-clock-ahb.git"
  PHC_BRANCH: "main"
  PHC_DIR: "${WORK_DIR}/deps/ptp-hardware-clock-ahb/src/rtl"
  # Simulator selection for cocotb
  SIM: vcs
  # Pip cache directory for faster installs
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  key: pip-${CI_COMMIT_REF_SLUG}
  paths:
    - .pip-cache/

# ============================================================================
# Stage 1: Setup
# ============================================================================

clone:
  stage: setup
  script:
    # Remove stale workspaces from previous pipelines (older than 24h)
    - find "${CI_BUILDS_DIR}/${CI_PROJECT_NAME}" -maxdepth 1 -mindepth 1 -type d -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
    - rm -rf "$WORK_DIR"
    - mkdir -p "$WORK_DIR"
    - git clone --branch "$CI_COMMIT_REF_NAME" --single-branch --recurse-submodules "$CI_REPOSITORY_URL" "$WORK_DIR"
    - cd "$WORK_DIR" && git checkout "$CI_COMMIT_SHA" && git submodule update --init --recursive
    - echo "Cloned $CI_COMMIT_SHORT_SHA into $WORK_DIR"
    - echo "Cloning PHC (separate component, needed for PTP tests)"
    - git clone --branch "$PHC_BRANCH" --single-branch --depth 1 "$PHC_REPO" "$WORK_DIR/deps/ptp-hardware-clock-ahb" || echo "WARN PHC clone failed, PTP tests will be skipped"

preflight:
  stage: setup
  needs: [clone]
  script:
    - |
      echo "========================================"
      echo " Preflight Environment Check"
      echo "========================================"

      pass=0; fail=0

      check_dir() {
        local name="$1" path="$2"
        if [ -z "$path" ]; then
          echo "  FAIL  $name  (not set)"
          fail=$((fail + 1))
        elif [ -d "$path" ]; then
          echo "  OK    $name = $path"
          pass=$((pass + 1))
        else
          echo "  FAIL  $name = $path  (directory not found)"
          fail=$((fail + 1))
        fi
      }

      check_bin() {
        local name="$1" bin="$2"
        if command -v "$bin" > /dev/null 2>&1; then
          echo "  OK    $name  ($(command -v "$bin"))"
          pass=$((pass + 1))
        else
          echo "  FAIL  $name  ('$bin' not found on PATH)"
          fail=$((fail + 1))
        fi
      }

      echo ""
      echo "-- EDA Tools ----------------------------"
      check_dir "VCS_HOME"      "$VCS_HOME"
      check_dir "VERDI_HOME"    "$VERDI_HOME"
      check_dir "XCELIUM_HOME"  "$XCELIUM_HOME"
      check_dir "SPYGLASS_HOME" "$SPYGLASS_HOME"
      check_dir "VIP_HOME"      "$VIP_HOME"

      echo ""
      echo "-- IP Libraries -------------------------"
      check_dir "CMSDK_DIR"                    "$CMSDK_DIR"
      check_dir "CMSDK cmsdk_ahb_to_sram"      "$CMSDK_DIR/logical/cmsdk_ahb_to_sram"
      check_dir "CMSDK fpga_sram model"         "$CMSDK_DIR/logical/models/memories"

      echo ""
      echo "-- Workspace ----------------------------"
      check_dir "WORK_DIR"      "$WORK_DIR"

      echo ""
      echo "-- Tool Binaries (with PATH set) --------"
      export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$XCELIUM_HOME/tools/bin:$SPYGLASS_HOME/bin:$PATH"
      check_bin "vcs"             "vcs"
      check_bin "spyglass"        "spyglass"
      check_bin "hal"             "hal"
      check_bin "python3"         "python3"
      check_bin "cocotb-config"   "cocotb-config"

      echo ""
      echo "========================================"
      echo " Preflight Summary  PASS=$pass  FAIL=$fail"
      echo "========================================"

      if [ "$fail" -ne 0 ]; then
        echo ""
        echo "ERROR: $fail preflight check(s) failed."
        echo "Fix the paths in .gitlab-ci.yml variables or on the runner."
        exit 1
      fi

# ============================================================================
# Stage 2: Lint
# ============================================================================

strip-generalbus-check:
  stage: lint
  needs: [clone, preflight]
  script:
    - cd "$WORK_DIR" && bash ci/check_strip_generalbus.sh

# Pre-build gate, Tier-0 (fast, pure-Python — no EDA license). Ratcheted
# xdc_lint + sv_anti_pattern: a NEW dropped-XDC / latch / incomplete-case fails
# the pipeline. This is a REAL gate (no allow_failure) — it is the class that
# shipped the XHB combinational loop to silicon (cb33c9f). Accepted debt is
# tracked in fpga/farm_gate_{xdc,sv}_baseline.txt so today's tree is green.
farm-gate-lint:
  stage: lint
  needs: [clone, preflight]
  before_script:
    - export TIDELINK_HOME="$WORK_DIR"
  script:
    - cd "$WORK_DIR" && make farm_gate_fast

merge-guard:
  # Asserts that silicon-proven fixes have NOT been reverted by a merge:
  # fe_tx_credit_max_eff (the A->B fix — die_b trunk has 0), and the fc_cfg APB
  # arbiter (ext_lock_q / EXT_STALL_LIMIT). Resolving those files toward the wrong
  # trunk silently reverts them with every sim still green — a dead chip that no
  # functional test catches. A grep is cheap; a respin is not.
  # 2026-07-16 (consolidation W3): flipped to blocking — merge_guard.sh is confirmed
  # GREEN on the integ trunk (fe_tx_credit_max_eff, ext_lock_q, EXT_STALL_LIMIT, FCSM
  # 0-4 flist resolution all present). A silent revert of a silicon-proven fix now
  # fails the pipeline.
  stage: lint
  needs: [clone, preflight]
  script:
    - cd "$WORK_DIR" && bash fpga/scripts/merge_guard.sh
  allow_failure: false

hal-lint:
  stage: lint
  needs: [clone, preflight]
  tags:
    - xcelium
  before_script:
    - export PATH="$XCELIUM_HOME/tools/bin:$PATH"
    - export TIDELINK_HOME="$WORK_DIR"
  script:
    - echo "HAL version:" && hal -version 2>&1 | head -1
    # Lint all standalone modules (no CMSDK; covers ~20 TideLink modules)
    - make -C "$WORK_DIR/lint" lint-standalone
    # Lint all modules including CMSDK-dependent (full design coverage)
    - make -C "$WORK_DIR/lint" lint-each
  after_script:
    - cp -r "$WORK_DIR/lint/"*_hal.log "$WORK_DIR/lint/"*_hal.xml . 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - "*_hal.log"
      - "*_hal.xml"
    expire_in: 30 days

spyglass-cdc:
  stage: lint
  needs: [clone, preflight]
  tags:
    - vcs
  before_script:
    - export PATH="$SPYGLASS_HOME/bin:$PATH"
    - export TIDELINK_HOME="$WORK_DIR"
    - export CMSDK_DIR="$CMSDK_DIR"
  script:
    - echo "SpyGlass version:" && spyglass -batch -tcl "puts [get_tool_info version]; exit" 2>&1 | tail -1 || true
    - make -C "$WORK_DIR/cdc" cdc SPYGLASS_HOME="$SPYGLASS_HOME"
  after_script:
    - mkdir -p spyglass_cdc
    - cp "$WORK_DIR/cdc/"*_cdc_summary.rpt spyglass_cdc/ 2>/dev/null || true
    - cp -r "$WORK_DIR/cdc/"*_spyglass/cdc_verify/spyglass_reports spyglass_cdc/reports 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - spyglass_cdc/
    expire_in: 30 days

# ============================================================================
# Stage 3: Existing Tests (regression)
# ============================================================================

# -- Common before_script templates ------------------------------------------

.vcs_cocotb_setup: &vcs_cocotb_setup
  before_script:
    - export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
    - export CMSDK_DIR="$CMSDK_DIR"
    - export TIDELINK_HOME="$WORK_DIR"
    - python3 -m pip uninstall tidelink -y --quiet 2>/dev/null || true
    - python3 -m pip install --user --no-deps -e "$WORK_DIR/python" --quiet
    - find "$WORK_DIR" -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
    - python3 -m pip install --user cocotb cocotbext-ahb systemrdl-compiler typing_extensions --quiet
    - source "$WORK_DIR/set_env.sh" 2>&1 | sed 's/^/  /'
    # fpgahub_sdk.testkit (HALBridge) is vendored in cocotb/common/fpgahub_sdk/
    # — no pip install needed. The pip-install approach broke CI because
    # fpgahub requires-python >=3.11 but the runner is older (see
    # docs/CI_FAILURE_TRIAGE.md §2-A and §2-B).

.vcs_uvm_setup: &vcs_uvm_setup
  before_script:
    - export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
    - export CMSDK_DIR="$CMSDK_DIR"
    - export TIDELINK_HOME="$WORK_DIR"
    - export DESIGNWARE_HOME="$VIP_HOME"
    - source "$WORK_DIR/set_env.sh" 2>&1 | sed 's/^/  /'

sim-gate:
  # THE pre-deploy / pre-tapeout gate. `cocotb-regression` below runs the broad
  # unit envs but NOT the paired-die autonomy suites, NOT V1 elaboration, and NOT
  # the ASIC-flist elaboration — which is exactly how a405809 (undefined obs ports
  # in the V1/ASIC flists) reached the trunk while every CI job stayed green.
  # `make sim_gate` already existed and was wired into NO CI job. This is that job.
  # 10 suites: t30/t31/t32/t33 (paired-die zero-poke chain), v2_pair_data,
  # v2_autonomous_sync_detect, v2_winscan_fsm, v1_elab, apb_fc_cfg_preempt,
  # fch_apb_watchdog. The last two lock PS-hang bugs that cost a physical power
  # cycle. Non-blocking flagged via allow_failure until it has a green baseline on
  # the trunk, then flip allow_failure:false to make it a hard merge gate.
  stage: regression
  needs: [clone, preflight]
  tags:
    - vcs
  <<: *vcs_cocotb_setup
  script:
    - echo "VCS version:" && vcs -ID 2>&1 | head -1
    - cd "$WORK_DIR" && make sim_gate
  after_script:
    - mkdir -p sim_gate
    - cp "$WORK_DIR/imp/sim_gate/"*.status "sim_gate/" 2>/dev/null || true
    - cp "$WORK_DIR/imp/sim_gate/"*.log     "sim_gate/" 2>/dev/null || true
  allow_failure: false     # 2026-07-16 (consolidation W3): flipped — sim_gate 13/13 green on integ trunk
  artifacts:
    when: always
    paths:
      - sim_gate/*.status
      - sim_gate/*.log
    expire_in: 30 days

cocotb-regression:
  stage: regression
  needs: [clone, preflight]
  tags:
    - vcs
  <<: *vcs_cocotb_setup
  script:
    - echo "Python version:" && python3 --version
    - echo "cocotb version:" && python3 -m cocotb --version || cocotb-config --version
    - echo "VCS version:" && vcs -ID 2>&1 | head -1
    # Run all cocotb tests (204 tests across 9 environments) with coverage
    - make -C "$WORK_DIR/cocotb" coverage
  after_script:
    - mkdir -p cocotb
    - for env in tidelink_fifo tidelink_returner tidelink_apb_regs tidelink_apb_addr_ctrl tidelink tidelink_ahb tidelink_py_pair tidelink_fc_adapter tidelink_top tidelink_system tidelink_perf tidelink_perf_congestion tidelink_addr_translator tidelink_autoneg tidelink_mul_iter tidelink_phc_cdc tidelink_ptp tidelink_ptp_servo tidelink_idelay_rx tidelink_rxclk_buf tidelink_clkfreq_check tidelink_eye_regs tidelink_phy_align_calibrator wav_d2d_gpio_tx wavd2d_gpiorx_clkbuf wavd2d_gpiorx_t3a wavd2d_gpiorx_t3a_off wavd2d_gpiorx_t3a_timeout; do
        mkdir -p "cocotb/$env";
        cp "$WORK_DIR/cocotb/$env/run.log"      "cocotb/$env/" 2>/dev/null || true;
        cp "$WORK_DIR/cocotb/$env/.result"       "cocotb/$env/" 2>/dev/null || true;
        cp "$WORK_DIR/cocotb/$env/results.xml"   "cocotb/$env/" 2>/dev/null || true;
      done
    - cp -r "$WORK_DIR/cocotb/coverage_report" cocotb/ 2>/dev/null || true
    # Collect VDB coverage databases for final merge
    - mkdir -p coverage_vdbs/cocotb
    - for env in tidelink_fifo tidelink_returner tidelink_apb_regs tidelink_apb_addr_ctrl tidelink tidelink_ahb tidelink_py_pair tidelink_addr_translator tidelink_autoneg tidelink_mul_iter tidelink_phc_cdc tidelink_ptp tidelink_ptp_servo tidelink_idelay_rx tidelink_rxclk_buf tidelink_clkfreq_check tidelink_eye_regs tidelink_phy_align_calibrator wav_d2d_gpio_tx wavd2d_gpiorx_clkbuf wavd2d_gpiorx_t3a wavd2d_gpiorx_t3a_off wavd2d_gpiorx_t3a_timeout; do
        cp -r "$WORK_DIR/cocotb/$env/coverage.vdb" "coverage_vdbs/cocotb/${env}.vdb" 2>/dev/null || true;
        cp -r "$WORK_DIR/cocotb/$env/sim_build/simv.vdb" "coverage_vdbs/cocotb/${env}_simv.vdb" 2>/dev/null || true;
      done
  artifacts:
    when: always
    paths:
      - cocotb/*/run.log
      - cocotb/*/.result
      - cocotb/coverage_report/
      - coverage_vdbs/cocotb/
    reports:
      junit:
        - cocotb/*/results.xml
    expire_in: 30 days

# Pre-build gate, Tier-1 (the V2 pair sim at the silicon-faithful config). Runs
# the FUNCTIONAL stages (bring-up both directions + reduced-lane + XHB bridge
# BFM) as a REAL gate (no allow_failure). The silicon epoch-skew + marginal-eye
# STRESS stages are opt-in (FARM_GATE_STRESS=1) because their green-ness is
# PHY-pin dependent — enable them on the autonomous/unified lineage (bbd094c)
# where the deskew is expected to pass. See fpga/farm_gate.sh.
farm-gate-sim:
  stage: regression
  needs: [clone, preflight]
  tags:
    - vcs
  <<: *vcs_cocotb_setup
  script:
    - export TIDELINK_HOME="$WORK_DIR"
    - export TIDELINK_PHY_V2=1
    - cd "$WORK_DIR" && make farm_gate
  artifacts:
    when: always
    paths:
      - imp/fpga/run/farm_gate/
    expire_in: 30 days

cdriver-regression:
  stage: regression
  needs: [clone, preflight]
  tags:
    - vcs
  <<: *vcs_cocotb_setup
  script:
    - echo "Building C driver shared library"
    - make -C "$WORK_DIR/cocotb/tidelink_ahb" driver-so
    - echo "Running C driver-in-the-loop tests"
    - make -C "$WORK_DIR/cocotb/tidelink_ahb" sim MODULE=test_tidelink_ahb_cdriver
  after_script:
    - mkdir -p cocotb/tidelink_ahb_cdriver
    - cp "$WORK_DIR/cocotb/tidelink_ahb/run.log"      cocotb/tidelink_ahb_cdriver/ 2>/dev/null || true
    - cp "$WORK_DIR/cocotb/tidelink_ahb/results.xml"   cocotb/tidelink_ahb_cdriver/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - cocotb/tidelink_ahb_cdriver/run.log
    reports:
      junit:
        - cocotb/tidelink_ahb_cdriver/results.xml
    expire_in: 30 days

uvm-regression:
  stage: regression
  needs: [clone, preflight]
  tags:
    - vcs
  <<: *vcs_uvm_setup
  script:
    - echo "VCS version:" && vcs -ID 2>&1 | head -1
    # BLOCKING gate (promoted 2026-07-07, infra/uvm-ci-reactivation): the `|| true`
    # fake-green was removed after verifying compile + all 4 tests pass clean
    # against current RTL (4/4 PASS). run_all `exit $fail` now fails CI on any
    # regression. Matches the uvm-fc-adapter blocking pattern.
    - make -C "$WORK_DIR/uvm/tidelink" run_all
    # Convert UVM logs to JUnit XML
    - python3 "$WORK_DIR/ci/uvm_results_to_junit.py"
        "$WORK_DIR/uvm/tidelink/sim_build"
        "$WORK_DIR/uvm/tidelink/results.xml"
  after_script:
    - mkdir -p uvm/tidelink
    - cp "$WORK_DIR/uvm/tidelink/results.xml"         uvm/tidelink/ 2>/dev/null || true
    - cp "$WORK_DIR/uvm/tidelink/sim_build/"*.log      uvm/tidelink/ 2>/dev/null || true
    # Collect VDB coverage databases for final merge
    - mkdir -p coverage_vdbs/uvm
    - cp -r "$WORK_DIR/uvm/tidelink/sim_build/simv.vdb" "coverage_vdbs/uvm/tidelink.vdb" 2>/dev/null || true
    # Write result summary
    - |
      if grep -q 'failures="0"' uvm/tidelink/results.xml 2>/dev/null; then
        echo "PASS" > uvm/tidelink/.result
      else
        echo "FAIL" > uvm/tidelink/.result
      fi
  artifacts:
    when: always
    paths:
      - uvm/tidelink/*.log
      - uvm/tidelink/.result
      - coverage_vdbs/uvm/
    reports:
      junit:
        - uvm/tidelink/results.xml
    expire_in: 30 days

# ============================================================================
# Stage 4: New Module Tests
# ============================================================================

cocotb-fc-adapter:
  stage: new_module
  needs: [clone, preflight]
  tags:
    - vcs
  <<: *vcs_cocotb_setup
  script:
    - echo "Running 24 cocotb tidelink_fc_adapter tests"
    - cd "$WORK_DIR/cocotb/tidelink_fc_adapter" && COVERAGE=1 make
  after_script:
    - mkdir -p cocotb/tidelink_fc_adapter
    - cp "$WORK_DIR/cocotb/tidelink_fc_adapter/results.xml"   cocotb/tidelink_fc_adapter/ 2>/dev/null || true
    - cp "$WORK_DIR/cocotb/tidelink_fc_adapter/run.log"       cocotb/tidelink_fc_adapter/ 2>/dev/null || true
    - mkdir -p coverage_vdbs/cocotb
    - cp -r "$WORK_DIR/cocotb/tidelink_fc_adapter/coverage.vdb" "coverage_vdbs/cocotb/tidelink_fc_adapter.vdb" 2>/dev/null || true
    - cp -r "$WORK_DIR/cocotb/tidelink_fc_adapter/sim_build/simv.vdb" "coverage_vdbs/cocotb/tidelink_fc_adapter_simv.vdb" 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - cocotb/tidelink_fc_adapter/
      - coverage_vdbs/cocotb/
    reports:
      junit:
        - cocotb/tidelink_fc_adapter/results.xml
    expire_in: 30 days

cocotb-top:
  stage: new_module
  needs: [clone, preflight]
  tags:
    - vcs
  <<: *vcs_cocotb_setup
  script:
    - echo "Running 14 cocotb tidelink_top tests"
    - cd "$WORK_DIR/cocotb/tidelink_top" && COVERAGE=1 make
  after_script:
    - mkdir -p cocotb/tidelink_top
    - cp "$WORK_DIR/cocotb/tidelink_top/results.xml"   cocotb/tidelink_top/ 2>/dev/null || true
    - cp "$WORK_DIR/cocotb/tidelink_top/run.log"       cocotb/tidelink_top/ 2>/dev/null || true
    - mkdir -p coverage_vdbs/cocotb
    - cp -r "$WORK_DIR/cocotb/tidelink_top/coverage.vdb" "coverage_vdbs/cocotb/tidelink_top.vdb" 2>/dev/null || true
    - cp -r "$WORK_DIR/cocotb/tidelink_top/sim_build/simv.vdb" "coverage_vdbs/cocotb/tidelink_top_simv.vdb" 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - cocotb/tidelink_top/
      - coverage_vdbs/cocotb/
    reports:
      junit:
        - cocotb/tidelink_top/results.xml
    expire_in: 30 days

# Idealized (zero-skew) paired-die V2 sim smoke — two cross-wired tidelink_top
# instances through the GPIO PHY pads (pad_skid SKID_BITS=0 passthrough, the
# Makefile default). Added 2026-07-07 (infra/uvm-ci-reactivation): before this,
# NONE of the V2 pair suite was in CI, so RTL churn had no automatic paired-die
# check. This is a BLOCKING gate — it compiles both tidelink_top instances +
# submodule PHY/wlink against current RTL and runs the deterministically-green
# bring-up subset (role-lock + cal-done, training-hold, LINK_IDLE cr/crack latch,
