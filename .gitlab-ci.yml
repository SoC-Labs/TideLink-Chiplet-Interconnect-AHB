  after_script:
    - mkdir -p uvm/tidelink_ptp_stress
    - cp "$WORK_DIR/uvm/tidelink_ptp_stress/results.xml"      uvm/tidelink_ptp_stress/ 2>/dev/null || true
    - cp "$WORK_DIR/uvm/tidelink_ptp_stress/sim_build/"*.log   uvm/tidelink_ptp_stress/ 2>/dev/null || true
    - mkdir -p coverage_vdbs/uvm
    - cp -r "$WORK_DIR/uvm/tidelink_ptp_stress/sim_build/simv.vdb" "coverage_vdbs/uvm/tidelink_ptp_stress.vdb" 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - uvm/tidelink_ptp_stress/*.log
      - coverage_vdbs/uvm/
    reports:
      junit:
        - uvm/tidelink_ptp_stress/results.xml
    expire_in: 30 days

uvm-ptp-chain:
  stage: system
  needs: [clone, preflight]
  tags:
    - vcs
  allow_failure: true
  <<: *vcs_uvm_setup
  script:
    - echo "Running UVM tidelink_ptp_chain tests"
    - make -C "$WORK_DIR/uvm/tidelink_ptp_chain" run_all || true
    - python3 "$WORK_DIR/ci/uvm_results_to_junit.py"
