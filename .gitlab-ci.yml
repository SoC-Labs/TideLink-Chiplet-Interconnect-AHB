# ============================================================================
# Stage 6: FPGA-on-Bench (real Pynq-Z2 pair via fpgahub)
# ============================================================================
# Acquires the chassis lease for the TideLink Pynq-Z2 pair and runs the
# manifest's `ci_pair_role_aware` composite (build master + slave bitstreams,
# role-aware deploy, paired stress). Acquires under fpgahub's BACKGROUND
# tier with --requeue-on-revoke so a developer arriving with an interactive
# acquire preempts this run: the runner SIGTERMs the composite, our wrapper
# script gets rc=130, loops back to `lease wait` until the chassis frees,
# and re-runs `ci_pair_role_aware` from scratch.
#
# Concurrency policy:
#   * `rules:` below: only on main / feat/fpga-flow / scheduled / web
#   * `tags: [fpga]`: a single-concurrency runner registered on mapstone-dev
#   * FPGAHUB_LEASE_WAIT_S in fpga_run_pair.sh: hard cap on initial-queue
#     wait; FPGAHUB_MAX_REVOKES caps the revoke→retry attempts so a
#     pathologically-revoke-prone run can't loop forever.
#
# Background on the tier model: see fpgahub
# docs/PROPOSAL_BACKGROUND_TIER.md and docs/GUIDE.md §"Two tiers".

fpga-pair:
  stage: fpga
  needs: [clone, preflight]
  tags: [fpga]
  # Real-board flow — keep it opt-in while it stabilises so a flaky
  # board doesn't redden every pipeline.
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "feat/fpga-flow"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    # Wired to a real 2-member Pynq-Z2 chassis on mapstone-dev. The
    # fpgahub default grouping derives chassis ids from board names
    # (pynq_z2_02_ps + pynq_z2_02_pl → chassis pynq_z2_02), so no
    # config alias is involved — just point at whichever physical
    # pair the TideLink boards are wired to.
    FPGAHUB_PAIR_CHASSIS: "pynq_z2_02"
    FPGAHUB_LEASE_TTL_S:  "3600"
    FPGAHUB_LEASE_WAIT_S: "10800"
    FPGAHUB_MAX_REVOKES:  "5"
    FPGAHUB_BIN:          "/opt/fpgahub/bin/fpgahub"
  before_script:
    - export PATH="/opt/fpgahub/bin:$PATH"
    - '"$FPGAHUB_BIN" --version'
  script:
    - cd "$WORK_DIR"
    - bash ci/fpga_run_pair.sh
  after_script:
    - mkdir -p fpga/ci_logs
    - cp -r "$WORK_DIR/fpga/ci_logs/." fpga/ci_logs/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - fpga/ci_logs/
    reports:
      junit: fpga/ci_logs/results.xml
    expire_in: 30 days

# ----------------------------------------------------------------------------
# PHC PTP hardware test campaign — manual / scheduled only.
#
# The bringup_ptp_*.sh scripts each take ~minutes to hours; gating this
# behind `when: manual` (and the nightly scheduled-pipeline trigger) keeps
# main-branch pushes fast. The job acquires the same bridge1 chassis lease
# as fpga-pair via ci/fpga_run_ptp_pair.sh and runs the four scripts in
# order, stopping at the first failure.
#
# Pre-conditions enforced inside ci/fpga_run_ptp_pair.sh:
#   1. Lease GRANTED (not queued) on bridge1.
#   2. bringup_pair_converge.sh succeeds (16/16 + cal_done both sides).
#   3. Bitstream deployed (PHC-in-BD variant — feat/phc-hw-test).
# ----------------------------------------------------------------------------
fpga-ptp-pair:
  stage: fpga
  needs: [clone, preflight]
  tags: [fpga]
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "feat/phc-hw-test"'
      when: manual
  variables:
    FPGAHUB_PAIR_CHASSIS: "pynq_z2_02"
    FPGAHUB_LEASE_TTL_S:  "10800"     # 3 h (PTP sync+freq+offset+short soak)
    FPGAHUB_LEASE_WAIT_S: "10800"
    FPGAHUB_MAX_REVOKES:  "3"
    FPGAHUB_BIN:          "/opt/fpgahub/bin/fpgahub"
    # Defaults — override via web-pipeline variables when needed.
    PTP_SOAK_HOURS:       "1"
    PTP_DURATION:         "60"
  before_script:
    - export PATH="/opt/fpgahub/bin:$PATH"
    - '"$FPGAHUB_BIN" --version'
  script:
    - cd "$WORK_DIR"
    - bash ci/fpga_run_ptp_pair.sh
  after_script:
    - mkdir -p fpga/ci_logs/ptp
    - cp -r "$WORK_DIR/fpga/ci_logs/ptp/." fpga/ci_logs/ptp/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - fpga/ci_logs/ptp/
    expire_in: 30 days

# ============================================================================
# Stage 7: Synthesis
# ============================================================================
# Synthesise the full tidelink_top and individual modules using Design Compiler.
# tidelink_top requires XHB500 and Wlink IP — use WLINK_VERILOG_DIR to point
# to the generated Wlink output directory.

.dc_setup: &dc_setup
  before_script:
    - export PATH="$VCS_HOME/bin:$RTLA_HOME/bin:/eda/synopsys/syn/bin:$PATH"
    - export TIDELINK_HOME="$WORK_DIR"
    - export WLINK_VERILOG_DIR="$WORK_DIR/deps/axi-chiplet-controller/wav-wlink-hw/output_tidelink"

synth-fifo:
  stage: synthesis
  needs: [cocotb-regression]
  tags:
    - vcs
  <<: *dc_setup
  script:
    - cd "$WORK_DIR/syn/asic/design-compiler"
    - make MODULE=tidelink 2>&1 | tee dc_tidelink.log
    - make MODULE=tidelink_fc_adapter 2>&1 | tee dc_fc_adapter.log
  artifacts:
    when: always
    paths:
      - syn/asic/design-compiler/dc_*.log
    expire_in: 30 days
  allow_failure: true

synth-top:
  stage: synthesis
  needs: [cocotb-regression]
  tags:
    - vcs
  <<: *dc_setup
  script:
    - cd "$WORK_DIR/syn/asic/design-compiler"
    # tidelink_top with blackboxed XHB500/Wlink (faster, TideLink-only area)
    - make MODULE=tidelink_top 2>&1 | tee dc_tidelink_top.log
  artifacts:
    when: always
    paths:
      - syn/asic/design-compiler/dc_tidelink_top.log
    expire_in: 30 days
  allow_failure: true

synth-top-full:
  stage: synthesis
  needs: [cocotb-regression]
  tags:
    - vcs
  <<: *dc_setup
  script:
    - cd "$WORK_DIR/syn/asic/design-compiler"
    # Full tidelink_top with XHB500 bridges + Wlink (complete area estimate)
    - make MODULE=tidelink_top_full 2>&1 | tee dc_tidelink_top_full.log
  after_script:
    - mkdir -p syn/asic/design-compiler
    - cp "$WORK_DIR/syn/asic/design-compiler/dc_tidelink_top_full.log" syn/asic/design-compiler/ 2>/dev/null || true
    - cp -r "$WORK_DIR/syn/asic/design-compiler/tidelink_top_dc_reports" syn/asic/design-compiler/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - syn/asic/design-compiler/dc_tidelink_top_full.log
      - syn/asic/design-compiler/tidelink_top_dc_reports/
    expire_in: 30 days
  allow_failure: true

# Fusion Compiler partition flow + Formality LEC. The FC flow is ~2 h
# end-to-end so this is a manual one-click sign-off check, not a
# per-push gate. It runs init→synth→cts→route→signoff→abstract then
# LEC (RTL vs the FC netlist). FM_LEC_OK is the pass condition; the
# 256 documented Wlink-Chisel don't-verify residuals are expected and
# do NOT fail the run (the run_lec.tcl iterative-skip flow handles
# them and exits 0 on FM_LEC_OK).
formality-lec:
  stage: synthesis
  needs: [cocotb-regression]
  when: manual
  tags:
    - vcs
  <<: *dc_setup
  timeout: 4h
  script:
    - cd "$WORK_DIR/syn/asic/fusion-compiler"
    - make fc FC_CORE_UTILIZATION=0.70 2>&1 | tee fc_flow.log
    - cd "$WORK_DIR/syn/asic/formality"
    - make lec 2>&1 | tee lec.log
  after_script:
    - mkdir -p syn/asic/fusion-compiler syn/asic/formality
    - cp "$WORK_DIR/syn/asic/fusion-compiler/fc_flow.log" syn/asic/fusion-compiler/ 2>/dev/null || true
    - cp "$WORK_DIR/syn/asic/fusion-compiler/outputs/MANIFEST.md" syn/asic/fusion-compiler/ 2>/dev/null || true
    - cp -r "$WORK_DIR/syn/asic/fusion-compiler/reports" syn/asic/fusion-compiler/fc_reports 2>/dev/null || true
    - cp -r "$WORK_DIR/syn/asic/formality/reports" syn/asic/formality/lec_reports 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - syn/asic/fusion-compiler/fc_flow.log
      - syn/asic/fusion-compiler/MANIFEST.md
      - syn/asic/fusion-compiler/fc_reports/
      - syn/asic/formality/lec_reports/
    expire_in: 30 days
  allow_failure: true

# ============================================================================
# Stage 7: Coverage Merge
# ============================================================================

coverage-merge:
  stage: coverage
  needs:
    - job: clone
    - job: cocotb-regression
      artifacts: true
    - job: uvm-regression
      artifacts: true
    - job: cocotb-fc-adapter
      artifacts: true
    - job: cocotb-top
      artifacts: true
    - job: cocotb-ptp
      artifacts: true
    - job: uvm-fc-adapter
      artifacts: true
    - job: uvm-integration
      artifacts: true
    - job: uvm-top-system
      artifacts: true
    - job: cocotb-system
      artifacts: true
    - job: cocotb-wlink-pair
      artifacts: true
    - job: uvm-system
      artifacts: true
    - job: uvm-ptp-stress
      artifacts: true
    - job: uvm-ptp-chain
      artifacts: true
  tags:
    - vcs
  before_script:
    - export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
  script:
    - |
      echo "========================================"
      echo " Merging VCS Coverage Databases"
      echo "========================================"

      # Collect all VDB directories that exist
      VDB_DIRS=""
      for vdb in coverage_vdbs/cocotb/*.vdb coverage_vdbs/uvm/*.vdb; do
        if [ -d "$vdb" ]; then
          VDB_DIRS="$VDB_DIRS -dir $vdb"
          echo "  Found: $vdb"
        fi
      done

      if [ -z "$VDB_DIRS" ]; then
        echo "WARNING: No VDB coverage databases found. Skipping merge."
        exit 0
      fi

      echo ""
      echo "-- Merging all databases ----------------"
      urg -full64 $VDB_DIRS \
        -report merged_coverage_report \
        -format both \
        -metric line+cond+fsm+tgl+branch \
        2>&1 | grep -E 'Note|Error|Warning' || true

      echo ""
      echo "-- Coverage Summary ---------------------"
      if [ -f merged_coverage_report/dashboard.txt ]; then
        cat merged_coverage_report/dashboard.txt
      else
        echo "  (dashboard.txt not found)"
      fi

      echo ""
      echo "Coverage report: merged_coverage_report/dashboard.html"
  artifacts:
    when: always
    paths:
      - merged_coverage_report/
    expose_as: "Merged Coverage Report"
    expire_in: 30 days

# ============================================================================
# Stage 8: Dashboard
# ============================================================================

dashboard:
  stage: pages
  needs:
    - job: hal-lint
      artifacts: true
    - job: spyglass-cdc
      artifacts: true
    - job: cocotb-regression
      artifacts: true
    - job: uvm-regression
      artifacts: true
    - job: cocotb-fc-adapter
      artifacts: true
    - job: cocotb-top
      artifacts: true
    - job: cocotb-ptp
      artifacts: true
    - job: uvm-fc-adapter
      artifacts: true
    - job: uvm-integration
      artifacts: true
    - job: uvm-top-system
      artifacts: true
    - job: cocotb-system
      artifacts: true
    - job: cocotb-wlink-pair
      artifacts: true
    - job: uvm-system
      artifacts: true
    - job: uvm-ptp-stress
      artifacts: true
    - job: uvm-ptp-chain
      artifacts: true
    - job: coverage-merge
      artifacts: true
  script:
    - export PYTHONPATH="$WORK_DIR/ci:$PYTHONPATH"
    # Generate HTML dashboard (artifact)
    - python3 "$WORK_DIR/ci/generate_dashboard.py"
    # Generate Markdown and push to wiki
    - export WIKI_OUTPUT_DIR="$(mktemp -d)"
    - python3 "$WORK_DIR/ci/generate_wiki.py"
    - |
      WIKI_PUSH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git"
      WIKI_DIR="$(mktemp -d)/wiki-repo"

      # Clone or initialise the wiki repo
      if git clone "$WIKI_PUSH_URL" "$WIKI_DIR" 2>/dev/null; then
        echo "Wiki repo cloned"
      else
        echo "Wiki repo does not exist yet -- initialising"
        mkdir -p "$WIKI_DIR"
        cd "$WIKI_DIR" && git init && git remote add origin "$WIKI_PUSH_URL"
      fi

      # Copy generated page into the wiki
      cp "$WIKI_OUTPUT_DIR/CI-Dashboard.md" "$WIKI_DIR/CI-Dashboard.md"

      cd "$WIKI_DIR"
      git add CI-Dashboard.md
      if git diff --cached --quiet; then
        echo "No changes to wiki -- skipping push"
      else
        git config user.name "CI Bot"
        git config user.email "ci@tidelink.soclabs.org"
        git commit -m "Update CI Dashboard (pipeline #${CI_PIPELINE_ID})"
        git push origin HEAD 2>&1 || echo "WARNING: Wiki push failed (check project wiki is enabled)"
      fi
  artifacts:
    paths:
      - public
    expose_as: "CI Dashboard"
    expire_in: 30 days
  when: always

# ============================================================================
# Stage 9: Cleanup
# ============================================================================

cleanup:
  stage: cleanup
  when: always
  script:
    - rm -rf "$WORK_DIR" || true
    - echo "Cleaned up $WORK_DIR"

# ============================================================================
# Stage 11 (new): HW Test Suite — manual / nightly
# ============================================================================
# Runs pynq_host/scripts/hwtest/run_all.sh against the bridge1 PYNQ-Z2 pair.
# Manual trigger by default; can be put on a nightly schedule via a CI/CD
# scheduled pipeline (rules below check for SCHEDULE_HWTEST=1).
#
# This stage does NOT modify the existing `fpga` stage — that one runs the
# ci_pair_role_aware test; hwtest is the broader register/AHB/PTP suite.
# Both can coexist; they share the same fpgahub lease mechanism.
#
# Safety: run_all.sh defaults to HWTEST_INCLUDE=1,2,3,4,6,7,8,10,11,12 — the
# safe subset (no AHB_TX storm, no PTP HW sync, no long soak). Heavier
# subsets are opt-in via the HWTEST_INCLUDE pipeline variable.

hwtest:safe:
  stage: hwtest
  tags:
    - bridge1-runner   # must have mapstone-dev SSH access + fpgahub
  rules:
    # Auto if SCHEDULE_HWTEST=1 (e.g. nightly schedule); manual otherwise.
    - if: '$SCHEDULE_HWTEST == "1"'
      when: always
    - when: manual
  allow_failure: true
  variables:
    HWTEST_INCLUDE: "safe"
    HWTEST_ACQUIRE_LEASE: "1"
    HWTEST_LEASE_TTL: "3600"
    HWTEST_BAIL_ON_FAIL: "0"
  script:
    - echo "Running TideLink HW test suite (subset=$HWTEST_INCLUDE)"
    - bash pynq_host/scripts/hwtest/run_all.sh
  after_script:
    - mkdir -p hwtest-logs
    - cp -r /tmp/tidelink_hwtest_logs/* hwtest-logs/ 2>/dev/null || true
  artifacts:
    name: "hwtest-${CI_PIPELINE_ID}"
    paths:
      - hwtest-logs/
    expire_in: 30 days
    when: always

# Heavier variant — includes AHB_TX storm + PTP HW sync. Manual only,
# never auto-scheduled, because cat 5 requires a 100%-verified-up link.
hwtest:full:
  stage: hwtest
  tags:
    - bridge1-runner
  when: manual
  allow_failure: true
  variables:
    HWTEST_INCLUDE: "all"
    HWTEST_EXCLUDE: "13"
    HWTEST_ACQUIRE_LEASE: "1"
    HWTEST_LEASE_TTL: "7200"
    AHB_TX_TIMEOUT_S: "5"
    N_AHB_TX: "64"
  script:
    - echo "Running FULL TideLink HW test suite"
    - bash pynq_host/scripts/hwtest/run_all.sh
  after_script:
    - mkdir -p hwtest-logs
    - cp -r /tmp/tidelink_hwtest_logs/* hwtest-logs/ 2>/dev/null || true
  artifacts:
    name: "hwtest-full-${CI_PIPELINE_ID}"
    paths:
      - hwtest-logs/
    expire_in: 30 days
    when: always

# Long-soak variant — runs cat 13 only, configurable duration.
hwtest:soak:
  stage: hwtest
  tags:
    - bridge1-runner
  when: manual
  allow_failure: true
  variables:
    HWTEST_INCLUDE: "13"
    HWTEST_ACQUIRE_LEASE: "1"
    HWTEST_LEASE_TTL: "32400"   # 9h, slightly over the default 8h soak
    SOAK_SECS: "28800"          # 8h
    SAMPLE_GAP_S: "30"
  script:
    - echo "Running TideLink HW soak ($SOAK_SECS s)"
    - bash pynq_host/scripts/hwtest/run_all.sh
  after_script:
    - mkdir -p hwtest-logs
    - cp -r /tmp/tidelink_hwtest_logs/* hwtest-logs/ 2>/dev/null || true
  artifacts:
    name: "hwtest-soak-${CI_PIPELINE_ID}"
    paths:
      - hwtest-logs/
    expire_in: 30 days
    when: always
