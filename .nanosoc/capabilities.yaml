# -----------------------------------------------------------------------------
# .nanosoc/capabilities.yaml — what TideLink can test, declared by TideLink.
# Copyright 2026, SoC Labs (www.soclabs.org)
# -----------------------------------------------------------------------------
# Read by the nanoSoC release manager AT THE COMMIT UNDER TEST (decision 2,
# 2026-10-16). Schema: nanoSoC-Release-Manager schemas/capabilities.schema.json.
# Per-host facts (tool paths, licence servers, Arm IP roots) are NOT here; they
# live in the release manager's registry, per host (site.env.example names them).
#
# Measured 2026-10-16 at main cd80a036 on an EDA host, clean environment
# (env -i PATH=<python3.8>:/usr/bin:/bin TIDELINK_PHY_V2=1), deps/ checked out:
#   secrets-check          rc 0, 6 s
#   farm_gate_fast         rc 0, 1 s   (python3 >= 3.7: cocotb/lint/xdc_lint.py
#                                       uses `from __future__ import annotations`;
#                                       with python3.6 it cannot evaluate)
#   xdc_lint_selftest      rc 0, 1 s, 7/7 fixtures
#   synth_lint_selftest    rc 0, <1 s, 4/4 fixtures (Verilator 4.028)
#   site-check             rc 1: 5 violations on main (declared report)
#   lint-standalone (HAL)  rc 1: flists/tidelink_fifo_ctrl.flist does not exist
#                          (declared report)
#   xhb500-check           rc 1 until deps/xhb500/generated is rendered
#   vendor-check           needs ASIC_TOOLKIT_DIR (sibling; inside the eth
#                          superproject it is found at ../ASIC/asic-toolkit)
# Not run here (they need set_env.sh, which nothing may source, and 40-55 min):
# sim_gate_quick, sim_gate_regressions, cdc, synth, coverage.
# -----------------------------------------------------------------------------
schema: 1
component: tidelink

env:
  provides:
    TIDELINK_HOME: "${TREE}"
    XHB500_GEN_DIR: "${TREE}/deps/xhb500/generated"
    TIDELINK_PHY_V2: "1"
  site:                                  # what set_env.sh requires today
    - {name: CMSDK_DIR, what: "Arm Cortex-M System Design Kit root", arm_ip: true}
    - {name: XHB500_IP_DIR, what: "Arm XHB-500 bridge IP root (renders deps/xhb500/generated)", arm_ip: true}
    - {name: CMSDK_FPGA_SRAM_V, what: "cmsdk_fpga_sram.v when CMSDK lacks it", arm_ip: true, optional: true}
    - {name: VCS_HOME, what: "VCS install root"}
    - {name: SNPSLMD_LICENSE_FILE, what: "Synopsys licence server (VCS, SpyGlass, DC)"}
    - {name: CDS_LIC_FILE, what: "Cadence licence server (HAL)", optional: true}
  siblings:                              # Makefile PHC_HOME, TIDECHART_HOME, CHIPLET_HOME, ETH_SS_HOME
    - {name: TIDECHART_HOME, component: tidechart, for: [sim-gate]}
    - {name: PHC_HOME, component: ptp-hardware-clock-ahb, for: [sim-gate]}
    - {name: ETH_SS_HOME, component: ethernet-subsystem-ahb, for: [sim-gate]}
    - {name: CHIPLET_HOME, component: nanosoc-ethernet-chiplet, for: [sim-gate]}
    - {name: ASIC_TOOLKIT_DIR, component: asic-toolkit, for: [vendor-check]}

tools:
  python3:   {probe: "python3 --version", min: "3.7"}
  verilator: {probe: "verilator --version", min: "4.028"}
  vcs:       {probe: "vcs -ID", min: "T-2022.06-SP2", licence: synopsys, seat: vcs}
  cocotb:    {probe: "cocotb-config --version", min: "1.7"}
  hal:       {probe: "hal -version", min: "22.03", licence: cadence, seat: xcelium}
  spyglass:  {probe: "spyglass -version", min: "2022.06-SP2", licence: synopsys, seat: spyglass}
  dc:        {probe: "dc_shell -version", min: "2022.12", licence: synopsys, seat: dc}

capabilities:
  - id: secrets
    kind: static
    tier: t0
    run: make secrets-check
    tools: [python3]
    budget_s: 120
    runtime: S
    verdict: {exit: 0, require: [{pattern: "check-secrets: PASS"}]}
    gate: block

  - id: vendor-check
    kind: static
    tier: t0
    run: make vendor-check
    budget_s: 300
    runtime: S
    gate: block
    notes: >-
      Runs the toolkit's content scanner. Standalone it needs
      `make vendor-check ASIC_TOOLKIT_DIR=<toolkit checkout>`; a missing
      scanner is a FAIL, not a skip.

  - id: lint-fast
    kind: lint
    tier: t1
    run: make farm_gate_fast
    tools: [python3]
    budget_s: 300
    runtime: S
    affected_by: [deps/tidelink-phy, deps/tidelink-gpio-phy]
    verdict: {exit: 0, require: [{pattern: "GATE GREEN"}], forbid: ["COULD NOT EVALUATE"]}
    gate: block
    notes: "xdc_lint + sv_anti_pattern, ratcheted; V2 needs deps/tidelink-phy checked out."

  - id: lint-selftest
    kind: lint
    tier: t1
    run: make xdc_lint_selftest synth_lint_selftest
    tools: [python3, verilator]
    budget_s: 300
    runtime: S
    verdict: {exit: 0, require: [{pattern: "7/7 fixtures behaved as expected"}, {pattern: "4/4 fixtures behaved as expected"}]}
    gate: block
    notes: "Proves the two linters still fire on their seeded fixtures."

  - id: site-check
    kind: static
    tier: t1
    run: make site-check
    budget_s: 120
    runtime: S
    control: make site-check-selftest
    gate: report
    notes: "Red on main cd80a036 (5 violations, e.g. a VERDI_HOME default in cocotb/xhb500_bridge/Makefile:34). Promote to block when clean."

  - id: xhb500-check
    kind: static
    tier: t1
    run: make xhb500-check
    budget_s: 120
    runtime: S
    needs: [regen:xhb500]
    affected_by: []
    gate: block
    notes: "Digest check of deps/xhb500/generated, which set_env.sh renders from XHB500_IP_DIR."

  - id: hal-lint
    kind: lint
    tier: t2
    run: make -C lint lint-standalone
    tools: [hal]
    needs: [xcelium-seat]
    budget_s: 900
    runtime: M
    affected_by: [deps/axi-chiplet-controller]
    gate: report
    notes: "Broken on main cd80a036: flists/tidelink_fifo_ctrl.flist (and the other per-module flists) do not exist."

  - id: sim-gate-quick
    kind: sim
    tier: t3
    run: make sim_gate_quick
    tools: [vcs, cocotb]
    needs: [vcs-seat, regen:xhb500]
    budget_s: 3600
    runtime: L
    affected_by: [deps/tidelink-phy, deps/tidelink-gpio-phy, deps/axi-chiplet-controller]
    verdict: {exit: 0, rows: {format: tidelink-sim-gate, path: imp/sim_gate/summary.tsv}}
    gate: block
    notes: "t30 + 8 v2 suites. sim_gate_env_check wants vcs and cocotb-config on PATH (set_env.sh today)."

  - id: sim-gate
    kind: sim
    tier: t3
    run: make sim_gate_regressions
    tools: [vcs, cocotb]
    needs: [vcs-seat, regen:xhb500, siblings]
    budget_s: 5400
    runtime: L
    affected_by: [deps/tidelink-phy, deps/tidelink-gpio-phy, deps/axi-chiplet-controller]
    verdict: {exit: 0, rows: {format: tidelink-sim-gate, path: imp/sim_gate/summary.tsv}}
    gate: block
    when: [nightly, release, on_bump]
    notes: "selfcheck_gates + registry coverage + 111 sim_gate_* targets (~40-55 min)."

  - id: cdc
    kind: cdc
    tier: t3
    run: make -C cdc cdc
    tools: [spyglass]
    needs: [spyglass-seat]
    budget_s: 3600
    runtime: L
    gate: report

  - id: synth
    kind: synth
    tier: t3
    run: make -C syn/asic/design-compiler syn
    tools: [dc]
    needs: [dc-seat]
    budget_s: 7200
    runtime: L
    gate: report
    when: [nightly, release]

  - id: coverage
    kind: sim
    tier: t3
    run: make coverage_gate
    tools: [vcs]
    needs: [vcs-seat, network]
    budget_s: 10800
    runtime: L
    gate: report
    when: [nightly]
    notes: "Compares against an Artifactory baseline, hence network."

  - id: hw-safe
    kind: hw
    tier: t5
    run: bash pynq_host/scripts/hwtest/run_all.sh
    needs: ["board:tidelink-pair", "lease:fpgahub"]
    manual: true
    gate: report
