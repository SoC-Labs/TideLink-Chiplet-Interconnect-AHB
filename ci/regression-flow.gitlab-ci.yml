# =============================================================================
# TideLink V1 silicon BILATERAL regression flow  (build -> deploy -> test)
# =============================================================================
# A self-contained pipeline for the V1 8-lane silicon bilateral link
# (bridge1 PYNQ-Z2 pair, baseline tag v1-silicon-bilateral-2026-06-23).
#
# It is `include:`d from the top-level .gitlab-ci.yml and adds three stages
# that are deliberately SEPARATE from the existing sim/lint/synthesis/hwtest
# stages — its own cheap sim gate plus the heavy, board-bound build + deploy.
#
# WHY NOT PER-COMMIT (the core constraint):
#   * an FPGA flip build is ~45 min/half (8-lane closes slowly),
#   * the HW regression is ~35 min and needs the SHARED bridge1 boards under a
#     single fpgahub lease.
#   Running either per push would serialise every commit behind hardware and
#   starve interactive board users. So:
#     - v1-sim-gate      : every push/MR (cheap, no boards) — catches RTL regs.
#     - v1-build-flip    : manual OR nightly schedule (Vivado runner).
#     - v1-deploy-test   : manual OR nightly schedule (HW runner) — the real
#                          bilateral PASS/FAIL on silicon.
#   See docs/CI_REGRESSION.md for the trigger model + runner registration.
#
# RUNNER TAGS used here:
#   vcs                 existing sim runner (already registered) — sim gate.
#   tidelink-fpga-build Vivado 2024.1 + /research IP + ssh to the farm host(s).
#   tidelink-hw         key-based SSH alias `mapstone-dev` (user david). This is
#                       the new HW runner the flow needs; if it is not yet
#                       registered the deploy_test job simply stays `manual` and
#                       never runs — pipelines stay green. See docs/CI_REGRESSION.md.
# =============================================================================

# NOTE: stages are declared in the TOP-LEVEL .gitlab-ci.yml `stages:` list
# (regression / v1_build / v1_deploy_test) — not re-declared here, to avoid a
# merge conflict between the included and parent stage lists. The jobs below
# reference those stage names.

# -- shared rules -------------------------------------------------------------
# The heavy stages run when:
#   * a nightly/scheduled pipeline fires with RUN_V1_REGRESSION=1, OR
#   * a developer clicks ▶ on the manual job (web / MR), OR
#   * pushing the dedicated ci/regression-flow branch (so the flow is testable).
.v1_heavy_rules: &v1_heavy_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_V1_REGRESSION == "1"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "ci/regression-flow"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: manual            # default: opt-in click, never auto per-commit

# ============================================================================
# Stage A — cheap sim gate (every push / MR)
# ============================================================================
# Reuses the integrated paired-die cocotb sim (the pre-silicon analogue of the
# B<->A link) as the per-commit RTL guard. Non-blocking on HW: if this is red,
# nobody should bother kicking the build/deploy stages.
v1-sim-gate:
  stage: regression
  tags: [vcs]
  # Reuse the top-level clone/preflight workspace ($WORK_DIR), like the
  # existing cocotb jobs, so the pair flist + XHB500 IP are in place.
  needs: [clone, preflight]
  variables:
    SIM_ENVS: "tidelink_top_pair"
    SIM_MODULE: "test_tidelink_pair_doorbell"
  before_script:
    - export PATH="$VCS_HOME/bin:$VERDI_HOME/bin:$PATH"
    - export TIDELINK_HOME="$WORK_DIR"
    - export CMSDK_DIR="$CMSDK_DIR"
    - python3 -m pip install --user cocotb cocotbext-ahb --quiet 2>/dev/null || true
  script:
    - cd "$WORK_DIR"
    - RESULT_DIR="$WORK_DIR/ci_artifacts/sim" bash ci/v1_sim_gate.sh
  after_script:
    - mkdir -p v1_sim
    - cp "$WORK_DIR/ci_artifacts/sim/"*.results.xml v1_sim/ 2>/dev/null || true
    - cp "$WORK_DIR/ci_artifacts/sim/"*.run.log      v1_sim/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - v1_sim/
    reports:
      junit:
        - v1_sim/*.results.xml
    expire_in: 30 days
  # This DOES gate on RTL: a broken pair sim should redden the pipeline.
  allow_failure: false

# ============================================================================
# Stage B — build the die_b flip bitstream (manual / scheduled)
# ============================================================================
# Builds both halves of the pair (die_a non-flip + die_b flip) on a Vivado
# runner and exports the .bit/.bin/.hwh as CI artefacts for deploy_test.
# Build both so a single nightly artefact set supports a cold re-deploy; set
# BUILD_TARGETS to just the flip half during a fix campaign.
v1-build-flip:
  stage: v1_build
  tags: [tidelink-fpga-build]
  <<: *v1_heavy_rules
  timeout: 8h           # 8-lane pair closes slowly; ~45 min/half on a quiet host
  # Self-contained: this job is manual/scheduled and must run even when the
  # top-level clone/preflight jobs didn't (override the global GIT_STRATEGY:none
  # so GitLab checks the repo out natively into $CI_PROJECT_DIR with submodules).
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
    BUILD_TARGETS: "pynq-z2-pair-all@local pynq-z2-pair-flip-all@srv04936"
    ARM_IP_LIBRARY_PATH: "/research/AAA/ip_library"
  before_script:
    - export TIDELINK_HOME="$CI_PROJECT_DIR"
    - cd "$CI_PROJECT_DIR"
  script:
    - ARTIFACT_DIR="$CI_PROJECT_DIR/ci_artifacts/fpga" bash ci/v1_build_flip.sh
  after_script:
    - mkdir -p fpga_bits
    - cp -r "$CI_PROJECT_DIR/ci_artifacts/fpga/." fpga_bits/ 2>/dev/null || true
    - cp -r "$CI_PROJECT_DIR/imp/fpga/run/farm/." fpga_bits/farm_logs/ 2>/dev/null || true
  artifacts:
    name: "v1-bits-${CI_PIPELINE_ID}"
    when: always
    paths:
      - fpga_bits/
    expire_in: 14 days

# ============================================================================
# Stage C — deploy to bridge1 + run the bilateral regression (manual / scheduled)
# ============================================================================
# Stages the built bitstreams to mapstone-dev, runs td_bilateral_regression.sh
# (B->A gate + A->B lottery sample), emits JUnit + a PASS/FAIL exit code, and
# ALWAYS releases the fpgahub lease (the gate's own EXIT trap + a belt-and-
# braces release in the wrapper).
#
# ATOB_MIN policy (see docs/CI_REGRESSION.md):
#   * =1 on the CURRENT baseline (A->B is a ~13% marginal-RX lottery): the gate
#     proves A->B is not TOTALLY dead without demanding the unfixed eye behave.
#   * raise to 12 (of 15) AFTER the die_b flip-XDC BUFG / word-window fix lands,
#     so an A->B *reliability* regression reddens the gate.
v1-deploy-test:
  stage: v1_deploy_test
  tags: [tidelink-hw]
  <<: *v1_heavy_rules
  # Real silicon, marginal-eye lottery: do NOT redden the whole pipeline on a
  # single flaky bring-up. The JUnit + exit code still record the verdict, and
  # a scheduled run that wants a hard gate can set this false via a CI var.
  allow_failure: true
  timeout: 90m
  needs:
    # Consume the freshly built bitstreams when the build job ran in the same
    # pipeline; if it didn't (USE_PINNED_BITS path), the artefacts are optional.
    - job: v1-build-flip
      artifacts: true
      optional: true
  variables:
    GIT_STRATEGY: clone         # self-contained: get ci/ + pynq_host/scripts/
    MAPSTONE_SSH: "mapstone-dev"
    ARTIFACT_DIR: "$CI_PROJECT_DIR/fpga_bits"
    BIT_A_SRC: "$CI_PROJECT_DIR/fpga_bits/pynq-z2-pair-all/tidelink.bit"
    BIT_B_SRC: "$CI_PROJECT_DIR/fpga_bits/pynq-z2-pair-flip-all/tidelink.bit"
    # If no build artefact is present, fall back to the pinned bitstreams
    # already staged in ~/td_v1_deploy on mapstone-dev. Default 0 = use the
    # build artefact; a scheduled "test-only" pipeline can set this to 1.
    USE_PINNED_BITS: "0"
    PROOF: "program"
    ATOB_MIN: "1"          # baseline; raise to 12 after the word-window fix
    ATOB_RUNS: "15"
    ROLLS: "15"
    BTOA_TRIES: "2"
    RESULT_DIR: "$CI_PROJECT_DIR/v1_regression"
  script:
    - cd "$CI_PROJECT_DIR"
    # If the build job didn't run in this pipeline, switch to pinned bits.
    - |
      if [ ! -f "$BIT_B_SRC" ] && [ "$USE_PINNED_BITS" != "1" ]; then
        echo "no build artefact at $BIT_B_SRC — falling back to USE_PINNED_BITS=1"
        export USE_PINNED_BITS=1
      fi
    - bash ci/v1_deploy_test.sh
  after_script:
    - mkdir -p v1_regression
    - cp -r "$CI_PROJECT_DIR/v1_regression/." v1_regression/ 2>/dev/null || true
  artifacts:
    name: "v1-regression-${CI_PIPELINE_ID}"
    when: always
    paths:
      - v1_regression/
    reports:
      junit: v1_regression/bilateral_junit.xml
    expire_in: 30 days
