# =============================================================================
# TideLink chiplet interconnect — KNOWN-BUG REGISTRY
# =============================================================================
# Single source of truth for outstanding + recently-resolved bugs on the
# TideLink GPIO PHY V2 chiplet interconnect (KR260 two-board eth-chiplet pair,
# XHB500 AHB<->AXI bridge, axi_chiplet_controller / Wlink FC nodes).
#
# This file is machine-referenceable and human-signable. Agents update the
# per-bug `status`, `fix`, and `verification` blocks; the human approver owns
# the final `signoff.approved` flag.
# -----------------------------------------------------------------------------
schema_version: 2                # 2 (2026-09-11): hardware claims now carry
                                 # verification.evidence + verification.vehicle,
                                 # machine-enforced by scripts/ci/registry_coverage.py
generated: 2026-08-06
last_truth_pass: 2026-09-11      # see campaign.truth_pass_2026_09_11
maintainer: autonomous overnight campaign (Claude Opus 4.8)
approver: David Mapstone <david@mapstone.me>

# ---- STATUS LIFECYCLE -------------------------------------------------------
# open        : not yet root-caused
# root_caused : mechanism understood, no working fix yet
# fix_built   : fix implemented in RTL/scripts, not yet verified
# sim_proven  : reproduce-first sim test PASSES with fix / FAILS without it
# hw_proven   : verified on the KR260 pair (byte-exact / defect gone)
# signed_off  : human approver has set signoff.approved: true
# deferred    : needs a decision or a separate workstream before progress
# wontfix     : accepted as-is / out of scope
# -----------------------------------------------------------------------------
legend:
  severity: [rank1_critical, high, medium, low, fyi]
  status: [open, root_caused, fix_built, sim_proven, hw_proven, signed_off, deferred, wontfix, closed]
  vehicle: [onchip, eth-pair, z2, asic-mirror-sim]   # the ONLY legal verification.vehicle values

# ---- HARDWARE-PROOF EVIDENCE DISCIPLINE (added 2026-09-11) -------------------
# Added because the 2026-09-11 truth pass found all three `hw_proven` entries
# (TL-003, TL-005, TL-007) resting on PROSE in docs/ rather than on a retained
# artefact, and the same failure had already been written down eleven months of
# project-time earlier in imp/hw_gate/SIGNOFF_LEDGER_2026_08_13.md without any
# entry being demoted. A verdict nobody can re-check is not a verdict.
#
# RULE (machine-enforced, scripts/ci/registry_coverage.py --hw-evidence):
#   An entry whose `status` is hw_proven or signed_off, OR whose
#   `verification.hw_validated` is true, MUST carry BOTH:
#     verification.evidence : a repo-relative path (or list of paths) that a
#                             script can stat(). A narrative .md is acceptable
#                             ONLY if it is the artefact itself; prefer the raw
#                             capture (.csv/.jsonl/.log/verdict file).
#     verification.vehicle  : exactly one value from legend.vehicle above.
#   Anything else is a HARD FAIL. `hw_evidence:` (free text) stays as colour but
#   never satisfies the rule on its own.
#
#   Control: scripts/ci/tests/test_registry_hw_evidence.py — feeds synthetic
#   registries to the real checker and requires it to go RED. Run via
#   `make selfcheck_registry_hw_evidence`.
hw_evidence_policy:
  required_for: [status:hw_proven, status:signed_off, "verification.hw_validated: true"]
  required_fields: [verification.evidence, verification.vehicle]
  vehicle_enum: [onchip, eth-pair, z2, asic-mirror-sim]
  checker: scripts/ci/registry_coverage.py
  control: scripts/ci/tests/test_registry_hw_evidence.py

# ---- SIGN-OFF MECHANISM -----------------------------------------------------
# Every bug carries a `signoff` block:
#   claude_verdict : Claude's evidence-backed claim about the fix state
#   evidence       : list of concrete artefacts (commit sha, test path+result,
#                    HW log line, APB register read) supporting the verdict
#   approved       : true ONLY when the human approver signs off (never by Claude)
#   approved_by / approved_date : filled at sign-off time
# Claude may advance `status` up to `hw_proven` autonomously with evidence.
# `signed_off` requires approver action. Anything that (a) changes the netlist
# on the tapeout trunk, (b) pushes to a public default branch, or (c) is a
# rig/architecture decision is a DECISION and is never auto-signed.
signoff_policy:
  auto_signoff_allowed: false
  claude_max_status: hw_proven
  approver: David Mapstone
  how_to_sign: >
    Set signoff.approved: true, signoff.approved_by, signoff.approved_date on a
    bug whose status is hw_proven (or sim_proven where HW is not applicable) and
    whose evidence you accept. Bulk sign-off: set campaign.signed_off_by/date
    once every rank1_critical + high bug is individually approved.

