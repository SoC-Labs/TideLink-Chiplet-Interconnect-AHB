  - id: TL-009
    title: die_a PS wedge under sustained cross-die writes — per-write leak (REFRAMED 08-07)
    severity: high
    area: rtl/write-path   # REFRAMED from phy/physical
    status: root_caused    # localized; exact leaked resource needs PS-PL ILA
    summary: >
      die_a's PS goes UNREACHABLE (silent hang) after ~10-20 cross-die writes.
      2026-08-07 exhaustive HW characterization REFRAMES this from "marginal eye":
      it is a DIGITAL per-write cumulative resource LEAK on die_a's OUTBOUND
      cross-die write path, invisible to every available instrument.
    ground_truth_2026_08_07:
      - "Region F OBS_AXI_NODES (0x21E0) reads HEALTHY (0xad800000, zero wedge/resp-err/stall) on BOTH dies right up to the wedge => NOT an FC-node wedge."
      - "die_a kernel log is SILENT at the wedge (no SError/panic/lockup/fault) => REFUTES the SLVERR->SError theory. pstore empty."
      - "The cross-die write DATA path WORKS: data lands BYTE-EXACT until the wedge (16/16 in the clean single-process soak; die_b 0x2D001000=0xA5A50009 confirms write #9 landed)."
      - "PACING does NOT help: 100ms-spaced writes (~1 outstanding) wedge within ~20 too => NOT outstanding-write concurrency/pile-up. REFUTES the serialize-to-1 fix (confirmed before building)."
      - "Wedge count: pure-write ~10, read-paced soak ~17, per-write-churn ~4 => a per-write leak with run-to-run noise, worse under process/CAM churn."
      - "Wedge-safe soak (single guarded process) ALSO wedges => not a harness artifact; the leak is real."
    fix:
      approach: >
        LOCALIZED (0x21F8, 235d758): a write-stall cascade from a dropped W/B
        round-trip on a bad-framing bring-up. WEDGE-FIX FEASIBILITY (agent 08-07):
        NO clean local wedge fix. The AW-block is FAR-SIDE bilateral backpressure —
        the Wlink a2l replay window is freed ONLY by a far-die ACK packet, depth
        granted by far-die fe_tx_credit_max (WlinkGenericFCSM.v:630/670/814).
        Posted-write = ineffective (AW/W still need a far ACK). Local abandon /
        forge-ACK = DESYNCS the link -> silent corruption (rejected). synth-B
        already does the near-die max (drains sub_wr_os_ctr, Fix K bid). => FIX THE
        ROOT (framing) so the far side receives+ACKs and the window frees naturally.
        Only bilateral-safe stopgap = a link RETRAIN on the wedge witness
        (heavyweight, needs bilateral coordination). buf=0 => NOT EWR/hazard (Fix K
        N/A). NOT serialize-to-1 (refuted). flist: FCSM edits reach FPGA-V2 only;
        the ASIC flist uses the deps FCSM.
        ROOT-FIX OPTIONS (framing, all substantial): calibrator peer-aware S_HOLD
        release (Agent-1 Cand-D, additive+backstopped); autonomous bilateral
        training coordination (self-arm); witness-triggered retrain; OR accept the
        runtime FIX3 bilateral-training pulse as a bring-up step (proven 11/11); OR
        physical eye (re-pin die_b SRCC). FIX3 proves the framing IS fixable.
      files: [src/rtl/tidelink_top.sv]
      commit: null
      branch: null
      netlist_affecting: true
    LOCALIZED_2026_08_07: >
      The leak-witness register 0x21F8 (obs commit 235d758, branch
      fix/tl001-calibrator-terminal-latch) made the wedge VISIBLE from APB — NO ILA
      needed. On a bad-framing bring-up the FIRST cross-die write reads
      0x21F8=0xb5000521: stall=1 (XHB500 AHB bridge hreadyout stuck-low >=2^12 =>
      far-B never returned), wr_stuck=1 (synth-B backstop fired), HWM=1, buf=0
      (non-bufferable => NOT the EWR/hazard-list path, Fix K N/A). die_b 0x2D001000=0
      (drop), die_a wedged at w4. => the wedge is a WRITE-STALL CASCADE: bad framing
      drops the W/B round-trip -> no far-B -> ~2^16 stall -> synth-B -> repeated
      stuck writes accumulate a link/FC-node resource -> wedge (~4 fully-bad
      bring-up, ~17 mostly-good). SAME framing root as the data-drop; a good
      bring-up lands 16/16 with no stall/wedge. OVERTURNS 'below-obs SmartConnect leak'.
    needs: "No ILA — root-caused via the 0x21F8 witness. Fix path in fix.approach."
    verification: {sim_test: none, in_sim_gate: false, hw_tested: "characterized, not fixed"}
    signoff:
      claude_verdict: "LOCALIZED (0x21F8, 235d758) = WRITE-STALL CASCADE (dropped W/B -> no far-B -> ~2^16 stall -> synth-B -> accumulation -> wedge). FIX D (peer-aware S_HOLD, 20af2b1) BUILT+HW-TESTED: correct but NOT sufficient (W data-crossing better 3/4, but die_a wedges 4/4, stall=1). CORRECTION (routed-timing check, 08-07): my earlier 'die_a RX-capture WNS drops the B' attribution is WRONG — the pad_clk_rx RX-capture paths MEET at +0.486ns; the -2.862 WNS is path-group **async_default** and the -23 WHS is pad_clk_tx_fwd (benign TX-fwd artifact); a sibling build closed WNS to +0.399. So the residual is PHYSICAL FRAMING/EYE VARIANCE that STA cannot measure, NOT a capture-WNS margin. ACTIONABLE LEVER FOUND: the P-B-lottery killer (shared-cap BUFG hoist, commit 2c32c2b) is CONFIRMED ABSENT from the deployed netlist (grep g_shared_cap_bufg=0); RTL exists WavD2DGpio_v2.v:1696-1740 gated USE_SHARED_CAP_BUFG but blocked by the OOC-IP-define trap. STA-proven 9.8x tighter capture-clock spread + placement-invariant => directly attacks the per-POR/per-build lottery. NEXT = port the hoist into the eth-chiplet build (USE_SHARED_CAP_BUFG=1, NEVER USE_CAP_CLKBUF), structurally verify via check_wrapper_params.sh, HW A/B the land-rate. Decisive: deterministic bring-up => physical skew confirmed; still-flaky => calibrator logic (FIX 2). FIX 2 DONE+HW-TESTED (Hamming 5->6, commit 2c249ec): W-direction data-crossing improved MARKEDLY — all 4 PORs landed, cyc2/3 crossed 37-50 writes byte-exact (vs baseline ~4-17), die_a survived ~10x longer. best_run stayed 0 (winscan-obs artifact, not the true framing). die_a still WEDGES 4/4. => residual DECISIVELY the B-RETURN direction: die_b's a2l ACK/B occasionally lost on die_a's RX -> after ~(a2l window depth) losses the far-gated replay window fills -> wedge. PHYSICAL DIRECTIONAL EYE ASYMMETRY (one die's RX pin/eye worse; board asymmetry), STA-invisible. NOT autonomously fixable (BUFG hoist = per-build not per-POR; RX capture MEETS). Fix = physical re-pin / accept + increase a2l window / Wlink retransmit persistence. Branch @2c249ec = FIX1+obs+FIX D+FIX 2 = W-path works, 10x soak. DOMINANT TL-001 blocker; residual PHYSICAL/OPEN."
      evidence: ["hw_regionf_soak.log Region-F healthy@wedge", "hw_diea_dmesg.log silent kernel", "hw_purewrite.log wedge@~10 data-lands", "hw_paced.log wedge@~20 with 100ms pacing"]
      approved: false
    related: [TL-001]

