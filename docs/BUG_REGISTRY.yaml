  - id: TL-001
    title: Peer-write DATA-drop (die_b SRAM reads 0) — calibrator framing lottery
    severity: rank1_critical
    area: phy/calibrator
    status: root_caused
    summary: >
      die_a->die_b cross-die AXI writes cross their ADDRESS but die_b SRAM reads
      0 — the write payload is lost. Per-POR "lottery": some bring-ups land the
      write byte-exact, most drop it. Reframed (08-06) from "physical marginal
      eye" to a calibrator FRAMING-SELECTION logic issue: on KR260 USE_IDELAY=0,
      the "phase sweep" only rotates the 16 DIGITAL word framings.
    root_cause: >
      TERMINAL-LATCH BUG in the calibrator autonomous convergence. The RX lane
      checker scores the PEER's incoming training pattern, so best_run>0 needs
      BOTH dies training-transmitting SIMULTANEOUSLY. calibrated_once_q latches on
      ANY first reach of S_DONE (calibrator_v2.sv:771-774) INCLUDING a give-up
      S_DONE (retry_exhausted :1465, or :1467 else->S_DONE on a transient
      role_locked dip). Once a die latches a give-up S_DONE it drops training_mode,
      stops driving the pattern, and can never re-sweep -> the peer sweeps against
      a silent lane forever -> BOTH dies read best_run=0 and fall back to the (0,0)
      framing = the drop. Matches the land<->0x27 / drop<->0x05 (one die done, one
      sweeping) asymmetry. The earlier ":384 PRBS-not-on-wire" suspect is REFUTED
      (that comment is the S_VALIDATE PRBS oracle, not best_run, which is scored
      off the training pattern that IS on the wire locally). min_lock_dwells=1 was
      necessary (forces S_ARM->S_SWEEP) but orthogonal to the PASS gate and to
      overlap — why it ran the sweep yet left best_run=0. Pass chain: per-cycle
      Hamming<=5 (hardwired autonomous, axi_chiplet_controller.sv:3828) -> lock
      after LOCK_CONSEC=8 consecutive -> lane_score>=LOCK_THRESH=16 at 64-cyc
      dwell -> best_run promote; lane_passed = best_run>=16.
    fix:
      approach: >
        Sequence: FIX 3 (diagnostic + mitigation, APB-only, NO rebuild) -> FIX 1
        (autonomous cure, netlist) -> FIX 2 (follow-on if residual quantisation).
      candidates:
        - "FIX 3 (HIGH as diagnostic, NON-netlist/APB): assert swi_training_mode CTRL[6] hold on BOTH dies simultaneously, clear together -> forces both patterns on the wire concurrently -> guaranteed overlap. Decisive A/B test between cause A(absent) vs B(marginal) AND a runtime HW workaround. NO bitstream rebuild."
        - "FIX 1 (HIGH, netlist): calibrator_v2.sv:774 latch calibrated_once_q ONLY on genuine success (sweep_success / not validation_timed_out / link_up), so a give-up S_DONE keeps re-arming (MAX_RESWEEPS=0 -> re-sweep forever) until peer overlap. Also revisit :1467 else->S_DONE on transient role_locked dip. Impl note: sweep_success declared :1202 (below) -> move decl up under default_nettype none."
        - "FIX 2 (MEDIUM, netlist): relax PASS gate — axi_chiplet_controller.sv:3828 Hamming {8{3'd5}}->{8{3'd7}}, or calibrator_v2.sv:976 SCORE_DECAY 2->1, or :5918 .LOCK_THRESH(8). Safe: link_up ANDs CR_PKT/PRBS validation so a false framing re-sweeps, no silent corruption."
      files:
        - src/rtl/local_overrides/tidelink_phy_align_calibrator_v2.sv   # FIX 1 IMPLEMENTED here (uncommitted)
        - src/rtl/local_overrides/axi_chiplet_controller.sv
      fix1_implementation: >
        DONE (2026-08-06, uncommitted in eth-chiplet submodule): calibrator_v2.sv
        latch gated `else if (cur_state == S_DONE && !validation_timed_out)`.
        Uses the EXISTING give-up discriminator (validation_timed_out, declared
        L545, set on give_up_to_done so already 1 on the first give-up S_DONE
        cycle; stays 0 on a genuine validate-confirm S_DONE). Genuine bringup is
        PROVABLY unchanged (validation_timed_out=0 -> still latches); only the
        give-up path now keeps re-arming. Sidesteps the sweep_success decl-order
        issue (validation_timed_out is declared above the latch). Building both
        dies + calibrator sim regression in flight.
      build_note: >
        HW build (V2 flist) compiles src/rtl/local_overrides/tidelink_phy_align_
        calibrator_v2.sv (verified: tidelink_fpga_v2.flist:410). The cocotb
        calibrator suite compiles the PRISTINE deps copy (deps/tidelink-phy/rtl/
        tidelink_phy_align_calibrator.sv, same latch logic) — sim mirrors FIX 1
        into deps transiently then reverts. A permanent gated reproduce test for
        FIX 1 needs the local-override plumbed into a tb (force_recal_i port) —
        FOLLOW-UP coverage gap.
      commit: e5bd29c   # FIX 1 + min_lock_dwells, branch fix/tl001-calibrator-terminal-latch (submodule; NOT main)
      branch: fix/tl001-calibrator-terminal-latch
      netlist_affecting: true   # FIX 1/2 yes; FIX 3 no
    hw_discriminators:
      - "Cause A (peer pattern absent) vs B (present-marginal): on a dropping sweep read 0x2144 sync_obs_lane_live_1 + dwell_min_dist. dwell_min_dist~16 + live-match=0 => ABSENT(A, coordination); dwell_min_dist<=5-7 flickering => PRESENT-marginal(B, quantisation)."
      - "Terminal-latch hit: read both dies 0x2108 fcsm[19:17] + ILA state — a die stuck at S_DONE/cal_done=1 while the peer shows cal=0/sweeping confirms the abandon."
      - "Physical residual: if FIX 3 still yields best_run=0 with small dwell_min_dist AND re-POR flips land<->drop on the identical bitstream => physical capture-clock variance (P-B lottery class), FIX 2 is the only lever."
    verification:
