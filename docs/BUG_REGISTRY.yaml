      run / scored-but-never-invoked). => TWO problems: (a) fix the NEW calibrator
      regressions (FIX 1/FIX 2 reconcile), (b) the pre-existing gate rot (TL-020 + tc_pair)
      was never really green.
    resolution_2026_08_08: >
      RESOLVED 12 of 14 + PINNED the last 2. (1) 5 PRE-EXISTING: TL-020 obs-flist fix ->
      asic_v1/v2_elab + dft_wrapper_elab GREEN (committed); TL-006 ECC re-point; tc_pair
      deferred (TL-025, tidechart owner). (2) 7 STALE-TEST NEW failures (t31, retire_en_plumb,
      v2_autonomous_sync_detect, v2_pair_data, epoch_silicon, epoch_anchor_plumb,
      v2_reduced_lane): tests updated to the FIX1/FIX2 behavior with STRONGER non-vacuous
      assertions (FCSM==4, byte-exact data, sticky all-lanes-ever, specific threshold),
      VERIFIED 7/7 PASS tip-stamped, committed 2e6f8dc. (3) 2 REAL breaks
      (v2_mask_hs_bilateral, t33_arm_stagger_episode_bind = link never comes up: autoneg
      TRAIN_FAIL / FCSM stuck at 1): micro-revert BISECT on 2c249ec pins the cause to
      FIX 2 (lane_lock_thresh_eff 5->6, axi_chiplet_controller.sv:3961). min_lock_dwells
      (centering) EXONERATED (v2_mask still FAIL reverted) and FIX D (HOLD_PEER_AWARE_EN)
      EXONERATED (still FAIL); FIX 2 revert -> v2_mask PASS 165s (was ~600s to FAIL). This
      CORRECTS the workflow assessment, which mis-attributed the real breaks to FIX1
      centering-on. Mechanism: the looser threshold (6) that helps the marginal peer-write
      eye lets marginal/wrong lanes "lock" on the masked/staggered autoneg paths ->
      handshake mismatch -> TRAIN_FAIL. => DAVID DECISION: FIX 2 is the ~10x peer-write
      soak lever (TL-001/TL-009) vs 2 mask/stagger sim bring-up breaks. Options: (a) accept
      + XFAIL-sentinel the 2 (keep soak); (b) revert FIX 2 (lose soak, re-arm framing
      lottery); (c) path/scenario-aware threshold (6 for the peer-write data path, 5 for the
      mask-hs/stagger autoneg handshake) — a middle-ground RTL change worth scoping.
    signoff:
      claude_verdict: "RATIFIED 2026-08-08 (David): KEEP threshold 6 + XFAIL-sentinel the 2 breaks. Path-aware (option C) ROOT-CAUSED NOT VIABLE — the 5->6 knob has exactly ONE consumer (binary lane_locked -> autoneg ST_TRAIN_POLL_PEER rendezvous); the calibrator framing uses a separate threshold-independent distance metric (LOCK_DIST_THRESHOLD=3), so benefit (marginal-good lane locks at 6 on HW) and harm (spurious lane locks at 6 in masked/staggered sim -> TRAIN_FAIL) are the SAME decision, separable only by an unobservable scenario. DISPOSITION: v2_mask_hs -> XFAIL sentinel v2_mask_hs_regress (~600s, signature = TRAIN_FAIL/FCSM-never-4); t33 -> tracked-standalone (3.5h livelock, out of per-run gate, same root cause). Waiver: docs/WAIVER_TL024_FIX2_MASK_STAGGER.md. Gate goes GREEN with 2 documented known-defects; ~10x soak + HW-proven bitstream (5/5 land-rate) preserved, non-netlist. NOTE: this documents a REAL regression (autonomous masked/staggered bring-up is dead in sim at 6), not a test artifact. ALTERNATIVE if that bring-up must work: revert 6->5 (netlist, loses soak, pushes weight to physical TL-009). 12 of 14 gate failures already fixed+committed (2e6f8dc); these 2 are the last, now dispositioned."
      evidence: ["full sim_gate: 38 PASS / 14 FAIL / XCHG epoch_shipping", "t31 bisect 1107151=PASS e5bd29c=FAIL", "base run: asic elabs+tc_smoke FAIL on 1107151 (pre-existing), v2_pair_data PASS on 1107151 (new)", "v2_autonomous_sync_detect asserts thresh=5, FIX2=6"]
