  - id: TL-035
    title: "State-7 NACK watchdog dead after first CRC error (sticky socl_l7_real_crc_seen pins wdog_cnt=0)"
    severity: high
    area: rtl/fcsm-recovery
    status: root_caused
    summary: >
      Surfaced by DEV_MESSAGE_A2L_SELFLATCH_SILICON_2026_08_09 (eth-chiplet integrator) as a real secondary
      defect distinct from the TL-027 a2l self-latch. After the FIRST real CRC error the FCSM latches
      socl_l7_real_crc_seen (no clear path except reset), which permanently pins socl_l7_wdog_cnt=0 and
      DISABLES the state-7 NACK backstop forever -- so the recovery watchdog never re-fires. Silicon-only
      witness = cov_errinject_sweep wedges die_a on the first AW error-inject (R1); does NOT reproduce in any
      sim (a2l unit bench nor the 4-config FCSM recovery env incl. ASIC_MIRROR).
    root_cause: >
      src/rtl/local_overrides/WlinkGenericFCSM_4.v:303-305 socl_l7_wdog_force_clear gated by
      ~socl_l7_real_crc_seen; :1013-1017 socl_l7_real_crc_seen latches on first crcCorruptSeen with no clear;
      :1024-1025 `else if (socl_l7_real_crc_seen) socl_l7_wdog_cnt <= 0` (self-comment "disarms the watchdog
      forever"). socl_l7_* is a SoC-Labs local-override addition (absent from deps/). Live in the shipping v2
      flists via the recovery FCSM copies.
    fix:
      approach: >
        Part-A (dev-sim-proven dead->live + no-regression, NOT yet applied here): drop the sticky gate on
        force_clear (`= (wdog_cnt==THRESHOLD)`), and replace the sticky reset with an instantaneous
        forward-progress proxy (`else if (auto_tx_out_advance) wdog_cnt <= 0`). Part-B (§6 state-7-exit:
        `state 7 leaves on auto_tx_out_advance | wdog_force_clear`) is BLIND-MERGE-FORBIDDEN -- needs an
        attended die_b AW-FCSM ILA to decide (auto_tx_out_advance flat-0 => emit-starvation => Part-B needed;
        pulsing => Part-A alone suffices).
      candidates:
        - "Part-A (HIGH, netlist): unstick the watchdog. Apply to WlinkGenericFCSM{,_1,_2,_3,_4}.v. Dev sim-proved dead->live + no-regression in the eth-chiplet tree; probe test test_a2l_r1_probe.py lives only there -- port it to tidelink-consolidated to re-prove locally."
        - "Part-B (§6 state-7-exit): DO NOT SHIP without the attended ILA."
      files:
        - src/rtl/local_overrides/WlinkGenericFCSM_4.v
        - src/rtl/local_overrides/WlinkGenericFCSM.v
      commit: null
      branch: null
      netlist_affecting: true
    # --- verification + signoff REPLACED 2026-08-13 from the first attributable
    #     hardware A/B. Originals preserved verbatim below as
    #     *_superseded_2026_08_09 so nothing is lost from the audit trail. ---
    verification_superseded_2026_08_09: {sim_test: "dev Part-A dead->live proof (eth-chiplet tree, not re-run here -- probe test absent); R1 errinject silicon-only, does NOT reproduce in sim", in_sim_gate: false, hw_tested: false}
    signoff_superseded_2026_08_09: {claude_verdict: "NEW (2026-08-09) from the a2l silicon dev-message. Root cause confirmed structurally in the live override FCSM. Part-A is netlist + David-gated; Part-B is ILA-gated (do not merge blind). Next step per dev = attended die_b AW-FCSM ILA. Port the dev's probe test to re-prove Part-A locally.", evidence: ["DEV_MESSAGE_A2L_SELFLATCH_SILICON_2026_08_09.md", "WlinkGenericFCSM_4.v:303-305,1013-1017,1024-1025"], approved: false}
    verification:
      sim_test: >
        NONE that exercises this defect. cocotb/tidelink_top_pair/test_l7_wedge_repro.py
        drives the pair-TB master FCSM (which is WlinkGenericFCSM_6, the TRANSPORT
        node) into a stuck state 7 via the bringup-forgive path, and never sets
