      self-heal that fixed the A->B "cap ~6 words" self-latch was only applied to
      siblings _12/_13 (the sideband nodes). Per the eth-chiplet A2L_CDC handover,
      hardening these is the highest-leverage TL-009 wedge mitigation (turns a lost-B
      from fatal into self-healing). NOTE: the SIGNOFF_ROADMAP §3b said "propose TL-018"
      for exactly this, but that id was reused for the ASIC-CRC item, so it fell
      through the cracks. Causally contested (A2L_CDC eval called the CDC-self-latch
      theory "plausible-not-proven"; FIX 2 was the empirical cause of the 2 real
      breaks) — but the unhardened-node robustness gap is real regardless.
    fix:
      approach: "copy deps _1/_3/_5 -> src/rtl/local_overrides/ with _12/_13's continuous w_inc + ACK window-guard + the addr-sync reset-skew gate the doc omits; per-node width re-derivation (_1/_5=4-bit/8, _3=6-bit/32); repoint tidelink_fpga_v2.flist (NOT the V1 flist the doc named) + asic_v2 flist"
      files: [deps/axi-chiplet-controller/logical/wlink/WlinkGenericFCReplayV2_1.v, flists/tidelink_fpga_v2.flist]
      commit: null
      branch: null
      netlist_affecting: true
    verification: {sim_test: "cocotb/tidelink_a2l_replay_cdc NODE=5 (B node reproduce+heal A/B, PROVEN 2026-08-08); NODE=13 (sideband); _3 W-node = follow-up", in_sim_gate: false, hw_tested: false}
    cdc_selflatch_derisk_2026_08_08: >
      CONTESTED-QUESTION SETTLED (sim). Extended cocotb/tidelink_a2l_replay_cdc to the B
      data-plane node via a NODE knob (NODE=5: tb_top_5.sv + flists/tidelink_a2l_replay_cdc_5.flist
      + test_a2l_replay_cdc_5.py, 14-bit/4-bit/depth-8, lap-ahead ACK=9). RESULT:
      REPRODUCE-FIRST -- pristine deps WlinkGenericFCReplayV2_5 FAILS (after a lap-ahead ACK(9)
      the first app write sees a2l_full=1, app_ready=0 => the B FCSM would never transmit). So the
      a2l ACK-lap-ahead CDC self-latch is REAL on the write-response node, NOT just the _13
      sideband -- the "plausible-not-proven" doubt is resolved: it reproduces. SELF-HEAL --
      built src/rtl/local_overrides/WlinkGenericFCReplayV2_5.v (the _13 3-part fix ported to
      4-bit/window 4'h8: ACK-window guard a2l_ack_valid + continuous w_inc=1 + gated latch); the
      SAME test PASSES (spurious ACK(9) is rejected -> synced_ack stays 0 -> a2l_full=0,
