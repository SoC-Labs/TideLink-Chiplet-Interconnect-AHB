  - id: TL-026
    title: ASIC critical-path — pipeline pair_credit_next (timing optimization)
    severity: medium
    area: rtl/fifo/tidelink_apb_regs
    status: sim_proven   # equivalence-proven; netlist-affecting -> David signs to land
    summary: >
      tidelink_apb_regs.sv pair_credit_next was a long combinational chain
      (33-bit add -> add -> compare -> subtract -> mux -> flop) fed by pwdata from
      the CM0+ across the die — a top timing endpoint (wins up to ~32 endpoints).
      Broke it with the SAME proven pipelining idiom already in the file (the
      release-accumulator block ~:438-449): register the input-derived addends +
      the enable-qualified update strobe (stage 1); accumulate/compare/subtract
      against the LIVE counter stays single-cycle. Net: pair_credit_counter is
      BIT-IDENTICAL, delayed exactly 1 cycle.
    invisibility: >
      The only HW reader (tidelink_tx_gen reserve-then-send FSM :306-372) reads the
      count once in S_ARMED, consumes (len+2) up front, holds S_SEND >= 6 cycles +
      S_GAP before re-gating on credit -> a consume settles many cycles before the
      next credit decision; double-spend structurally unreachable. Stronger than the
      release-acc block's soft argument.
    fix: {approach: "1-cycle pipeline (register inc_r/dec_r/update_r), mirror :438-449", files: [src/rtl/fifo/tidelink_apb_regs.sv], commit: 651a71b0, branch: origin/main, netlist_affecting: true}
