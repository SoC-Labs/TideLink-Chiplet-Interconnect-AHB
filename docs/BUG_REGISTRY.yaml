  - id: TL-022
    title: D2D RX-FIFO rf_16k macro never functionally simulated (random init)
    severity: medium
    area: rtl/fifo
    status: sim_proven   # random-init exposure tested; guard holds
    summary: >
      src/rtl/fifo/asic/tidelink_sram.sv:48 instantiates rf_16k u_rf on the D2D RX FIFO;
      no sim env compiles the real macro (only sim_stubs/rf_16k_stub.v in compile-only
      gates). Random power-up (vs the FPGA model's all-zero) is an un-exercised init-state
      exposure that interacts with the phantom-pop guard's documented uncovered 2nd case
      (tidelink_fifo_ctrl.sv:321,:400). RESOLVED 2026-08-08 (below): the phantom-pop guard
      is SRAM-value-INDEPENDENT (blocks the offset-0 arming on rx_fifo_empty, not on SRAM
      contents), so random init adds NO empty-FIFO exposure beyond the all-zero case, and
      that is now proven under a dangerous non-zero init.
    fix: {approach: "TIDELINK_SRAM_RAND_INIT knob (fpga/tidelink_sram.sv, sim-only translate_off) + `make randinit` target (cocotb/tidelink_fifo) run the whole FIFO suite under an ADVERSARIAL non-zero power-up", files: [src/rtl/fifo/fpga/tidelink_sram.sv, cocotb/tidelink_fifo/Makefile], commit: null, branch: null, netlist_affecting: false}
    verification: {sim_test: "cocotb/tidelink_fifo `make randinit` (42/42 PASS under SRAM[0]=0x2 adversarial init)", in_sim_gate: true, hw_tested: false, in_hw_gate: true, hw_test: "14_rx_fifo_phantom_pop.sh"}
    result_2026_08_08: >
      The default RAND_INIT fill was CORRECTED after a first-pass error: 0xFF (=> clamp_length
      MAX => read_target_addr beyond the read sweep) CANNOT pop and is NOT adversarial; the
      pop-triggering low-bit range is 0x0..0x6. Default is now 0x0000_0002 (length 2 =>
      read_target_addr=12, inside the sweep). NON-VACUITY MATRIX (all via a transient
      guard-bypass, since REMOVED from the safety-critical RTL): guard-OFF+zero -> test_41
      FAIL (reproduces f9b94b7 phantom pop, read_ptr 0x0->0x8); guard-OFF+V2 -> test_41 FAIL
      (V2 is genuinely pop-triggering); guard-ON+V2 -> 42/42 PASS. => the guard is
      load-bearing AND holds under dangerous non-zero (random-like) init. `make randinit` is
      now a PERMANENT non-vacuous regression (fails if the guard is ever removed).
      RESIDUAL (separate, NOT closed): the documented 2nd uncovered case (FC-write-path arms
      packet_active on a header that never completes, fifo_ctrl.sv:400) is SRAM-init-
      INDEPENDENT (length from fc_wr_wdata, not SRAM), so this init-focused test does not
      exercise it; a targeted incomplete-packet test is a follow-up.
    signoff: {claude_verdict: "RANDOM-INIT question ANSWERED: phantom-pop guard is SRAM-value-independent and holds under adversarial non-zero init (42/42, non-vacuity proven). Instrument (randinit) is a permanent regression. No new RTL bug surfaced on the init axis. FOLLOW-UP (not this bug): the FC-write incomplete-packet 2nd case is init-independent and still un-tested.", evidence: ["make randinit 42/42 PASS (V2 init)", "guard-OFF+zero test_41 FAIL", "guard-OFF+V2 test_41 FAIL", "guard-ON+V2 test_41 PASS"], approved: false}
    related: []

