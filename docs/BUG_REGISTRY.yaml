      site.env.example) and MUST NOT be modified. Gate any build on a die_a ILA showing BOTH synth_b_pending never
      asserting AND sub_osr_ctr_r being reset by sibling Bs. Probe set:
      synth_b_pending, sub_osr_ctr_r, sub_axi_progress, sub_r_done and sub_b_done
      SEPARATELY, sub_wr_os_ctr, hazard occupancy, s_axi aw/b. Trigger on sustained
      ahb_sub_hreadyout low. Pair with a NO-CORE control build of identical source
      (ILA insertion has itself caused a wedge class on this design —
      WlinkGenericFCSM_6.v:129-138, build #4). The capture modality already exists
      and is proven: imp/hw_gate/ila_2026_08_12/{ila_capture.tcl, ila_capture_run.sh}
      force-capture through the PS deadlock.
    signoff:
