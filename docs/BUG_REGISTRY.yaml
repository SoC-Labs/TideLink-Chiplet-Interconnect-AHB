  - id: TL-002
    title: Standalone-IP early HREADYOUT on peer write (wr_hold_r)
    severity: high
    area: rtl/tidelink_top
    status: sim_proven
    summary: >
      Write mirror of the rd_pipe_r read fix. ahb_sub_hreadyout asserted early on
      a peer write, so the AHB master released HWDATA before the AXI W beat landed
      -> W captured 0 under XHB500 backpressure. wr_hold_r holds hreadyout LOW
      from the peer-write address latch until the AXI W beat lands.
    root_cause: >
      ahb_sub_hreadyout early-assert. SET ext_is_nonseq & ahb_sub_hwrite &
      ~pipe_valid_r; CLEAR on W-last handshake OR synth_b_pending (I5 backstop,
      bounded ~2^16 — no new hang). Deadlock-guarded (AW/W feed separate FC nodes).
    fix:
      approach: hold ahb_sub_hreadyout LOW until AXI W beat lands
      files: [src/rtl/tidelink_top.sv]
      commit: e28c898
      branch: integ/axirec-on-chiplet
      netlist_affecting: true
    verification:
      sim_test: cocotb/tidelink_axi_datanode_recovery/test_axi_datanode_writehold.py  # integ tree only
      in_sim_gate: true   # gated BLOCKING on integ (token axi_datanode_recovery); ABSENT on standalone fix/z2-drop-park-hook
      hw_tested: n/a-standalone   # redundant on eth-chiplet (parent cap_done_r holds HWDATA)
      hw_evidence: "eth-chiplet residual drop is DOWNSTREAM of s_axi_wdata; wr_hold_r correctly does not move it there"
    signoff:
      claude_verdict: "sim_proven + correct for standalone IP; redundant (not harmful) on eth-chiplet. Candidate sign-off as standalone fix."
      evidence: [commit:e28c898, "reproduce-first sim: pre-fix FAIL, post-fix PASS; recovery gate GREEN 236s"]
      approved: false
      approved_by: null
      approved_date: null
    related: [TL-001]

