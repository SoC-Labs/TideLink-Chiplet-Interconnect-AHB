  - id: TL-033
    title: "No credit-underflow protection — 13-bit credit counter wraps (silent credit corruption)"
    severity: high
    area: rtl/fifo
    status: closed
    description_was_wrong_2026_09_11: >
      THE DESCRIPTION BELOW IS FACTUALLY FALSE AND WAS FALSE ON THE DAY IT WAS
      MIGRATED. It says credit_count "is decremented UNCONDITIONALLY on write_complete
      without checking the packet fits". Read at the file, src/rtl/fifo/tidelink_fifo_ctrl.sv
      does the opposite and carries a comment naming this very bug:

        :199   // BUG-002 fix: saturate at zero to prevent unsigned underflow wrap
        :200   wire [RAM_ADDR_W-2:0] credit_after_write =
        :202       ? ((credit_count_r >= (RAM_ADDR_W-1)'(write_packet_delta))
        :203           ? credit_count_r - (RAM_ADDR_W-1)'(write_packet_delta)
        :204           : '0)
        :205       : credit_count_r;

      The guard is a saturate-at-zero: if the packet does not fit, the counter goes to
      zero instead of wrapping. Provenance traced with `git log -S`: introduced by
      ce2f2c90 "Fixing CDC issues, adding RTL fixes and adding more tests to the
      design", dated 2026-04-06 and an ancestor of origin/main — FOUR MONTHS before
      this entry was migrated as an open Critical from SHORTCOMINGS.md BUG-002. The
      form at ce2f2c90 was the same saturate written inline in the always block
      (:237-241 there); b1c0eace later refactored it out as credit_after_write for the
      N3/Hazard-4 read-pointer fix, which reads the same value and did not weaken it.
      So the migration copied a stale shortcomings-document entry forward without
      opening the RTL. The generalisable failure is not "credit underflow" — it is
      that a MIGRATED entry inherits the confidence of its source and none of its
      age.
      WHAT REMAINS OPEN, and why this closes as `closed` rather than `sim_proven`:
      the entry also asked for an oversize-packet FLAG and for an FPV proof of the
      no-wrap invariant. Neither exists. The saturate silently absorbs an oversize
      packet; nothing reports it. If that flag is wanted it is new work and deserves
      its own id, not a reopening of a defect that was fixed in April.
      NOT VERIFIED BY THIS PASS: whether the whitebox regression
      cocotb/tidelink_fifo/test_tidelink_fifo.py:1865
      test_43_credit_underflow_saturates_whitebox currently PASSES. It exists, it is
      in sim_gate_fifo's suite, and its own source comment records the 2026-08-13
      stale-probe repair that had been failing its precondition — but running it needs
      VCS and no sim was taken during this pass. Structure verified, execution not.
    summary: >
      *** THE PARAGRAPH BELOW IS THE ORIGINAL, INCORRECT MIGRATION TEXT, RETAINED AS
      THE HISTORICAL RECORD. See description_was_wrong_2026_09_11 above. ***
      MIGRATED from docs/reference/SHORTCOMINGS.md BUG-002 (Critical; never in the TL-registry). In
      tidelink_fifo_ctrl.sv credit_count is decremented UNCONDITIONALLY on write_complete without checking
      the packet fits; a packet larger than credit_count wraps the unsigned 13-bit counter -> silent
      credit-accounting corruption (FIFO ptr/credit inconsistent, unread data silently overwritten). The
      overrun flag only detects credit_count==0 at a valid transfer, not whether the whole packet fits.
      Candidate first FPV target.
    fix: {approach: "saturate-at-zero guard on the credit decrement — ALREADY PRESENT since 2026-04-06, not new work", files: [src/rtl/fifo/tidelink_fifo_ctrl.sv], commit: ce2f2c90, branch: origin/main, netlist_affecting: false}
    verification: {sim_test: "cocotb/tidelink_fifo/test_tidelink_fifo.py test_43_credit_underflow_saturates_whitebox (+ test_32_credit_underflow_saturation, test_33_credit_underflow_normal_path_unaffected) — present in the tree, run under sim_gate_fifo; NOT executed by the 2026-09-11 truth pass", in_sim_gate: true, hw_tested: false, hw_validated: false, evidence: null, vehicle: null}
    followups:
      - "OPEN, and deliberately not folded into this closure: there is still no oversize-packet FLAG. The saturate absorbs the condition silently. If an error bit is wanted, open a new id."
      - "OPEN: the FPV proof of the no-wrap invariant that this entry proposed was never written. The saturate makes wrap unreachable by construction, which is an argument, not a proof."
    signoff: {claude_verdict: "CLOSED 2026-09-11 — the defect as described does not exist and has not existed since ce2f2c90 (2026-04-06). The migration from SHORTCOMINGS.md BUG-002 carried a stale claim forward without reading the RTL. Closing the DEFECT; the oversize-packet flag and the FPV proof are recorded as open followups and are new work.", evidence: ["src/rtl/fifo/tidelink_fifo_ctrl.sv:199-205 saturate-at-zero guard, comment names BUG-002", "git log -S 'BUG-002 fix: saturate at zero' -> ce2f2c90 (2026-04-06), ancestor of origin/main", "git show ce2f2c90:src/rtl/fifo/tidelink_fifo_ctrl.sv:237-241 = the same guard inline", "reference/SHORTCOMINGS.md BUG-002 (the stale source)"], approved: false}
    related: [TL-022]

