          - "test_tl044_starvation_defeats_the_aggregate_backstop         PRIMARY A/B."
          - "test_tl044_escape_is_clean_and_normal_path_survives          escape fires + own state clears + clean write/read-back byte-exact + drain is BOUNDED."
