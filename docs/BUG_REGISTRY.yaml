  - id: TL-045
    title: "cross-die exclusive access silently succeeded — no mutual exclusion AND no failure indication"
    severity: high
    area: xhb500-integration
    status: root_caused          # the DEFECT is measured on rev2/integration; the FIX is on an unmerged side branch
    registered: 2026-09-11
    provenance: >
      Entry content reused from an unmerged registry commit in the off-repo
      eth-chiplet clone (branch rev2/fix-exclusives), which is the only place a TL-045
      entry has ever existed. Read there, not modified. Condensed here and its status
      LOWERED from the sim_proven it claims: on the branches this repository can see,
      the defect is demonstrated and the fix is not present.
    summary: >
      Two initiators could both complete a store-exclusive to the SAME cross-die
      address, both answered OKAY, the second silently overwriting the first. Measured
      with LDREX-A / LDREX-B / STREX-B / STREX-A: outcomes {A_ldrex:0xBAD,
      B_ldrex:0xBAD, B_strex:OK, A_strex:OK}, far memory left holding A's 0x1111AAAA
      over B's committed 0x2222BBBB. Software using cross-die exclusives for mutual
      exclusion had NO mutual exclusion and no indication that it had none. The silence
      is the defect: a loud failure is recoverable, a silent one is not.
    root_cause: >
      Three independent breaks, all in the INTEGRATION. Wlink was never at fault — it
      carries axlock as AW/AR payload bit 13 (AXI4ToWlink.v:454/473).
        1. tidelink_top's AHB subordinate port has no HEXCL and no HEXOKAY pin, so an
           AHB5 manager's exclusive marker is already gone at TideLink's own pins, one
           level above any tie-off.
        2. u_xhb_sub .hexcl(1'b0) forces awlock/arlock to 0 for EVERY outbound
           transaction (core_addr.sv:253/268). The exclusive does not merely go
           unanswered across the die boundary — IT NEVER CROSSES IT.
        3. u_xhb_sub .hmaster(12'd0) forces AxID=0 (core_addr.sv:248/263), so all five
           initiators are bit-identical on the wire, and u_xhb_mng .hexokay(1'b0) makes
           AXI_RESP_EXOKAY unreachable inbound (core_h_xout.sv:180).
      With no marker on the wire and no monitor on the path, a "cross-die exclusive"
      executes as an ordinary read followed by an ordinary, unconditional write.
    fix:
      approach: >
        REFUSE, do not pretend. tidelink_top gains ahb_sub_hexcl (in) and
        ahb_sub_hexokay (out, constant 0). A transfer presented with HEXCL high is
        (a) NEVER ISSUED — xhb_sub_hsel is gated so XHB500 never latches it, nothing
        reaches the link, PEER MEMORY IS NOT MODIFIED; (b) answered with a two-cycle AHB
        ERROR; (c) answered with HEXOKAY=0. Supporting exclusives properly was evaluated
        and REJECTED: it needs a global exclusive monitor at the far terminus, which
        does not exist and which tidelink_top's ahb_mng port has no HEXOKAY pin to
        reach, AND a per-initiator AxID, which collides with the Fix K hazard-list BID
        override (TL-003 presents sub_wr_awid_r, a SINGLE register, for a 4-deep list —
        correct only while AWID is constant). A granted-but-unmonitored exclusive would
        be WORSE than the original defect, because software would then trust it.
      files: [src/rtl/tidelink_top.sv, src/rtl/asic/tidelink_dft_wrapper.sv, fpga/vivado_ip/tidelink_vivado_wrapper.v, scripts/ci/check_excl_port_wired.py]
      commit: 35c75ae0
      branch: "rev2/fix-exclusives (off-repo eth-chiplet clone ONLY)"
      netlist_affecting: true
    verification:
      sim_test: "sim_gate_xdie_exclusive"
      in_sim_gate: true
      hw_tested: false
      hw_validated: false         # explicit — no rig run has been made
      evidence: null
      vehicle: null
      what_is_where_2026_09_11: >
        Checked branch by branch rather than taken from the draft entry, and the answer
        differs from it. On origin/rev2/integration the suite exists and asserts the
        DEFECT: test_xdie_exclusive_marker_never_reaches_axi and
        test_xdie_two_initiators_both_commit. The REFUSAL tests the draft describes
        (test_xdie_exclusive_is_refused, _cannot_both_commit, _ordinary_traffic_unaffected,
        plus the LEGACY_MUTANT red proof) are NOT on origin/rev2/integration, and
        `git grep ahb_sub_hexcl origin/rev2/integration` hits only the test file, never
        src/rtl/tidelink_top.sv. scripts/ci/check_excl_port_wired.py is likewise absent
        there. So on every branch this repository can see, the defect is proven and the
        fix is not present. Status set to root_caused accordingly.
    action_items:
      - "LAND THE FIX. It exists only on an unmerged branch of an off-repo clone — the single most losable piece of work in this registry."
      - "PARENT-CHIPLET WIRING IS THE ONLY THING BETWEEN THIS FIX AND A SILENT REVERT: the parent chiplet's u_tidelink instantiation must DRIVE ahb_sub_hexcl. Unconnected reads 0 = 'not an exclusive' = the original defect, with a green gate."
      - "DECISION for David: is refusing the right policy, or must cross-die exclusives be SUPPORTED? Supporting them is a far-side global-monitor + AxID/Fix-K workstream, not a wiring change."
      - "INBOUND exclusives would be OBSERVED, not blocked (obs 0x21F8 bit[16]). Unreachable on a TideLink<->TideLink pair once neither die can emit AxLOCK=1; if that bit ever reads 1 on silicon the inbound block becomes real work."
      - "HW validation outstanding: no rig run has been made. obs 0x21F8 bit[15] latches on a refusal and is the intended on-silicon witness."
    signoff:
      claude_verdict: >
        The DEFECT is measured and reproducible on rev2/integration and I have confirmed
        the suite that measures it. The FIX is not on any branch of this repository, so
        its measured refusal and its red proof are reported here on the draft entry's
        authority, not on mine. Do not read this entry as a fixed bug.
      evidence:
        - "PRE-FIX, measured on rev2/integration: outcomes={'A_ldrex': 2989, 'B_ldrex': 2989, 'B_strex': 'OK', 'A_strex': 'OK'} after_B=0x2222bbbb final=0x1111aaaa"
        - "origin/rev2/integration:cocotb/tidelink_axi_datanode_recovery/test_xdie_exclusive.py:225,298 — both tests assert the DEFECT"
        - "origin/rev2/integration:Makefile:1059-1073 (sim_gate_xdie_exclusive) and :294 (in SIM_GATE_ALL_SUITES)"
        - "core_addr.sv:253/268 (awlock/arlock = hexcl), :248/263 (awid/arid = hmaster); core_h_xout.sv:180 (EXOKAY only on far HEXOKAY) — vendor IP, read-only"
        - "REUSED, NOT INDEPENDENTLY VERIFIED: the post-fix and red-proof numbers, from commit 35c75ae0 on the off-repo clone branch rev2/fix-exclusives"
      approved: false
    related: [TL-042, TL-043, TL-044, TL-003]

  - id: TL-047
    title: "tidelink_fc_adapter TX arbiter: per-source ready did not follow the grant -- TideChart beat ACKed-and-dropped (F3), servo word duplicated (F4), returner credit word dropped under sideband_starving (F5), burst counter counted wants as grants"
    severity: high
    area: rtl/fc_adapter
    status: sim_proven
    registered: 2026-09-22
    opened: 2026-09-09            # rev-2 review appendix, findings F3/F4/F5 (all "not" fixed then); F3 also memory 2026-09-14 (tc_qos_priority tied 3'b000 starves election)
    summary: >
      The TX arbiter feeds a one-entry skid from four sources (returner sideband,
      PTP servo sideband, TideChart PKT_EXT, TX aperture) with fixed priority
      rtn > servo > TideChart(if boosted or TX idle) > TX. arb_data selected the
      word correctly, but three of the four per-source ready/retire signals were
      NOT derived from that selection, so a source could be retired in a cycle the
      skid loaded a different source's word:
      (F3) tc_axis_tx_tready = skid_can_accept & ~sideband_starving -- a TideChart
      beat presented while the TX aperture held the arbiter (tc_qos_priority == 0,
      how BOTH chiplet wrappers tie it: nanosoc_eth_chiplet.sv:1112,
      nanosoc_compute_chiplet.sv:1101/1313) or while a returner/servo word was
      pending was handshaken and discarded. An election claim is broadcast once;
      one dropped beat is a silently lost election.
      (F4) servo_fc_ready carried ~tc_tx_is_remote while arb_data picked the servo
      whenever it was valid and the returner was not: with a TideChart word also
      valid the skid loaded the servo word and did not retire it -- duplicate servo
      packet, and (pre-F3) the TideChart word dropped in the same cycle. Fixing F3
      alone turns this into a LIVELOCK (the TideChart master now holds, so the servo
      duplicates every cycle and the claim never gets in) -- measured, see red_green.
      (F5) rtn_pending_r cleared on skid_can_accept with no grant term and
      rtn_hready followed it: under sideband_starving (4 consecutive sideband grants
      with tx_fc_valid high) the arbiter loads the TX word, the returner word is
      dropped, and the returner sees hready=1. Measured: TWO consecutive credit
      words lost (5 and 6 of a 6-burst), not one, because the counter stays
      saturated while TX streams.
      (+) sideband_burst_r counted a TideChart word that merely WANTED the arbiter
      (tc_tx_is_remote) as a sideband grant even when TX won, so a pending claim
      under a TX stream saturated the counter and sideband_starving held returner
      credits off until TX paused (or dropped them, via F5).
    root_cause: >
      Grant (arb_data mux) and retire (per-source ready) were written separately
      and drifted: servo_fc_ready and tc_axis_tx_tready encoded different priority
      orders from arb_data, and rtn retire encoded none. The review's companion
      recommendation (appendix section 9) was exactly this: one-hot grant vector
      with per-source ready derived from it.
    fix:
      approach: "wire rtn_selected/servo_selected/ext_selected (one-hot, pre-declared beside sideband_grant); arb_data, sideband_grant, rtn_pending_r clear, rtn_hready, servo_fc_ready and tc_axis_tx_tready all derive from them; sideband_burst_r counts sideband_grant (actual loads) and resets on a TX load. Zero area: every term already existed. PUF path unchanged."
      files: [src/rtl/tidelink_fc_adapter.sv, cocotb/tidelink_fc_adapter/tb_top.sv, cocotb/tidelink_fc_adapter/test_fc_adapter_arbiter.py, cocotb/tidelink_fc_adapter/test_tidelink_fc_adapter.py, Makefile]
      commit: null                       # filled at land; branch history keeps the F3-only step (de53b32) on purpose -- it is the livelock arm of the A/B
      branch: rev2/fix-tc-tready         # local, from rev2/integration 3fb297f
      netlist_affecting: true
    verification:
      sim_test: "fc_adapter_arbiter (sim_gate suite label; cocotb/tidelink_fc_adapter/test_fc_adapter_arbiter.py: 2 controls + 5 defect arms)"
      in_sim_gate: true
      hw_tested: false
      hw_validated: false
      evidence: null
      vehicle: null
      red_green: >
        Same bench, three RTL states, 2026-09-22 (git show <rev>:file swapped in, logs
        arb_new2/arb_prefix2/arb_f3only2 in the session scratchpad):
        pre-fix 3fb297f  -> 2/7 (controls only; F3 x2, servo dup servo=2 tc=0, returner
        burst delivered 4 of 6, returner-under-stream tc=0);
        F3-only de53b32  -> 4/7 (servo arm TimeoutError = livelock; returner 4 of 6;
        returner-under-stream rtn=0 -- F5 + counter accounting together);
        one-hot          -> 7/7 (tc held 2/5/13 cycles where it must wait, every word
        delivered exactly once, TX streams 12/12 intact).
        Existing test_tidelink_fc_adapter: 34/34 on the one-hot RTL. tc_pair_smoke
        and tc_pair_election_datamode (real TideChart master) PASS on the F3 RTL;
        re-run on the one-hot RTL is part of the branch gate.
        All masters in the bench are COMPLIANT (hold valid until an observed ready,
        then drop it; AHB masters mirror hreadyout into hready): a re-presenting
        master would mask F3, and a non-pipelined returner cannot reach F5.
    residual: >
      tc_qos_priority is still tied 3'b000 in both wrappers (separate repo): a claim
      now WAITS behind bulk TX instead of being lost. Whether it should also outrank
      TX is the wrapper's zero-area one-line decision, not this file's.
      No hardware run yet.
    signoff:
      claude_verdict: >
        Mechanisms read at the RTL, all five reproduced cycle-exactly in the unit
        bench, and the intermediate F3-only fix was shown to livelock -- which is
        why this lands as one change, as the review recommended. Netlist-affecting;
        David lands. Not yet on hardware.
      evidence:
        - "src/rtl/tidelink_fc_adapter.sv pre-fix :506 (tready), :576 (servo_fc_ready), :407/:418 (rtn clear/hready), :514 (burst counter) -- read at the file"
        - "docs/reviews/2026-09-09_REV2_REVIEW_APPENDIX.md section 3 (F3/F4/F5) and section 9 companion refactor"
        - "cocotb/tidelink_fc_adapter/test_fc_adapter_arbiter.py A/B across 3fb297f, de53b32 and the one-hot RTL (see red_green)"
        - "sim_gate_fc_adapter_arbiter run through the gate machinery on the branch; scripts/ci/tests/test_sim_gate_integrity.py 5/5 (invoked == scored)"
      approved: false
    related: [TL-034, TL-046]

  - id: TL-046
    title: "AR/R replay nodes _7/_9 ship WITHOUT the a2l CDC self-heal (read-path gap) — was 'TL-043-ARR'"
    severity: high
    area: rtl/wlink
    status: sim_proven
    registered: 2026-09-11
    opened: 2026-08-23            # as "TL-043-ARR", on an unmerged branch of the off-repo clone
    id_collision_resolution_2026_09_11: >
      THIS ENTRY IS THE RENAMED CLAIMANT. It was drafted as "TL-043-ARR", which
      collided with TL-043 (Hazard-1, the edge-qualified wr_hold_clr). Renamed rather
      than kept with a suffix, for three reasons: TL-043 is cemented in shipping RTL
      comments on the trunk (src/rtl/tidelink_top.sv:1971/2006/2009) and in a landed,
      gated cocotb test, so it is the claimant that cannot move; `grep TL-043` matches
      the suffixed form, so the collision defeats the tool people actually use; and a
      suffixed id does not match the TL-0NN shape every consumer of this file assumes
      (dupkey_check.py, registry_coverage.py, gen_bug_registry_html.py). TL-046 is the
      first unused number — TL-044 and TL-045 are registered above.

      THE RENAME CANNOT BE EXECUTED FROM THIS BRANCH. Every file carrying the old
      token lives on origin/rev2/integration; none exists on origin/main. Verified:
      src/rtl/local_overrides/WlinkGenericFCReplayV2_{7,9}.v, flists/tidelink_a2l_replay_cdc_{7,9}.flist,
      cocotb/tidelink_a2l_replay_cdc/{test_a2l_replay_cdc_7.py,test_a2l_replay_cdc_9.py,
      tl027only_WlinkGenericFCReplayV2_{7,9}.v} and docs/FALSE_GREEN_REGISTER.md are
      all absent on origin/main. The manifest below is the complete, occurrence-counted
      set to change when rev2/integration lands; it was produced by
      `git grep -c 'TL-043-ARR' origin/rev2/integration`, not by estimate.
      Execute with:
        git grep -l 'TL-043-ARR' -- . | xargs sed -i 's/TL-043-ARR/TL-046/g'
      then re-run `git grep -n 'TL-043-ARR'` and expect zero hits.
      NOTE: no suite name, target name, filename or signal name contains the string —
      only comments and docstrings — so the rename is text-only and breaks no build.
    rename_manifest_TL_043_ARR_to_TL_046:   # branch: origin/rev2/integration. old token "TL-043-ARR" -> "TL-046"
      - {file: Makefile, occurrences: 2}
      - {file: cocotb/tidelink_a2l_replay_cdc/Makefile, occurrences: 2}
      - {file: cocotb/tidelink_a2l_replay_cdc/test_a2l_replay_cdc_7.py, occurrences: 2}
      - {file: cocotb/tidelink_a2l_replay_cdc/test_a2l_replay_cdc_9.py, occurrences: 2}
      - {file: cocotb/tidelink_a2l_replay_cdc/tl027only_WlinkGenericFCReplayV2_7.v, occurrences: 1}
      - {file: cocotb/tidelink_a2l_replay_cdc/tl027only_WlinkGenericFCReplayV2_9.v, occurrences: 1}
      - {file: docs/FALSE_GREEN_REGISTER.md, occurrences: 1}
      - {file: flists/tidelink_a2l_replay_cdc_7.flist, occurrences: 1}
      - {file: flists/tidelink_a2l_replay_cdc_9.flist, occurrences: 1}
      - {file: src/rtl/local_overrides/WlinkGenericFCReplayV2_7.v, occurrences: 1}
      - {file: src/rtl/local_overrides/WlinkGenericFCReplayV2_9.v, occurrences: 1}
      - {file: TOTAL, occurrences: 15}
    summary: >
      The AR (_7) and R (_9) app-to-link replay nodes ship RAW from deps/ in BOTH the
      tapeout and FPGA flists and had no local_overrides copy at all — the files did not
      exist. Their sibling write-path nodes _1/_3/_5 and the sideband _12/_13 all carry
      the TL-027 CDC self-heal. Verified at the flist on origin/main 5e8bdb5a:
      tidelink_top_full_asic_v2.flist:306/308 and tidelink_fpga_v2.flist:304/306 both
      name deps/ for _7/_9, and src/rtl/local_overrides/ contains _1, _3, _5, _12, _13
      and no _7 or _9. The asymmetry was untracked because TL-027 asserted the opposite
      (see its closure note) and the 2026-08-13 escape-vs-safety audit enumerates
      _1/_3/_5/_12/_13 and omits AR/R entirely.
    root_cause: >
      deps _7/_9 drive the ACK-pointer CDC edge-triggered —
      `link_addr_to_app_clk_w_inc = a2l_link_addr != a2l_link_addr_in`. A torn value
      delivered through WavMultibitSync that is not followed by a further change never
      re-fires the edge, so the synced ACK pointer latches forever, a2l_full sticks,
      app_ready goes to 0 and that node stops transmitting. The hardened form drives it
      continuously (`= 1'b1`, "continuous resend") and self-heals within one mailbox
      round trip.
    fix:
      approach: "transplant the _1 form to src/rtl/local_overrides/WlinkGenericFCReplayV2_{7,9}.v with per-node width re-derivation, then re-point the ship + FPGA flists. Functional delta ~15 lines (ACK-window guard + continuous w_inc + TL-032 revert-aware rewind)."
      files: [src/rtl/local_overrides/WlinkGenericFCReplayV2_7.v, src/rtl/local_overrides/WlinkGenericFCReplayV2_9.v, flists/tidelink_top_full_asic_v2.flist, flists/tidelink_fpga_v2.flist]
      commit: e88ff7be
      branch: origin/rev2/integration      # NOT on origin/main — verified by merge-base
      netlist_affecting: true
    verification:
      sim_test: "sim_gate_a2l_replay_cdc_7 + sim_gate_a2l_replay_cdc_9 (reproduce-first A/B per node against the raw deps copy)"
      in_sim_gate: true          # on rev2/integration: Makefile:621-627, listed at :300 and invoked at :1973-1974. Gate wiring is a SEPARATE commit, 5994cce7 — the suites ran unscored before it.
      hw_tested: false
      hw_validated: false        # explicit
      evidence: null
      vehicle: null
    hazard_reviewed_2026_08_23: >
      Carried over from the draft, because it is the kind of check that should not have
      to be redone. The _1 form's TL-032 revert-aware rewind is UNCONDITIONAL, and a
      CONDITIONAL ACK-rewind was withdrawn from _13 by 1c1173e7 as refuted on silicon
      ("rewinding the ACK pointer can discard a legitimate in-flight ACK"). TL-032
      answers that structurally: link_revert and a2l_ack_valid are decoded from the SAME
      3-bit field against DIFFERENT constants (3'h2 vs 3'h3), so a revert can never
      coincide with a legitimate ACK and prioritising it cannot discard one. The
      exposure is structurally impossible, not merely unobserved.
    silicon_correlate_is_not_proof: >
      On freeze 5e8bdb5a, writes measured 6/6 runs 128/128 byte-exact while cross-die
      reads measured 2 PASS / 4 FAIL with three distinct failure signatures, and the
      pass/fail split follows the hardened/raw split exactly. THIS IS CORRELATION AND
      MUST NOT BE PROMOTED: three signatures suggest more than one contributor, read
      intermittency is also eye-sensitive, and a later finding
      (cross-die read failures traced to an ssh/instrument artefact) INVALIDATES read
      FAILURES as evidence while leaving the write PASSES standing. Whatever this entry
      is proven by, it is not that split.
    signoff:
      claude_verdict: >
        The GAP is verified directly at the flists and the override directory on
        origin/main and is not in doubt. The FIX and its A/B are on
        origin/rev2/integration and are not on the trunk. Netlist-affecting; David
        lands. Renamed from TL-043-ARR by the 2026-09-11 truth pass — see
        id_collision_resolution_2026_09_11 for the rename manifest, which must be
        executed on rev2/integration.
      evidence:
