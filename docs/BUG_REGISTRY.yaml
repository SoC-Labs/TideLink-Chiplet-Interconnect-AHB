      evidence:
        - "commit c6f091a1 'fix(TL-044): contain the ahb_sub READ DEAD GATE — bounded errors, not a wedged bus' (on origin/rev2/integration, NOT on origin/main)"
        - "origin/rev2/integration:Makefile:1005-1035 (mechanism + the six arms), :1038-1057 (park recipe)"
