  # ---------------------------------------------------------------------------
  - id: TL-002
    title: Standalone-IP early HREADYOUT on peer write (wr_hold_r)
    severity: high
    area: rtl/tidelink_top
    status: sim_proven
    summary: >
      Write mirror of the rd_pipe_r read fix. ahb_sub_hreadyout asserted early on
      a peer write, so the AHB master released HWDATA before the AXI W beat landed
      -> W captured 0 under XHB500 backpressure. wr_hold_r holds hreadyout LOW
      from the peer-write address latch until the AXI W beat lands.
    root_cause: >
      ahb_sub_hreadyout early-assert. SET ext_is_nonseq & ahb_sub_hwrite &
      ~pipe_valid_r; CLEAR on W-last handshake OR synth_b_pending (I5 backstop,
      bounded ~2^16 — no new hang). Deadlock-guarded (AW/W feed separate FC nodes).
    fix:
