      to WlinkGenericFCSM_6, the SIDEBAND node (data_id 0xA1), not the AW/W/B AXI
      data nodes that wedge (TL-039). Its trigger also cannot fire for this wedge
      class (TL-040). Do not cite that capture for or against TL-035.
      Part-B remains BLIND-MERGE-FORBIDDEN: auto_tx_out_advance was never probed —
      the 08-11 doc (lines 195-196) admits skipping it as "too-risky-to-plumb" —
      so the attended-ILA decision this entry demands is still outstanding.
    signoff:
      claude_verdict: >
        NOT the operative fix for the AW-inject wedge. TL-035 is real, correctly
        reasoned and sim-clean, and it is PRESENT in the tested netlist — and the
        wedge still occurs on a single AW inject. The failure is UPSTREAM of what
