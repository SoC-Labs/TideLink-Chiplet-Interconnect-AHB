        - "sub_stall_ctr_r is a CLEAN MONOTONIC +1/clock ramp 0x159f->0x259e with ZERO resets in the 4096-sample window. It ramps continuously, so over a ~20s wedge it MUST reach 2**16 (0.65ms @100MHz) and sub_stall_expired MUST fire repeatedly — yet arming still never occurs. That makes `& (sub_wr_os_ctr != 0)` the DECISIVE blocker: a timer genuinely expires and arming genuinely cannot happen."
