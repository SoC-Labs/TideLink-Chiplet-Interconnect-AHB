      IP tree and read-only; the MEASUREMENT is not re-checkable here.
    signoff:
      claude_verdict: >
        Real, mechanically argued, and the only entry in this file whose sim suite
        includes a mutant arm that requires the green test to fail — which is the
        discipline this project keeps discovering it needs. NOT on origin/main and NOT
