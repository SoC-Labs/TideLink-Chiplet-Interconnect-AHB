  - id: TL-041
    title: servo_locked behaviour change reached shipping+tapeout RTL inside a "No functional intent" commit
    severity: high        # tapeout-record / process risk, not a functional defect
    area: ptp
    status: sim_proven
    summary: >
      A BEHAVIOUR-CHANGING fix to servo_locked / SERVO_STATUS[0] landed in
      src/rtl/tidelink_ptp_servo.sv in commit b0e9334, whose header reads "lint:
      explicit widths and signedness across the RTL" with the body "No functional
      intent: each change makes an existing implicit conversion explicit". The
      hunk's OWN comment says "BEHAVIOUR-CHANGING FIX". It reached the trunk via
      merge a9ff715, so SERVO_STATUS[0] now changes value in the shipping FPGA
      AND in the tapeout ASIC netlist. The fix is CORRECT — reverting it would
      reinstate the defect — but it must not be inherited silently into a tapeout
      audit trail.
    root_cause: >
      Pre-fix (verified via `git show b0e9334`): `if ($unsigned(offset_r) <
      servo_step_thresh_r[31:2])`. offset_r is `logic signed [31:0]`, and
      $unsigned() REINTERPRETS the bit pattern rather than taking a magnitude, so
      any negative offset read as >= 2**31 — never below servo_step_thresh_r[31:2]
      (max 2**30-1). The else arm therefore fired and cleared lock_counter_r and
      servo_locked. Lock could only latch on LOCK_COUNT consecutive POSITIVE
      offsets, which a tracking servo dithering about zero never produces — so
      servo_locked never latched in practice. Post-fix (:680-681) the compare is a
      correct two-sided signed magnitude test:
        (offset_r <  $signed({2'b00, servo_step_thresh_r[31:2]})) &&
        (offset_r > -$signed({2'b00, servo_step_thresh_r[31:2]}))
      which also hardens against a software-written threshold with bit[31] set.
    fix:
      approach: "already applied and correct — this entry exists to make the change VISIBLE and signed-off, and to close its gating gap"
      files: [src/rtl/tidelink_ptp_servo.sv]
      commit: b0e9334      # landed on the trunk via merge a9ff715
      branch: integ/tidelink-consolidated-2026-08-07
      netlist_affecting: true
    verification:
      sim_test: "cocotb/tidelink_ptp_servo/test_tidelink_ptp_servo.py SRV-016..018 (added SEPARATELY in 9622c3d)"
      in_sim_gate: false   # VERIFIED 2026-08-13: grep -c ptp_servo Makefile = 0 -> CI sweep only, NOT gated
      hw_tested: false
    action_items:
      - "David sign-off required: this is a FUNCTIONAL change to tapeout RTL, not a lint change. Do not let the commit header stand as the record."
      - "Gate the servo suite: add cocotb/tidelink_ptp_servo to sim_gate (currently 0 references in the Makefile) so SERVO_STATUS[0] cannot move again ungated."
      - "Cross-check whether any PTP convergence claim (TL-010) was measured on the pre-fix, never-latching servo_locked."
    signoff:
      claude_verdict: >
        Fix is correct and independently verified (pre/post hunks read from
        b0e9334). The RISK is the audit trail, not the logic: a behaviour change
        to shipping AND tapeout RTL arriving under "No functional intent", with
        its regression tests in a different commit and the suite ungated. Exactly
        the class this project has been bitten by before.
      evidence:
        - "git show b0e9334 -- src/rtl/tidelink_ptp_servo.sv: pre `$unsigned(offset_r) < servo_step_thresh_r[31:2]`, post two-sided $signed compare, hunk comment 'BEHAVIOUR-CHANGING FIX'"
        - "commit body: 'No functional intent'"
        - "src/rtl/tidelink_ptp_servo.sv:680-681 (post-fix), :151 `logic signed [31:0]`"
        - "grep -c ptp_servo Makefile = 0 (suite exists at cocotb/tidelink_ptp_servo, SRV-016..018 present)"
      evidence_reverified_2026_08_13: >
        RE-VERIFIED AT MERGE TIME: `git cat-file -t b0e9334` = commit, header
        "lint: explicit widths and signedness across the RTL"; `grep -c ptp_servo
        Makefile` = 0. Both claims hold on the current tip.
      merge_note_2026_08_13: >
        THIS ENTRY'S verification AND signoff BLOCKS ARE ITS OWN. In the first
        revision of the additions file a TL-035 amendment was written at bare
        4-space indent immediately after this entry, so YAML absorbed it into this
        list item and last-key-wins SILENTLY SHADOWED the two blocks above. The
        TL-035 replacement blocks now live inside TL-035 where they belong;
        a duplicate-key-aware lint is part of the merge procedure.
      approved: false
    related: [TL-010]

  # ---------------------------------------------------------------------------
  - id: TL-042
    title: "CLASS: backstops that arm/clear on an intermediate signal the wedge itself suppresses"
    severity: high
    area: rtl/tidelink_top
    status: open   # merge_correction_2026_08_13: additions said root_caused; the candidate fix was BUILT, DEPLOYED and REJECTED ON HARDWARE, so this is OPEN with no viable fix. See rejected_candidate_2026_08_13.
    summary: >
      Three separate recovery backstops on the die_a outbound write path each
      fail the same way, and the shared shape matters more than any one of them:
      the arming or clearing condition is correct for the failure route its
      author had in mind, and is DEFEATED by a route they did not — because the
      condition keys on an INTERMEDIATE signal that the wedge itself suppresses.
      Logged as a class so the next backstop is not written the same way.
      2026-08-13: a candidate fix for the third instance was built, deployed and
      REJECTED on hardware — it regressed clean-path delivery from 16/16 to 0/16.
      The bug is REAL and remains OPEN; see rejected_candidate_2026_08_13.
    instances:
      - "Fix H (2026-08-01, tidelink_top.sv:1513-1525). Correctly diagnosed that a
         single outstanding BIT false-idles for 4-deep bufferable EWR writes and
         added sub_wr_os_ctr. That fixed the FIRST term of the :1667 reset. The
         SECOND term, `|| sub_axi_progress` (= sub_r_done | sub_b_done, :1574),
         survived — any read or SIBLING write-B still rearms the age timer."
      - "synth-B arming (:1857). `sub_wr_stuck_fire = (osr_expired | stall_expired)
         & (sub_wr_os_ctr != 3'd0)`. MEASURED ON SILICON 2026-08-13: at the wedge
         sub_wr_os_ctr = 0 because the write never reached s_axi at all
         (sub_aw_accept = 0), so the AND guard is false and NO timer expiry can
         ever arm the backstop. The guard keys on a counter the wedge prevents
         from ever incrementing."
      - "TL-002 wr_hold_r (:1828-1848). Its own comment documents a wr_hold-stuck
         hang and adds `clear on synth_b_pending` as the guard. But synth-B cannot
         arm when no AW was ever counted — precisely the measured state — so the
         guard cannot fire in the case it was added for. SUSPECTED, not yet
         probed: wr_hold_r is one of two live candidates holding
         ahb_sub_hreadyout low.
         2026-08-13 UPDATE: the candidate fix for THIS instance was rejected on
         hardware (see rejected_candidate_2026_08_13). The instance remains
         SUSPECTED-not-measured; the rejection tells us how NOT to fix it, not
         that the instance is wrong."
    root_cause: >
      Each backstop observes a PROXY for "the bus is stuck" rather than the
      condition itself. The proxies (outstanding-count non-zero, forward-progress
      absent, a sibling backstop having armed) are all downstream of the very
      transaction the wedge blocks, so the wedge removes the evidence of itself.
    fix:
      approach: >
        Backstops on this path must arm and clear on the CONSEQUENCE — the bus
        being held (sustained ahb_sub_hreadyout low) or a write not retiring
        within a bound — NOT on an intermediate signal that the wedge suppresses.
        Concretely: a watchdog keyed on sustained PS-facing stall, independent of
        sub_wr_os_ctr, sub_axi_progress and synth_b_pending. Wrapper-side; XHB500
        is read-only shared vendor IP outside this repo ($XHB500_IP_DIR).
      files: [src/rtl/tidelink_top.sv]
      commit: null
      netlist_affecting: true
    rejected_candidate_2026_08_13:
      verdict: REJECTED ON HARDWARE — HARMFUL. Not committed. RTL reverted to HEAD.
      what_it_did: >
        A `wr_hold_stuck = wr_hold_r && (sub_wr_os_ctr == 0)` arming term with a
        65536-cycle timeout, released by asserting `synth_b_pending`, plus a
        companion `s_axi_bvalid` suppression so no B was presented for a write
        XHB500 never issued.
      measurement: >
        Single-variable A/B on the KR260 eth-chiplet pair. die_b's image was
        BYTE-IDENTICAL in every run (md5 13573e46c3b27bb6b03b41b2ce730aa8), so
        die_a's bitstream was the only variable. Identical protocol per arm
        (POR -> fpgautil -> mandatory AFI fix -> concurrent bring-up -> status ->
        delivery -> errinject). EVERY reported run had a HEALTHY bring-up:
        fcsm=4 both dies, crack_seen=1 both, both RE-ANCHORED.
          baseline  (die_a md5 9eadebb8...) n=1 : 16/16 byte-exact, Region F gate PASS, die_a UP
          TL-042 fix(die_a md5 0366c344...) n=2 : 0/16 (got 0x00000000), gate FAIL, die_a DOWN
        Pre-registered predictions: P2 ("clean path stays 128/128") REFUTED on its
        own stated refutation condition. P1 and P3 NOT CLEANLY TESTED — plain
        delivery already failed before any injection, and the Region F sampler
        self-reports dead under load (TL-039/TL-040).
      regression_mechanism: >
        MECHANISM, not speculation. In tidelink_top.sv the TL-002 hold clears on
        `wr_hold_clr = (s_axi_wvalid & s_axi_wready & s_axi_wlast) | synth_b_pending`.
        `synth_b_pending` is therefore a TERM OF THE CLEAR: asserting it DISABLES
        the TL-002 peer-write hold for as long as it is high. The candidate reused
        `synth_b_pending` as its hold-release lever, so every time the new arm
        fired it defeated the data-phase protection that stops the peer-write
        payload drop — which is exactly the 0x00000000 read on die_b.
        COMPOUNDING: the companion `s_axi_bvalid` suppression removes the very
        handshake the clear term `synth_b_pending & s_axi_bready &
        (sub_wr_os_ctr <= 3'd1)` needs to DEASSERT synth_b_pending, so it can latch
        high permanently — at which point wr_hold_clr is permanently asserted and
        the hold can never engage again.
        The arming condition is also unsound on its own terms: `wr_hold_r &&
        (sub_wr_os_ctr == 0)` can be TRUE during a perfectly normal bufferable/EWR
        write, because an early B can return the counter to 0 while wr_hold_r is
        still validly waiting for its W beat.
      line_number_note: >
        TL042_HW_RESULT_REJECTED_2026_08_13.md cites `:1838` (wr_hold_clr) and
        `:1939` (the synth_b_pending clear). Those are CANDIDATE-PATCHED line
        numbers. On HEAD RTL (src/rtl/tidelink_top.sv, md5
        b75d391b0f659d808ac0a4cb37310643, verified at merge time) the same
        statements are at :1826-1827 and :1870 respectively. Cite the HEAD
        numbers when reading the unpatched tree.
      why_sim_missed_it: >
        The candidate passed a non-vacuity A/B (pristine FAILs "wr_hold_r STILL
        HIGH after 90k hclk"; fixed PASSes, escaping at cycle 65518) plus
        sim_gate_axi_datanode_recovery and _gaps, and still shipped a data-plane
        regression — because the test asserted only that the hold ESCAPES. It never
        asserted (1) that synth_b_pending subsequently CLEARS, nor (2) that a
        NORMAL write still lands after the arm has fired. The evidence was on
        screen and unexamined: the passing test's own log reads
        `synth_b_pending=1 holdclr_only=1` twenty cycles past the escape.
        A PASSING ESCAPE TEST IS NOT A SAFETY TEST.
      what_a_correct_fix_must_do:
        - "NOT key on `sub_wr_os_ctr == 0` alone — prefer 'no AW accepted SINCE this hold was set', which cannot be satisfied by a live EWR write."
        - "NOT release the hold via `synth_b_pending`, because that signal disables the hold wholesale. Needs a release path that clears wr_hold_r only."
        - "Be tested for: hold escapes, synth_b_pending returns to 0, AND a subsequent normal peer write lands byte-exact."
      artefacts:
