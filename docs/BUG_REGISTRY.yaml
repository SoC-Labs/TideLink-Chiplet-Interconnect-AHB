      in the block design" — still TRUE and still absent (grep of the whole repo
      for `axi_firewall|axi_timeout|firewall` returns zero instantiations,
      only prose) — but a 2026-08-14 investigation
      (imp/hw_gate/tl037/TL037_RESULT_2026_08_14.md, test commit 2c2f8d4) found
      that framing INCOMPLETE: src/rtl/tidelink_top.sv already contains the
      timeout mechanism this bug asks for, and it is dead for the case that
