    hol_write_age_watchdog_2026_08_23:
      status: SIM-PROVEN ON BRANCH rev2/tl042-backstop. NOT hw-tested. NOT on main.
      scope: >
        Fixes INSTANCE 1 only -- the shared aggregate age timer
        (`sub_axi_progress = sub_r_done | sub_b_done` re-zeroing sub_osr_ctr_r,
        and any hreadyout-raw blip re-zeroing sub_stall_ctr_r). It does NOT fix
        instance 2 as the 08-13 ILA describes it (a write never accepted onto
        s_axi is invisible to any counted-write watchdog, by construction), and
        it does NOT touch instance 3 (wr_hold_r).
      evidence_it_addresses: >
        Region-F obs word 0x8403_21F8 during a D2D peer-write wedge:
        healthy 0xB5000001 -> wedged 0xB5000498, i.e. sub_wr_os_ctr=4, hwm=4,
        pipe_hprot_r[2]=1 (bufferable/EWR), xhb_stall_stuck_sticky=1, and
        sub_wr_stuck_sticky=0. That last bit is SET-ONLY, so it proves the expiry
        NEVER HAPPENED -- starvation, not masking. CONTRADICTS the 08-13 ILA
        reading of sub_wr_os_ctr=0; see the amended caveat above.
      design: >
        Head-of-line WRITE age watchdog in the wrapper. Two 4-bit wrapping
        sequence numbers -- issue (incremented by an accepted AW) and retire
        (incremented by a returning B, GUARDED so it can never overtake issue) --
        name the oldest outstanding write. Its age counter is re-zeroed ONLY by
        that write's own retirement or by the port going write-idle, so
        sub_r_done and hreadyout blips cannot touch it. Timeout 2^17, ONE BINADE
        ABOVE the two 2^16 aggregate timers, so it is always last to fire and
        never pre-empts a backstop that would have fired on its own (measured:
        in the no-traffic control the aggregate backstop fires at 8192 and the
        watchdog does not arm).
      constraint_compliance: >
        Deliberately does NOT reuse or couple to wr_hold_r or synth_b_pending --
        the exact reuse that made the 08-13 candidate HARMFUL. It has its own
        pending register and its own BOUNDED drain (issue pointer snapshot at
        fire; exactly one OKAY B per write outstanding at that moment, never for
        a write accepted later). It writes nothing that any existing protection
        reads. Its only joins are additional OR terms on s_axi_bvalid/bresp/bid,
        beside the existing synth-B, and obs bit[12] (previously a constant 0).
        No new combinational dependence on ahb_sub_hready: every term is a
        register or an s_axi_* handshake.
      self_found_defect: >
        The FIRST implementation had an unguarded retire pointer. When the link
        recovered after a drain, the far side's late REAL B pushed retire PAST
        issue, so sub_wr_hol_valid read TRUE with nothing outstanding and the
        watchdog re-expired and drained until the 4-bit pointer WRAPPED --
        measured aw_accept=1 but b_done=17, hol_b_rises=2, in
        test_tl044_escape_is_clean_and_normal_path_survives. The escape assertions
        still PASSED; only the drain-bound number exposed it. Guard added
        (`if (sub_b_done && sub_wr_hol_valid)`, the analogue of the saturating
        Fix-H decrement) plus a permanent SYNTHETIC-B RUNAWAY assertion. Post-fix
        b_done=2 for aw_accept=1 (the synthetic beat plus the late real B).
      files: [src/rtl/tidelink_top.sv, "cocotb/tidelink_axi_datanode_recovery/test_tl044_hol_write_age.py", "cocotb/tidelink_axi_datanode_recovery/Makefile"]
      netlist_affecting: true
      not_proven:
        - "NO HARDWARE TEST. Nothing here has been near a KR260 or any silicon. The 08-13 lesson is that this path's sim A/Bs can pass and the build still regress the data plane."
        - "The symmetric READ-side starvation (a stuck read whose age is re-zeroed by write completions) is NOT fixed -- its only escape is sub_err1_r, and re-gating that would modify an existing protection."
