    severity: rank1_critical
    area: phy/calibrator
    status: root_caused
    summary: >
      Re-running the FULL `make sim_gate` on the consolidated tip (2c249ec = the
      eth-chiplet's current pin) — which the HW-only campaign NEVER did (stale-simv /
      sim_gate-not-invoked trap) — finished with 14 BLOCKING FAILs + 38 PASS +
      xfail_epoch_shipping_corrector=XCHG. The TL-001 calibrator "10x soak" work broke a
      broad swath of autonomous suites. Three families:
      (1) FIX 1 centering-on (min_lock_dwells 0->1): t31_autonomous_training_exit,
          t33_arm_stagger_episode_bind (ran 3.5h then FAILED = hang), retire_en_plumb —
          all "swi_training_mode_r never engaged". BISECTED: 1107151=PASS, e5bd29c=FAIL.
      (2) FIX 2 threshold 5->6: v2_autonomous_sync_detect asserts autonomous lock
          threshold==5, gets 6 (LITERALLY FIX 2); + lane_locked=0x00 family v2_pair_data,
          epoch_silicon, v2_reduced_lane, v2_mask_hs_bilateral.
      (3) obs work / flist: asic_v1_elab, asic_v2_elab, dft_wrapper_elab fail to
          elaborate (tidelink_winscan_obs not in ASIC flist = TL-020); tc_pair_smoke,
          tc_pair_election_datamode undefined-port; epoch_anchor_plumb.
      A fast 1107151 base run is splitting pre-existing (TL-020 flist) from new. The
      original single-suite framing (t31 only) UNDERSTATED this — it is broad.
    root_cause: >
      BISECTED 2026-08-07 (ran t31 across the calibrator line, VERDICT = grep of the
      sim_gate PASS marker; note `make sim_gate_t31` exits 0 even on suite FAIL so the
      grep is authoritative, NOT the exit code):
        1107151 = PASS ; e5bd29c (FIX 1) = FAIL ; 235d758 (FIX1+obs) = FAIL ;
        2c249ec (FIX1+obs+FIXD+FIX2) = FAIL.
      => e5bd29c (FIX 1) is THE culprit commit. e5bd29c makes two changes:
      (a) min_lock_dwells 0->1 "centering-on" (axi_chiplet_controller.sv ~:2153) — the
      autonomous calibrator switches from S_PROBE(0,0) edge-framing to a full S_SWEEP +
      eye-centre; (b) the calibrated_once_q latch gate. (a) is the mechanism: with
      centering-on the calibrator reaches lock/S_HOLD without the autoneg entering
