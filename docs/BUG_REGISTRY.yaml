  - id: TL-043
    title: "Hazard-1 — synth_b_pending is a LEVEL term of wr_hold_clr, so a drain blinds the TL-002 write hold for EVERY other write"
    severity: high
    area: rtl/tidelink_top
    status: sim_proven
    registered: 2026-09-11        # the FIX landed 2026-08-18; the id went unregistered for three weeks
    summary: >
      wr_hold_clr was `(s_axi_wvalid & s_axi_wready & s_axi_wlast) | synth_b_pending`.
      The second term is a LEVEL, not an event: while synth_b_pending is asserted to
      drain one stuck write, the TL-002 peer-write data-phase hold (wr_hold_r) is held
      cleared for every OTHER write in flight, so those writes release their data phase
      early — the exact rank-1 data-drop TL-002 exists to prevent. The recovery
      mechanism disables the protection, which is the same shape as TL-005's
      synth_b_pending-defeats-the-read-backstop finding and as the 2026-08-13 candidate
      that regressed 16/16 to 0/16 on hardware.
    root_cause: >
      A level used where an edge was meant. src/rtl/tidelink_top.sv:1971-2009 now reads
      the pre-fix form at :2006 (`| synth_b_pending;  // pre-fix LEVEL (bug, TL-043)`)
      against the fix at :2009 (`| wr_hold_drain_release;  // TL-043: edge-qualified
      drain release`), both retained in-source so the change is legible at the site.
    fix:
      approach: "edge-qualify the drain release: wr_hold_drain_release is a one-cycle pulse at the start of a synth-B drain instead of the drain's whole duration"
      files: [src/rtl/tidelink_top.sv]
      commit: 2413aa60          # landed via merge 77d9bcbe; both ancestors of origin/main (merge-base)
      branch: origin/main
      netlist_affecting: true
    verification:
      sim_test: "cocotb/tidelink_axi_datanode_recovery/test_tl002_wrhold_drain_guard.py — white-box invariant (a) non-vacuity: synth_b_pending observed ==1; (b) wr_hold_r latches under it; (c) it releases via the edge, not the level. Plus a DATA-LANDING arm asserting the second write's payload lands byte-exact."
      in_sim_gate: true         # Makefile:807-808 -> make wrhold_drain_guard, under the writehold suite
      hw_tested: false
      hw_validated: false       # explicit — no board run isolates this fix
      evidence: null
      vehicle: null
    naming_note: >
      The test file is named test_tl002_wrhold_drain_guard.py, not test_tl043_*. That
      is deliberate and is NOT the collision: the defect is in TL-002's mechanism and
      the file sits with TL-002's other write-hold tests. Left as-is; renaming it would
      be churn that breaks the Makefile suite for no gain.
    signoff:
      claude_verdict: >
        Landed and gated on the trunk, sim-proven with an explicit non-vacuity arm.
        Registered here three weeks late — the id was in shipping RTL comments, in a
        cocotb test and in a merge subject line while this file had never heard of it.
        Netlist-affecting and landed on the public default branch, so the sign-off is
        owed retrospectively, as for TL-026.
      evidence:
        - "src/rtl/tidelink_top.sv:1971 (fix banner), :2006 (pre-fix LEVEL retained), :2009 (edge-qualified release)"
        - "commit 2413aa60, merged 77d9bcbe; both ancestors of origin/main"
        - "cocotb/tidelink_axi_datanode_recovery/test_tl002_wrhold_drain_guard.py; Makefile:807-808"
      approved: false
    related: [TL-002, TL-005, TL-042, TL-045]

  - id: TL-044
    title: "ahb_sub READ DEAD GATE — after the read backstop fires, an IDLE port drives HREADYOUT LOW forever and wedges the WHOLE AHB bus"
    severity: high
    area: rtl/tidelink_top
    status: sim_proven
    registered: 2026-09-11
    summary: >
      What TL-037 left open. The read backstop retires a stuck read correctly and
      TL-037 bounds the next transfer addressed to this port, but sub_err1_r/sub_err2_r
      are ONE-SHOTS: two cycles later every term of the ahb_sub_hreadyout mux is 0 on an
      idle bus and the port falls through to its terminal fallback,
      xhb_sub_hreadyout_raw, which XHB500 holds LOW forever because a lost R parks
      read_counter non-zero and only r_done decrements it. The port therefore drives
      HREADYOUT LOW WHILE IDLE — an AHB-Lite violation whose blast radius is the whole
      bus, since the AHB mux keeps presenting this slave's HREADYOUT to the manager
      between transfers. The next transaction of ANY kind, to this port or to any other
      slave, never starts, with no bus timeout. TL-037's terminal-timeout arm cannot
      cover it: that arm needs sub_mst_dphase_r, which on an idle bus is 0 by
      construction.
    fix:
      approach: >
        CONTAINMENT, not repair — XHB500 cannot be un-wedged from the wrapper, and
        XHB500 itself is shared vendor IP that must not be modified. A sticky
        xhb_dead_r, armed only after a 2-cycle ERROR has fired AND the bridge has shown
        no sign of life for XHB_DEAD_ARM_LOG2 consecutive cycles, releases an IDLE bus
        and retires every subsequent transfer with a bounded 2-cycle AHB ERROR. It
        never fabricates read data.
      files: [src/rtl/tidelink_top.sv]
      commit: c6f091a1
      branch: origin/rev2/integration      # NOT on origin/main — verified by merge-base
      netlist_affecting: true
    verification:
      sim_test: "sim_gate_tl044_read_deadgate (six blocking arms: RED / GREEN / SAFETY / INTERMITTENT / FALSE-FIRE + a two-armed MUTANT whose define disables the ACTION while leaving DETECTION intact, and whose negative arm REQUIRES the GREEN test to fail) + sim_gate_tl044_park_recipe"
      in_sim_gate: true                    # on rev2/integration only
      hw_tested: false
      hw_validated: false                  # explicit — no board run
      evidence: null
      vehicle: null
    park_recipe_is_not_a_third_claimant: >
      `tl044_park_recipe` reads like a third TL-044 claimant and is not one. Read at
      the Makefile: it arms two INDEPENDENT REAL parks (far terminus stops answering; R
      persistently lost in the link with the far die healthy), shows they produce the
      same internal signature, and then drives all three of the containment's own exit
      branches — NEVER (structural: while parked no further AR is admitted, so no
      r_done, so read_counter is decremented by nothing), RECOVERED (a real late R
      un-parks it), INTERMITTENT (RELAPSE_MAX+1 genuine cycles latch xhb_dead_perm_r) —
      with no Force anywhere. That is TL-044's own safety test, and it is the thing the
      deadgate suite could not do because its INTERMITTENT arm has to Force
      xhb_sub_hreadyout_raw to author a waveform. Correctly named; recorded here so it
      stops reading as a collision.
    cannot_tell_from_this_repository: >
      Whether the containment's blast-radius claim ("0 raw-high cycles in 8093 on
      pristine 5e8bdb5a") reproduces: that measurement is quoted in the rev2/integration
      Makefile and no capture or log containing it is retained on this host. The
