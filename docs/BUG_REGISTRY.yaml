  - id: TL-032
    title: "Calibrator eye-centre run-tracker SPLITS a wrap-straddling framing (non-circular over the mod-16 phase axis) -> write-drop lottery"
    severity: high
    area: rtl/phy
    status: sim_proven
    summary: >
      The RX phase axis is CIRCULAR mod-16 (WavD2DGpioRx_v2.v:406 adj_count=count+io_phase_offset) but the
      calibrator eye-centre run-tracker scores it LINEAR [0..15] and resets run_len at sweep_phase==15
      (tidelink_phy_align_calibrator_v2.sv ~:2179-2246). A passing eye STRADDLING the phase 15->0 wrap at a
      fixed slip (e.g. {14,15,0,1}) is split into two sub-runs; with MIN_LOCK_DWELLS=3 neither reaches the
      gate, best_run never promotes, S_FINALIZE finds no eye-centre, and the lane drops to the (0,0)/edge
      fallback = THE PEER-WRITE DROP. Whether the eye straddles the wrap is set per bring-up by the mod-16
      free-running-count lottery (WavD2DGpioRx_v2.v:262) -> a DETERMINISTIC ~2-3/16 contributor to the
      TL-001 drop lottery, INDEPENDENT of the physical eye. Found by the multi-agent 'is it really physical?'
      probe; REPRODUCED + FIXED in sim.
    fix:
      approach: "circular stitch: new head_run_len tracker (the run starting at phase 0) + a phase-15 wrap-stitch so a straddling run scores its true width. Applied to calibrator_v2 (FPGA-V2 + ASIC-V2 shipping) + the deps cocotb twin. V1 src/rtl calibrator (legacy/being-retired, different structure) NOT patched."
      files: [src/rtl/local_overrides/tidelink_phy_align_calibrator_v2.sv, deps/tidelink-phy/rtl/tidelink_phy_align_calibrator.sv]
      commit: 3f037c04
      commits_landed_on_main: [3f037c04, 8104b1ee]   # 3f037c04 = the circular stitch; 8104b1ee ported the TL-032 revert-aware rewind alongside the TL-027 self-heal
      branch: origin/main        # WAS integ/tidelink-consolidated-2026-08-07
      netlist_affecting: true
      landed_2026_09_11: >
        `commit: pending` CORRECTED to 3f037c04 "fix(TL-032): circular run-tracker
        stitch — sim-proven cure for the wrap-straddle write-drop", confirmed an
        ancestor of origin/main by merge-base; 8104b1ee carried the revert-aware
        rewind into the a2l replay overrides with TL-027.
        NOT WEAKENED BY THIS: hw_tested is still false and stays false. The sign-off
