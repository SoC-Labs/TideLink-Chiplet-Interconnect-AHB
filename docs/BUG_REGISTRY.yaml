        - "The two silicon captures disagree about sub_wr_os_ctr at the wedge and neither was re-taken. If the 08-13 shape is the operative one, this watchdog is correct and INERT."
      verification:
        make_targets: ["make -C cocotb/tidelink_axi_datanode_recovery tl044_hol", "make -C cocotb/tidelink_axi_datanode_recovery tl044_hol_prefix"]
        tests:
