      and the killed fix must not be re-proposed.
      THE GAP: tidelink_top.sv:1667 `if (!sub_axi_outstanding || sub_axi_progress)
      sub_osr_ctr_r <= '0;`. Fix H (2026-08-01, :1513-1525) fixed the FIRST term — a
      single outstanding BIT falsely read idle for 4-deep bufferable EWR writes, so
      it added sub_wr_os_ctr to keep sub_axi_outstanding asserted until every write
      drains. The SECOND term was left. sub_axi_progress = sub_r_done | sub_b_done
      (:1574) still resets the age timer on ANY read completion or ANY SIBLING
      write-B. In a mostly-succeeding 32-write bufferable stream each sibling
      completion rearms the stuck write's timer, sub_osr_expired never fires,
      sub_wr_stuck_fire (:1857) never asserts, and synth-B never arms — "present,
      ungated, never arms". Same defect class as the one Fix H fixed (per-write state
      collapsed into a global signal), one line apart. This is TL-042 instance 1.
      *** THE PROPOSED FIX IS KILLED — DO NOT BUILD IT. *** The 2026-08-13 additions
      proposed a separate HEAD-OF-LINE WRITE-AGE TIMER (age the oldest unretired
      write; reset only when THAT write retires; do not re-gate the shared counter,
      since a read completion resets the write timer through the `|| sub_axi_progress`
      term). The 08-13 die_a ILA killed it: at the wedge the stuck write is NEVER
      COUNTED IN sub_wr_os_ctr at all (sub_aw_accept=0, sub_wr_os_ctr=0), so a timer
      that ages counted writes would review as correct AND DO NOTHING. See
      TL-042.caveats and TL-042.rejected_candidate_2026_08_13 — a different candidate
      keyed on the same family of intermediate signals was built, deployed and
      REJECTED on hardware (16/16 -> 0/16). Any replacement must arm on the
      CONSEQUENCE (sustained ahb_sub_hreadyout low), not on a proxy the wedge
      suppresses.
