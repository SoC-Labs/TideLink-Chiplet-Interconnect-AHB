        - "imp/hw_gate/PREREG_TL042_HW_2026_08_13.md (predictions recorded BEFORE the build finished)"
        - "imp/hw_gate/tl042_rejected_fix/tl042_fix_REJECTED.patch (+ tidelink_top.MYFIX_NODEBUG.sv)"
