  - id: TL-037
    title: No AXI firewall / AXI timeout on the cross-die write path (PS hard-hangs, no recovery)
    severity: high
    area: fpga/integration
    status: open
    summary: >
      A wedged cross-die write hangs the PS AXI bus with NO software-visible
      timeout: the store never returns, ssh dies at 60 s, and recovery is
      JTAG-POR ONLY. There is no AXI Firewall / AXI Timeout IP in the block
      design to terminate the stalled transaction and return a DECERR, so a
      single lost B response escalates from "one failed write" to "board
      unreachable, POR required". This is a PRE-EXISTING documented proposal
      (docs/AXI_DATANODE_RECOVERY_AMPLIFIER_SOUND_2026_08_01.md:160,210,287)
      that was never given a registry id — grep of the registry for
      `firewall|axi timeout` returns nothing.
    root_cause: >
      Not an RTL defect: an integration/survivability gap. The AXI interconnect
      between the PS master and the TideLink peer window has no timeout
      terminator, so a far-side stall propagates all the way back into a
      non-interruptible PS store.
    fix:
      approach: >
        Instantiate AXI Firewall (or AXI Timeout) on the PS->peer-window path in
        the eth-chiplet block design; program a bounded timeout; return DECERR on
        expiry so the PS store completes and Linux survives. Pair with the
        existing synth-B drain so the bridge also re-idles.
      files: [fpga/targets/kr260-eth-chiplet]
      commit: null
      branch: null
      netlist_affecting: true
    caveats:
      - "SURVIVABILITY MITIGATION, NOT A ROOT-CAUSE FIX — it converts a hard hang into a reported error; the write is still lost."
      - "FPGA-ONLY (PL block design). Does NOT help the ASIC, where the same stall must be handled in RTL. Do not let it mask TL-035/TL-009 on the tapeout trunk."
    verification: {sim_test: none, in_sim_gate: false, hw_tested: false}
    signoff:
      claude_verdict: >
        Real, valuable for rig throughput (removes the JTAG-POR-per-wedge tax
        that has been costing whole sessions), but explicitly NOT a substitute
        for the root-cause fix and NOT applicable to silicon.
      evidence: ["docs/AXI_DATANODE_RECOVERY_AMPLIFIER_SOUND_2026_08_01.md:160,210,287", "registry grep firewall|axi timeout = 0 hits"]
      approved: false
    related: [TL-035, TL-009, TL-005]

