# AMENDMENTS to existing entries
# =============================================================================
# TL-009 — its FIRST ground_truth bullet is an OVER-READING and must be softened.
#   It states: "Region F OBS_AXI_NODES (0x21E0) reads HEALTHY (0xad800000, zero
#   wedge/resp-err/stall) on BOTH dies right up to the wedge => NOT an FC-node
#   wedge."  The inference does not hold. Verified against
#   src/rtl/tidelink_axinode_obs.sv:65-90: BOTH wedge_sticky[19:10] and
#   stall_live[9:0] are built from (valid & ~ready), and resp_err[21:20] latches
#   only on a COMPLETED handshake carrying resp[1]. So a B that is NEVER DRIVEN
#   (b_valid = 0 forever — exactly the AXIREC lost-completion case) produces no b
#   stall, no b wedge and no resp_err, and the word reads 0xad800000 = "healthy"
#   DURING a genuine PS hang.
#   => 0xad800000 at a wedge is AMBIGUOUS between (a) a never-returned B and
#      (b) the sampler not sampling (TL-039/TL-040). It is NOT evidence that the
#      AXI nodes are fine, and TL-009's "NOT an FC-node wedge" conclusion — which
#      is what pushed that investigation toward "per-write resource leak" and then
#      toward the physical-eye story — was never entitled to that reading.
#   The only POSITIVE signal for a stuck write is aw/w wedge_sticky
#   (tgt [10]/[11], ini [15]/[16]) = write accepted but not draining.
#   ACTION: amend the bullet to "Region F reads 0xad800000; by construction this
#   cannot distinguish a never-driven B from an unsampling instrument, so it
#   neither confirms nor excludes an AXI-node wedge", and re-run with the
#   aw/w-sticky reading before drawing any conclusion.
# TL-005 / TL-007 — NARROW the hw_proven scope.
#   Both cite exactly one silicon observation: "die_a survives
#   `errinject --node B --inj-byte 0`". That is ONE inject class on ONE node.
#   It does NOT establish recovery for AW/W injects, nor for B byte-1 (TL-038,
#   which still wedges). Add to each verification block:
#     hw_scope: "B-node byte-0 single-bit inject ONLY; AW/W and B byte-1 untested/failing"
#   This does not retract either verdict — it stops them reading as general
#   recovery proof, which is how the campaign rollup has been using them.
#
# TL-006 — byte-1 coverage is SIM-ONLY on silicon evidence; cross-reference TL-038.
#
# TL-035 — record that the 2026-08-12 ILA capture does NOT bear on it (wrong
#   node: sideband FCSM_6, not the AW/W/B data nodes), and that Part-B remains
#   BLIND-MERGE-FORBIDDEN because auto_tx_out_advance was never probed
#   (08-11 doc lines 195-196 admit skipping it as "too-risky-to-plumb").

# =============================================================================
# TL-035 — replacement verification + signoff blocks (supersedes the existing)
# =============================================================================
# =============================================================================
# TL-035 — amendment from the 2026-08-13 hardware A/B.
# Replaces the verification + signoff blocks. Evidence: tidelink/imp/hw_gate/
#
# STRUCTURAL NOTE — do not remove the `---` or the wrapper key below. In the
# first revision this block sat as a bare 4-space-indented verification:/signoff:
# pair, so YAML absorbed it into the PRECEDING list item (TL-041) and silently
# shadowed that entry's own verification and signoff by last-key-wins. PyYAML
# parsed it without complaint; only a duplicate-key linter caught it. Making it a
# separate document under its own key keeps TL-041 intact and keeps this block
# machine-readable for whoever merges it.
# =============================================================================
---
tl035_replacement_blocks:
    verification:
      sim_test: >
        NONE that exercises this defect. cocotb/tidelink_top_pair/test_l7_wedge_repro.py
        drives the pair-TB master FCSM (which is WlinkGenericFCSM_6, the TRANSPORT
        node) into a stuck state 7 via the bringup-forgive path, and never sets
        socl_l7_real_crc_seen — so the gated `nack_wedge_recovery` suite PASSING
        does NOT validate TL-035. Confirms the registry's original "does NOT
        reproduce in any sim". COVERAGE GAP remains open.
      in_sim_gate: false
      hw_tested: true      # 2026-08-13, first attributable A/B on the KR260 pair
      hw_evidence: >
        Arm B = .tl033 (source d317c98...-dirty, Part-A + Part-B, verified
        STRUCTURALLY in the packaged IP the build consumed; TL033_LEGACY_WDOG
        defined nowhere). Deployed md5-pinned (die_a 8947a50d, die_b 5979d88c)
        with abort-on-mismatch. Fresh JTAG POR both dies, AFI 32-bit PASS both,
        concurrent bring-up: both dies calibration_done=1 fcsm=4 cr_seen=1
        crack_seen=1.
        DELIVERY: PASS — adversarial stream landed byte-exact, 200 iters
        (seed 0xC0FFEE, win=16), both directions, data_exact=True wedge=False.
        INJECT: a SINGLE AW byte0/bit0 inject on die_a WEDGED die_a hard (ssh
        timeout, JTAG-POR required). Region F 0x21E0 on die_b moved
        0xad800000 -> 0xad408020 = healthy=0, any_stall_live=1,
        ini_wedge_sticky={aw}, ini_stall_live={aw}, tgt clean, resp_err=0 both.
        => THE FIX IS PRESENT AND DOES NOT PREVENT THE WEDGE.
      hw_scope: "single AW byte-0/bit-0 inject, eth-chiplet two-board pair, n=1 per arm"
    localization_2026_08_13: >
      The wedge is at the AW ADDRESS phase on die_b's RECEIVE/RE-ISSUE side, not
      on the completion/return path. Face identity is fixed by PORT DIRECTION and
      is role- AND flip-independent (verified: axi_tgt_0_aw_valid is `input wire`
      at axi_chiplet_controller.sv:271 = the local PS master's subordinate face;
      axi_ini_0_aw_valid is `output wire` at :314 = the manager re-issuing an
      incoming remote write into LOCAL memory; grep of the -flip target dir for
      axi_tgt_0/axi_ini_0 is EMPTY, and role_is_master never gates face identity).
      So die_b's ini_aw sticky = die_b re-issuing the die_a-originated write into
      die_b's own memory and stalling at the address phase. The write CROSSED the
      link and never reached a completion stage.
      CONSEQUENCE: the "lost write completion (B/HRESP) on the PS-return path"
      thesis of DEV_MESSAGE_D2D_WEDGE_ILA_CONFIRMED_2026_08_13.md is REFUTED BY
      POSITIVE CONTRADICTION (b channel clean, resp_err=0, aw sustained-stalled),
      not merely unsupported. Its author has withdrawn it.
      NEXT LOCUS — "what holds die_b's re-issue AW after a CRC recovery", given
      steady-state delivery is 200/200 so it is recovery-specific:
        (i)   AW-node a2l-replay RECOVERY latch (self-latch on the recovery path);
        (ii)  a credit / outstanding counter on die_b's AW path not clearing
              after the NACK/replay;
        (iii) the manager re-presenting a stale/duplicate AW the local slave
              will not re-accept.
    signoff:
      claude_verdict: >
        NOT the operative fix for the AW-inject wedge. TL-035 is real, correctly
        reasoned and sim-clean, and it is PRESENT in the tested netlist — and the
        wedge still occurs on a single AW inject. The failure is UPSTREAM of what
        the state-7 NACK watchdog controls: die_b never completes the ADDRESS
        phase of the re-issued write, so the completion machinery TL-035 governs
        is never reached. Do NOT sign TL-035 off as the wedge fix. It may still be
        correct-and-worth-keeping (it removes a real permanent-disarm defect), but
        its justification is now hygiene, not this failure mode.
        Part-B remains BLIND-MERGE-FORBIDDEN: auto_tx_out_advance has still never
        been probed, so the attended-ILA decision the registry demands is still
        outstanding and is NOT discharged by this run.
      evidence:
        - "imp/hw_gate/tl035_tl035/ (full Arm B run: 00_run.log, Region F pre/post, sweep, verdict)"
        - "imp/hw_gate/PREREGISTERED_PREDICTIONS_2026_08_13.md (predictions recorded BEFORE the run)"
        - "die_b 0x21E0: 0xad800000 -> 0xad408020"
        - "structural: packaged IP WlinkGenericFCSM*.v carry wdog_progress + state-7 exit; TL033_LEGACY_WDOG undefined in the build"
      approved: false

