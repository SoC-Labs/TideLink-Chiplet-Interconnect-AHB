  # ---------------------------------------------------------------------------
  - id: TL-036
    title: TL-035 watchdog fix does not cover WlinkGenericFCSM_6 (sideband FC node)
    severity: medium
    area: rtl/wlink
    status: root_caused
    summary: >
      The TL-035 fix (non-sticky state-7 NACK watchdog) was applied to
      WlinkGenericFCSM.v and _1/_2/_3/_4 — which is complete coverage of the AXI
      data plane (base=wlink_axiawFC AW 0x80, _1=wlink_axiwFC W 0x81,
      _2=wlink_axibFC B 0x82, _3=wlink_axiarFC AR 0x83, _4=wlink_axirFC R 0x84,
      all instantiated in deps/axi-chiplet-controller/logical/wlink/AXI4ToWlink.v).
      It was NOT applied to WlinkGenericFCSM_6 (`wlink_tidelinktl`, the sideband
      FC node, data_id 0xA1), where the identical defect is still live and
      unconditional: `socl_l7_wdog_force_clear = (wdog_cnt==THRESHOLD) &
      ~socl_l7_real_crc_seen` and `else if (socl_l7_real_crc_seen) wdog_cnt <= 0`.
      So after the FIRST real CRC on the sideband channel, the sideband state-7
      NACK backstop is disarmed for the lifetime of the reset cycle — the exact
      TL-035 mechanism, on the channel that carries doorbell/mailbox/IPC.
    root_cause: >
      src/rtl/local_overrides/WlinkGenericFCSM_6.v — sticky `socl_l7_real_crc_seen`
      gates both `wdog_force_clear` and `wdog_cnt`. _6 carries an extensive header
      comment (:143-186) documenting the disarm as INTENTIONAL ("production silicon
      with genuine link errors disarms the watchdog permanently"), which is the
      design intent TL-035 overturns: the disarm is what creates the permanent
      recovery deadlock. The TL-035 fix preserves the original safety intent by
      replacing the sticky disarm with an instantaneous forward-progress proxy
      (`auto_tx_out_advance`), so the watchdog cannot fire while the FCSM is
      making progress — that same reasoning applies unchanged to _6.
    fix:
      approach: >
        Port the TL-035 Part-A pattern to _6 verbatim: guard the legacy gate behind
        `ifdef TL033_LEGACY_WDOG` (default = fixed), add
        `socl_l7_wdog_progress = auto_tx_out_advance`, and clear wdog_cnt on
        progress instead of on the sticky. Part-B (state-7 exit) needs the same
        attended-ILA decision as TL-035 before it is applied to _6.
      files: [src/rtl/local_overrides/WlinkGenericFCSM_6.v]
      commit: null
      branch: null
      netlist_affecting: true
    verification:
      sim_test: >
        cocotb/tidelink_top_pair/test_l7_wedge_repro.py already forces the pair-TB
        master FCSM (which IS _6) into a stuck state 7, but does NOT set
        socl_l7_real_crc_seen — so it exercises the bringup-forgive path, not the
        sticky-CRC path. A TL-036 reproduce test is a small delta on that file
        (additionally Force socl_l7_real_crc_seen=1); with the ifdef in place the
        same test proves fix-vs-legacy by define. COVERAGE GAP.
      in_sim_gate: false
      hw_tested: false
    discovered: >
      2026-08-13, while structurally verifying that the TL-035 FPGA build actually
      changes the operative write path (it does — all 5 AXI nodes are covered).
    signoff:
      claude_verdict: >
        Real but SECONDARY to TL-035: off the AXI write path, so it does not
        invalidate the TL-035 A/B. Sideband-channel exposure only. Not yet fixed,
        deliberately not widened mid-experiment to keep the TL-035 build provenance
        clean.
      evidence:
        - "grep matrix: FCSM.v/_1/_2/_3/_4 carry TL033_LEGACY_WDOG ifdef; _6 does not"
        - "WlinkGenericFCSM_6.v:646-648 `& ~socl_l7_real_crc_seen` live"
        - "AXI4ToWlink.v:567/605/643/681 instance->node mapping"
      approved: false
    related: [TL-035, TL-033]


