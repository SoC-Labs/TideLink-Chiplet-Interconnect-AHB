      files: [src/rtl/local_overrides/axi_chiplet_controller.sv]
      netlist_affecting: true
    caveats:
      - "ILA insertion has PREVIOUSLY CAUSED this wedge class on this design: WlinkGenericFCSM_6.v:129-138 records build #4 (ILA-inserted) wedging 5/5 deploys at state 7 because P&R moved crack_pkt_seen_rx downstream of the slave's state-2 exit. Any die_a ILA arm MUST be paired with a no-core control build."
      - "Region F 0x21E0 already answers the per-channel question with NO ILA — try that first (see TL-040 note and cov_axinode_wedge_gate.py)."
    verification: {sim_test: n/a, in_sim_gate: false, hw_tested: n/a}
    signoff:
      claude_verdict: "Instrument defect, not a DUT defect — but it invalidated a silicon root-cause conclusion, so it is worth an id."
      evidence: ["strings _ila/tidelink_design_wrapper.ltx | grep dbg_ -> 22 probes, none on the AXI nodes", "Wlink.v:1132", "TideLinkToWlink.v:149", "tidelink_fc_adapter.sv:254-264", "axi_chiplet_controller.sv Region F comment: the AXI2WL data nodes that actually wedge had NO APB-visible health field"]
