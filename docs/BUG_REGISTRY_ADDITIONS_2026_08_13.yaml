  - id: TL-040
    title: dbg_a2l_wedged trigger cannot fire for the observed wedge class
    severity: medium
    area: verif/obs
    status: root_caused
    summary: >
      The ILA's designed trigger is inert for exactly the failure it was built to
      catch. axi_chiplet_controller.sv: `else if (sync_obs_a2l_app_rdy_1) begin
      dbg_a2l_stall_cnt_q <= 0; dbg_a2l_wedged <= 1'b0;` — at this wedge
      app_rdy=1, so the stall accumulator is pinned at zero and dbg_a2l_wedged
      never asserts. The 08-12 capture confirms it: dbg_a2l_wedged=0 in all 4096
      samples, TRIGGER=1 only at the forced trigger-position marker, and the
      harness logged "RESULT: ILA capture timeout". The capture window is
      therefore arbitrary, NOT proven to be the wedge instant.
    fix:
      approach: "trigger on the Region F wedge-sticky bits (OBS_AXI_NODES 0x21E0 [19:10]) instead of dbg_a2l_wedged; those latch and cannot self-clear"
      files: [src/rtl/local_overrides/axi_chiplet_controller.sv]
      netlist_affecting: true
    verification: {sim_test: n/a, in_sim_gate: false, hw_tested: n/a}
    signoff:
      claude_verdict: "Instrument defect. Any future capture that keeps this trigger will keep producing arbitrary windows read as wedge evidence."
      evidence: ["ila_capture.csv: dbg_a2l_wedged=0 x4096", "ila_capture_run/summary.txt: RESULT: ILA capture timeout", "run.log: hw_ila does not have a CORE_STATUS property"]
      approved: false
    related: [TL-039]

