      channel. Consequence: a capture taken to root-cause an AXI write wedge
      contains no information about the AXI write path, and was read as
      "all four mechanisms refuted".
    fix:
      approach: >
        Add (* mark_debug *) on axinode_obs_word[31:0] (ALREADY instantiated and
