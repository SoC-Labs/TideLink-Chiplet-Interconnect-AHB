#   Fix H (2026-08-01, :1513-1525) fixed the FIRST term — a single outstanding
#   BIT falsely read idle for 4-deep bufferable EWR writes, so it added
#   sub_wr_os_ctr to keep sub_axi_outstanding asserted until every write drains.
#   The SECOND term was left. sub_axi_progress = sub_r_done | sub_b_done (:1574)
#   still resets the age timer on ANY read completion or ANY SIBLING write-B.
#   In a mostly-succeeding 32-write bufferable stream each sibling completion
#   rearms the stuck write's timer, sub_osr_expired never fires,
#   sub_wr_stuck_fire (:1857) never asserts, and synth-B never arms —
#   "present, ungated, never arms". Same defect class as the one Fix H fixed
#   (per-write state collapsed into a global signal), one line apart.
#
# THE FIX MUST BE A SEPARATE TIMER, NOT A RE-GATE OF THE SHARED COUNTER.
#   - Age the OLDEST UNRETIRED (head-of-line) write; reset ONLY when THAT write
#     retires. A global "no write-B in N" counter is the same defect one level
#     up, because any sibling B resets it.
#   - Reads are genuinely single-outstanding (sub_rd_os_r is a single bit,
#     :1525) so they need no head-of-line treatment — BUT because sub_osr_ctr_r
#     is SHARED, a read completion still resets the write timer through the
#     `|| sub_axi_progress` term. So re-gating the shared counter re-imports the
#     defect a third time via the read path. Use a distinct write-age timer, or
#     exclude BOTH sub_r_done and sibling sub_b_done from the write reset.
#   - Wrapper-side, beside synth-B in tidelink_top. XHB500 itself is under
#     /research/AAA/ip_library/ (shared vendor IP, must not be modified).
#
# DO NOT BUILD IT YET. This is an RTL reading, not a measurement. Gate it on a
# die_a ILA showing BOTH: synth_b_pending never asserting, AND sub_osr_ctr_r
# being reset by sibling Bs. Probe set: synth_b_pending, sub_osr_ctr_r,
# sub_axi_progress, sub_r_done and sub_b_done SEPARATELY, sub_wr_os_ctr, hazard
# occupancy, s_axi aw/b. Trigger on sustained ahb_sub_hreadyout low. Pair with a
# NO-CORE control build of identical source (ILA insertion has itself caused a
# wedge class on this design — WlinkGenericFCSM_6.v:129-138, build #4).
# The capture modality already exists and is proven: imp/hw_gate/ila_2026_08_12/
# {ila_capture.tcl, ila_capture_run.sh} force-capture through the PS deadlock.

---
# TL-042 is its own document because it was appended AFTER the TL-035 amendment
# block above. Merge it into the same `bugs:` list as TL-036..TL-041.
  # ---------------------------------------------------------------------------
  - id: TL-042
    title: "CLASS: backstops that arm/clear on an intermediate signal the wedge itself suppresses"
    severity: high
    area: rtl/tidelink_top
    status: root_caused
    summary: >
      Three separate recovery backstops on the die_a outbound write path each
      fail the same way, and the shared shape matters more than any one of them:
      the arming or clearing condition is correct for the failure route its
      author had in mind, and is DEFEATED by a route they did not — because the
      condition keys on an INTERMEDIATE signal that the wedge itself suppresses.
      Logged as a class so the next backstop is not written the same way.
    instances:
      - "Fix H (2026-08-01, tidelink_top.sv:1513-1525). Correctly diagnosed that a
         single outstanding BIT false-idles for 4-deep bufferable EWR writes and
         added sub_wr_os_ctr. That fixed the FIRST term of the :1667 reset. The
         SECOND term, `|| sub_axi_progress` (= sub_r_done | sub_b_done, :1574),
         survived — any read or SIBLING write-B still rearms the age timer."
      - "synth-B arming (:1857). `sub_wr_stuck_fire = (osr_expired | stall_expired)
         & (sub_wr_os_ctr != 3'd0)`. MEASURED ON SILICON 2026-08-13: at the wedge
         sub_wr_os_ctr = 0 because the write never reached s_axi at all
         (sub_aw_accept = 0), so the AND guard is false and NO timer expiry can
         ever arm the backstop. The guard keys on a counter the wedge prevents
         from ever incrementing."
      - "TL-002 wr_hold_r (:1828-1848). Its own comment documents a wr_hold-stuck
         hang and adds `clear on synth_b_pending` as the guard. But synth-B cannot
         arm when no AW was ever counted — precisely the measured state — so the
         guard cannot fire in the case it was added for. SUSPECTED, not yet
         probed: wr_hold_r is one of two live candidates holding
         ahb_sub_hreadyout low."
    root_cause: >
      Each backstop observes a PROXY for "the bus is stuck" rather than the
      condition itself. The proxies (outstanding-count non-zero, forward-progress
      absent, a sibling backstop having armed) are all downstream of the very
      transaction the wedge blocks, so the wedge removes the evidence of itself.
    fix:
      approach: >
        Backstops on this path must arm and clear on the CONSEQUENCE — the bus
        being held (sustained ahb_sub_hreadyout low) or a write not retiring
        within a bound — NOT on an intermediate signal that the wedge suppresses.
        Concretely: a watchdog keyed on sustained PS-facing stall, independent of
        sub_wr_os_ctr, sub_axi_progress and synth_b_pending. Wrapper-side; XHB500
        is read-only vendor IP under /research/AAA/ip_library/.
      files: [src/rtl/tidelink_top.sv]
      commit: null
      netlist_affecting: true
    caveats:
      - "DO NOT build the previously-proposed head-of-line write-age timer: it ages
         writes counted in sub_wr_os_ctr, and the stuck write is never counted.
         It would review as correct and do nothing. Killed by the 08-13 ILA."
      - "The third instance (wr_hold_r) is SUSPECTED, not measured. Priority in the
         :1909 mux matters: (ext_is_nonseq && !pipe_valid_r) is rank 3 and
         wr_hold_r rank 5, so if both hold, rank 3 is the operative selector and
         wr_hold_r is a passenger. pipe_valid_r is the discriminator — probing
         wr_hold_r alone can produce a true-but-misleading attribution."
    verification:
      sim_test: none
      in_sim_gate: false
      hw_tested: "instance 2 MEASURED (imp/hw_gate/ila_tl035_run/); instances 1 and 3 read from RTL"
    signoff:
      claude_verdict: >
        The most reusable result of the 2026-08-13 campaign. Two fixes were
        designed and discarded before implementation because measurement
        contradicted a well-grounded RTL reading; both would have reviewed as
        correct. Treat any new backstop on this path as suspect until its arming
        condition is shown to hold in the wedged state, not merely in the state
        its author was picturing.
      evidence:
        - "imp/hw_gate/ila_tl035_run/ (37-probe die_a capture: sub_aw_accept=0, sub_wr_os_ctr=0, synth_b_pending=0)"
        - "sub_stall_ctr_r is a CLEAN MONOTONIC +1/clock ramp 0x159f->0x259e with ZERO resets in the 4096-sample window. It ramps continuously, so over a ~20s wedge it MUST reach 2**16 (0.65ms @100MHz) and sub_stall_expired MUST fire repeatedly — yet arming still never occurs. That makes `& (sub_wr_os_ctr != 0)` the DECISIVE blocker: a timer genuinely expires and arming genuinely cannot happen."
        - "CORRECTION: this counter was first reported as a 'sawtooth'. That was a DECODE BUG — Vivado ILA CSVs encode multi-bit probes as unprefixed quoted HEX ('015fc','01600'), and parsing an all-digit hex value base-10-first yields 1600 instead of 0x1600=5632, fabricating 100 fake drops. ALWAYS PARSE ILA MULTI-BIT PROBES HEX-FIRST. A full mechanism argument was built on the fake sawtooth before it was caught."
        - "CONSEQUENCE: because the counter never resets in-window, sub_ext_stalled is continuously high, so there is NO sample with rank3=0 AND xhb_sub_hreadyout_raw=1. The round-1 capture therefore CANNOT discriminate rank3 (ext_is_nonseq && !pipe_valid_r) from rank5 (wr_hold_r). Round-2 (43 probes) is a discovery run, not a confirmation."
        - "tidelink_top.sv:1513-1525 (Fix H), :1667, :1574, :1857, :1828-1848, :1909-1914, :1542-1550, :1645-1646"
      approved: false
    related: [TL-002, TL-005, TL-035, TL-037]
