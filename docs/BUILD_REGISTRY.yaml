# =============================================================================
# TideLink chiplet interconnect — BUILD REGISTRY
# =============================================================================
# Companion to docs/BUG_REGISTRY.yaml. That file tracks defects; this one tracks
# the BYTES those defects were observed in — which bitstream ran on which board,
# built from which commit, with which parameters, and what was actually proven.
#
# WHY THIS FILE EXISTS
#   The build manifest emitted by fpga/scripts/build_provenance.tcl
#   (`tidelink-build-manifest/1`) records the source commit, the flist, the PHY
#   marker and two submodule pins. It records NO IP parameters, NO build-time
#   environment variables, NO tool version and NO test result. Two bitstreams
#   built from the same target name can therefore differ in a netlist-affecting
#   parameter and produce identical manifests. That is not hypothetical:
#     * fpga/targets/kr260-pair-onchip/tidelink_design.tcl sets
#       CONFIG.DEBUG_UNLOCK_DEFAULT {1'b0} at 9cca6fe and {1'b1} at 9eaafb7 —
#       `git diff 9eaafb7 9cca6fe -- fpga/targets/kr260-pair-onchip/tidelink_design.tcl`
#       is 4 changed lines, all parameter values, and neither manifest mentions
#       the parameter at all.
#     * The 2026-08-09 all-zeros root cause was AUTO_ANCHOR_EN shipping 1'b0 in a
#       standalone kr260-pair build while the byte-exact reference vehicle
#       shipped 1'b1 — invisible in every manifest, every build log and
#       fpga/scripts/check_wrapper_params.sh (which validates the wrapper
#       DEFAULT, not the value the target tcl bakes into the netlist).
#
# WORKFLOW
#   1. APPEND an entry whenever a bitstream is DEPLOYED to a board. Copy the
#      fields out of imp/fpga/output/<target>/tidelink_manifest.json, then fill
#      the fields the manifest does not carry (parameters, env, tool, boards).
#      Set status: deployed.
#   2. PROMOTE to status: hw_validated only when a NAMED, RETAINED test artefact
#      proves it — a log or verdict.json that still exists on disk and names the
#      build. A result that survives only in a commit message, a tag body, a
#      handover doc or an agent's prose is NOT hw_validated; record it under
#      validation.claimed with evidence_class set accordingly.
#   3. Mark the previous entry for the same target `superseded`, or `known_bad`
#      if hardware showed it broken.
#   4. Never back-fill a guess. A field that was not recorded at build time is
#      written `unknown  # not recorded at build time`. The honest gap is the
#      point of this file: it is what makes the next gap visible.
#
# ⚠ This registry was seeded RETROSPECTIVELY on 2026-08-10 from surviving
#   manifests, deploy sidecars, tag bodies and commit messages. Entries dated
#   before 2026-08-10 were reconstructed, not recorded; their `provenance` field
#   says how far the reconstruction got.
# -----------------------------------------------------------------------------
schema_version: 1
generated: 2026-08-10
maintainer: docs-site authoring pass (Claude Opus 5)
approver: David Mapstone <david@mapstone.me>
companion: docs/BUG_REGISTRY.yaml

# ---- STATUS ----------------------------------------------------------------
# built        : bitstream exists; never (recorded as) flashed to a board
# deployed     : flashed to a board; results, if any, are claimed not evidenced
# hw_validated : a named retained artefact on disk proves a hardware result
# superseded   : replaced by a later build of the same target (it may well have
#                been deployed and validated at the time — read its validation
#                block; `superseded` is about currency, not about quality)
# known_bad    : hardware showed this build broken; do not redeploy
# -----------------------------------------------------------------------------
legend:
  status: [built, deployed, hw_validated, superseded, known_bad]

  # How completely the build can be reproduced from what was recorded.
  provenance:
    full: >
      clean tree, full 40-char commit, bit hash recomputable from surviving
      bytes, and the commit is reachable in a repo we can fetch.
    partial: >
      commit known but the tree was dirty (the diff was never captured), or the
      commit is unreachable from this repo, or the bytes are gone.
    sha_unrecoverable: >
      the source commit was never recorded, or the recorded identifier is a
      reconstruction rather than the build source. Bytes may still exist and can
      serve as an A/B control, but the build MUST NOT be quoted as a version
      datapoint.

  # What kind of thing backs a validation claim. Only the first justifies
  # status: hw_validated.
  evidence_class:
    retained_artifact: a log/JSON that still exists on disk and names the build
    commit_message:    a sentence in a git commit
    tag_body:          a sentence in an annotated tag
    memory_note:       a project memory/handover document
    none:              no result recorded

# ---- SIGN-OFF ---------------------------------------------------------------
# Same rule as the bug registry: an agent may advance status up to hw_validated
# WITH a retained artefact; `approved` is the human approver's alone. Choosing a
# build as a release/tapeout reference is a DECISION and is never auto-signed.
signoff_policy:
  auto_signoff_allowed: false
  agent_max_status: hw_validated
  approver: David Mapstone
  hw_validated_requires:
    - "validation.evidence_class == retained_artifact"
    - "validation.evidence names a path that exists"
    - "bitstream.bit_sha256 recomputable from the bytes it names"
  how_to_sign: >
    Set signoff.approved / approved_by / approved_date on an entry whose
    validation evidence you accept.

# ---- WHAT THE BUILD MANIFEST RECORDS TODAY ----------------------------------
# Fields emitted by tl_write_manifest (fpga/scripts/build_provenance.tcl:253-303),
# called from fpga/build_design.tcl right after the .bit is produced — inside the
# build, so it cannot be forgotten. This is the good half of the mechanism.
manifest_mechanism:
  schema: tidelink-build-manifest/1
  writer: fpga/scripts/build_provenance.tcl  # proc tl_write_manifest, line 253
  call_site: fpga/build_design.tcl           # line 676, post-write_bitstream
  records:
    [schema, sha256, source_commit, git_dirty, phy_marker, flist,
     submodule_pins (deps/tidelink-phy + deps/tidelink-gpio-phy only),
     usr_access, target, build_host, build_date, label]
  # Every one of these is a field this registry has to fill by hand today.
  does_not_record:
    - "IP parameters — no CONFIG.* value set on the tidelink_0/_1 BD cells"
    - "build-time env — TL_TRAIN_ENTRY_FALLBACK, TL_EPOCH_ANCHOR_EN, TIDELINK_FPGA_PTP, TD_AUTO_LANE_MASK_E4, FPGA_ALLOW_CRITICAL_WARNINGS (only TIDELINK_PHY_V2 survives, indirectly, as phy_marker)"
    - "tool version — no Vivado version anywhere in build_design.tcl or build_provenance.tcl"
    - "deps/axi-chiplet-controller pin (declared in .gitmodules) and deps/xhb500 (not a submodule; versioned by nothing)"
    - "the dirty diff — a `-dirty` build records only those six characters"
    - "any test result"
  traps:
    usr_access_is_not_a_discriminator: >
      build_provenance.tcl:275 strips "-dirty" before deriving usr_access, so a
      DIRTY manifest still carries a plausible-looking hex value that was never
      stamped into the bitstream (build_design.tcl:637-643 only exports
      TIDELINK_GIT_USR_ACCESS on a clean tree). Presence of usr_access proves
      nothing; only git_dirty:false does.
    deploy_sidecar_drops_dirty: >
      imp/fpga/output/pynq-z2-pair-all/tidelink_manifest.json records
      "9eaafb7152f...-dirty"; the sibling tidelink.bin.manifest.json that
      travels to the board records "9eaafb7" with the dirty flag gone. The
      artefact that reaches hardware is the one that overstates reproducibility.
    bit_and_bin_can_disagree: >
      imp/fpga/output/kr260-pair-onchip/ holds a .bit from 2026-07-24 and a .bin
      from 2026-07-29 — different builds. The .bin is what gets flashed and has
      no manifest of its own.
    directory_label_is_typed_not_derived: >
      imp/fpga/output/kr260-eth-chiplet.prefixG-855096a/ contains a manifest
      whose source_commit is 34b006cb…; 855096a appears nowhere in it.

