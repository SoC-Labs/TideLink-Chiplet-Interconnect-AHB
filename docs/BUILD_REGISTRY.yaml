    The last build that is BOTH hardware-validated AND fully recoverable from
    git is kr260-pair-onchip @9cca6fe (2026-08-08), bitstream sha256
    fa9d0fe2…, USR_ACCESS 0xcb6e8cde, built from a CLEAN tree. It is the only
    entry in this file backed by a retained artefact on disk
    (tidelink-consolidated/onchip_landrate.log), and even that artefact covers
    only the 4/4 fresh-POR land-rate half of the claim — the "1000/1000
    byte-exact first POR" half survives only in commit e66b539's message.
  caveats:
    - "The onchip vehicle is a SINGLE board with two TideLink instances in fabric and no ribbon. It is lottery-free by construction and does NOT exercise the two-board eye where TL-001 (peer-write drop) and TL-009 (die_a PS wedge) live."
    - "The project's own newest commit on the live line states it plainly: kr260_sysval.py printed to stdout and nothing else, so 128/128, 16/16 and 11/11 have no surviving artefact."
    - "The live hardware line is NOT this repo. 2026-08-01..09 hardware ran from nanosoc-ethernet-chiplet/tidelink @28409f5; `git cat-file -t 28409f5` in this repo returns 'fatal: Not a valid object name'. Same for 5d58c2a3 and 90fe6cc."
    - "137 tags exist and none is newer than 2026-07-30, so the whole August campaign is untagged. Tags are also unreliable as a build index (see BLD-2026-06-10 and the freeze-2026-07-22 note)."

