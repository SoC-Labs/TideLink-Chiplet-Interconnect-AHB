# fpgahub manifest for tidelink
#
# TideLink chiplet bridge: Pynq-Z2 single-instance, paired GPIO-bridge
# (two boards connected via RPi-header ribbon), and MPS3/AN552.
#
# Upstream dependency: fpgahub >= feat/pair-tokens-and-env
#   Pair tokens ({pair.*}) are rendered at action-dispatch time by fpgahub;
#   no helper scripts are needed.  FPGAHUB_PEER_* env vars are also injected
#   into each action subprocess automatically for pair-bound actions.

schema_version = 1
project        = "tidelink"
description    = "TideLink chiplet bridge — Pynq-Z2 single + paired GPIO-bridge + MPS3"

# ---------------------------------------------------------------------------
# Artefacts — three bitstream targets, each with .bit / .bin / .hwh
# ---------------------------------------------------------------------------

[artefacts.bitstream_pynq_z2_single]
kind = "bitstream"
path = "../imp/fpga/output/pynq-z2-single/tidelink.bit"

[artefacts.bitstream_bin_pynq_z2_single]
kind = "bitstream"
path = "../imp/fpga/output/pynq-z2-single/tidelink.bin"

[artefacts.hwh_pynq_z2_single]
kind        = "other"
path        = "../imp/fpga/output/pynq-z2-single/tidelink.hwh"
description = "Vivado hardware handoff — consumed by the PYNQ Overlay wrapper."

[artefacts.bitstream_pynq_z2_pair]
kind = "bitstream"
path = "../imp/fpga/output/pynq-z2-pair/tidelink.bit"

[artefacts.bitstream_bin_pynq_z2_pair]
kind = "bitstream"
path = "../imp/fpga/output/pynq-z2-pair/tidelink.bin"

[artefacts.hwh_pynq_z2_pair]
kind        = "other"
path        = "../imp/fpga/output/pynq-z2-pair/tidelink.hwh"
description = "Vivado hardware handoff — consumed by the PYNQ Overlay wrapper."

# Role-aware pair targets (master = pair-all, slave = pair-flip-all).
# The two TARGETs ship MIRRORED RPi pinouts so the cross-cable wires
# up correctly. fpgahub's `deploy_pair` action (below) selects between
# them at dispatch time via the {pair.local.role} token.

[artefacts.bitstream_pynq_z2_pair_all]
kind = "bitstream"
path = "../imp/fpga/output/pynq-z2-pair-all/tidelink.bit"

[artefacts.bitstream_bin_pynq_z2_pair_all]
kind = "bitstream"
path = "../imp/fpga/output/pynq-z2-pair-all/tidelink.bin"

[artefacts.hwh_pynq_z2_pair_all]
kind        = "other"
path        = "../imp/fpga/output/pynq-z2-pair-all/tidelink.hwh"
description = "Master-side (die_a) pair bitstream handoff — pair-all RPi pinout."

[artefacts.bitstream_pynq_z2_pair_flip_all]
kind = "bitstream"
path = "../imp/fpga/output/pynq-z2-pair-flip-all/tidelink.bit"

[artefacts.bitstream_bin_pynq_z2_pair_flip_all]
kind = "bitstream"
path = "../imp/fpga/output/pynq-z2-pair-flip-all/tidelink.bin"

[artefacts.hwh_pynq_z2_pair_flip_all]
kind        = "other"
path        = "../imp/fpga/output/pynq-z2-pair-flip-all/tidelink.hwh"
description = "Slave-side (die_b) pair bitstream handoff — pair-flip-all RPi pinout (mirrored)."

[artefacts.bitstream_mps3]
kind = "bitstream"
path = "../imp/fpga/output/mps3/tidelink.bit"

[artefacts.bitstream_bin_mps3]
kind = "bitstream"
path = "../imp/fpga/output/mps3/tidelink.bin"

[artefacts.hwh_mps3]
kind        = "other"
path        = "../imp/fpga/output/mps3/tidelink.hwh"
description = "Vivado hardware handoff — MPS3 / AN552 variant."

# ---------------------------------------------------------------------------
# Build actions
# ---------------------------------------------------------------------------

[[actions]]
id        = "build_z2_single"
title     = "Build Pynq-Z2 single-instance bitstream"
command   = ["make", "-C", "fpga", "TARGET=pynq-z2-single", "build_design"]
produces  = ["bitstream_built_z2_single"]
timeout_s = 3600

[[actions]]
id        = "build_z2_pair"
title     = "Build Pynq-Z2 paired GPIO-bridge bitstream"
command   = ["make", "-C", "fpga", "TARGET=pynq-z2-pair", "build_design"]
produces  = ["bitstream_built_z2_pair"]
timeout_s = 3600

[[actions]]
id        = "build_z2_pair_all"
title     = "Build Pynq-Z2 pair master bitstream (pair-all)"
command   = ["make", "-C", "fpga", "TARGET=pynq-z2-pair-all", "build_design"]
produces  = ["bitstream_built_z2_pair_all"]
timeout_s = 3600

[[actions]]
id        = "build_z2_pair_flip_all"
title     = "Build Pynq-Z2 pair slave bitstream (pair-flip-all)"
command   = ["make", "-C", "fpga", "TARGET=pynq-z2-pair-flip-all", "build_design"]
produces  = ["bitstream_built_z2_pair_flip_all"]
timeout_s = 3600

[[actions]]
id        = "build_mps3"
title     = "Build MPS3 bitstream"
command   = ["make", "-C", "fpga", "TARGET=mps3", "build_design"]
produces  = ["bitstream_built_mps3"]
timeout_s = 3600

# ---------------------------------------------------------------------------
# Program (JTAG) actions
# ---------------------------------------------------------------------------

[[actions]]
id        = "program_z2_single"
title     = "Program Pynq-Z2 single-instance via JTAG"
command   = ["make", "-C", "fpga", "program", "TARGET=pynq-z2-single"]
requires  = ["bitstream_built_z2_single"]
produces  = ["bitstream_loaded"]
timeout_s = 300

[[actions]]
id        = "program_z2_pair"
title     = "Program Pynq-Z2 paired-board via JTAG"
command   = ["make", "-C", "fpga", "program", "TARGET=pynq-z2-pair"]
requires  = ["bitstream_built_z2_pair"]
produces  = ["bitstream_loaded"]
timeout_s = 300

# ---------------------------------------------------------------------------
# Deploy (PYNQ fpga_manager) actions
# ---------------------------------------------------------------------------

[[actions]]
id          = "deploy_z2_single"
title       = "Deploy single-instance overlay to PYNQ Linux"
description = "Uses PYNQ fpga_manager over SSH/SCP. Requires PYNQ_PASSWORD secret."
command     = ["make", "-C", "fpga", "deploy",
               "TARGET=pynq-z2-single",
               "PYNQ_HOST={host.ssh}",
               "PYNQ_PROXY={host.proxy}"]
secret_env  = { PYNQ_PASSWORD = "pynq.ssh_password" }
requires    = ["bitstream_built_z2_single"]
produces    = ["bitstream_loaded"]
timeout_s   = 600

[[actions]]
id          = "deploy_z2_pair"
title       = "Deploy paired GPIO-bridge overlay to PYNQ Linux"
description = "Uses PYNQ fpga_manager over SSH/SCP. Requires PYNQ_PASSWORD secret."
command     = ["make", "-C", "fpga", "deploy",
               "TARGET=pynq-z2-pair",
               "PYNQ_HOST={host.ssh}",
               "PYNQ_PROXY={host.proxy}"]
secret_env  = { PYNQ_PASSWORD = "pynq.ssh_password" }
requires    = ["bitstream_built_z2_pair"]
produces    = ["bitstream_loaded"]
timeout_s   = 600

# Role-aware pair deploy. Selects pair-all (master, die_a) or
# pair-flip-all (slave, die_b) based on {pair.local.role}. Bound to
# pair members; fpgahub fans this action out per side at dispatch time.
#
# Note on `requires`: this action does NOT gate on the
# bitstream_built_z2_pair_{all,flip-all} flags. The Makefile's `deploy:
# $(BITSTREAM) $(BITBIN) $(HWH)` rule already errors if the bitstreams
# are missing, and forcing a flag handshake means the daemon refuses
# to dispatch unless the build action ran in-process — even when
# bitstreams are sitting on disk from an external Vivado run. Keep
# the gate on the file system, not on the flag bookkeeping.
[[actions]]
id          = "deploy_pair"
title       = "Deploy bitstream matching this side's pair role"
description = """
PYNQ fpga_manager over SSH/SCP. die_a → pynq-z2-pair-all, die_b →
pynq-z2-pair-flip-all (mirrored RPi pinout for the cross-cable).
"""
command     = ["make", "-C", "fpga", "deploy_pair_role",
               "ROLE={pair.local.role}",
               "PYNQ_HOST={host.ssh}",
               "PYNQ_PROXY={host.proxy}"]
secret_env  = { PYNQ_PASSWORD = "pynq.ssh_password" }
produces    = ["bitstream_loaded"]
timeout_s   = 600

# ---------------------------------------------------------------------------
# One-time PYNQ image provisioning
# ---------------------------------------------------------------------------

# Drops /etc/sudoers.d/pynq-fpgahub on a fresh PYNQ-Z2 image so the
# xilinx user can run `sudo -n` without a password prompt. Required
# before stress_pair, deploy_pair, etc. work cleanly. Idempotent —
# safe to re-run. Run once per board after a fresh PYNQ image flash.
[[actions]]
id          = "provision_pynq_sudo"
title       = "One-time: enable NOPASSWD sudo on a fresh PYNQ-Z2 image"
description = """
Drops /etc/sudoers.d/pynq-fpgahub via the existing xilinx sudo password
(secret_env). Idempotent. Required before stress_pair / deploy_pair can
run sudo -n successfully. Run once per fresh PYNQ image flash.
"""
command     = ["make", "-C", "fpga", "provision_pynq_sudo",
               "PYNQ_HOST={host.ssh}",
               "PYNQ_PROXY={host.proxy}"]
secret_env  = { PYNQ_PASSWORD = "pynq.ssh_password" }
timeout_s   = 60

# Static-route provisioning: lay down a persistent kernel route from
# this board to the peer board's PS-side /24 via mapstone-dev as
# gateway. Without this, the stress runner's peer-agent SSH spawn
# (`ssh xilinx@<peer-IP>`) fails with "Network is unreachable" — the
# two boards live on separate per-board /24s and only mapstone-dev
# bridges them.
#
# Idempotent — re-running on a board that's already routed is a no-op.
# Persistent across reboots via systemd-networkd drop-in. Run once per
# pair member after a fresh PYNQ image flash, AFTER provision_pynq_sudo
# (this action uses sudo via secret_env).
[[actions]]
id          = "provision_pynq_route"
title       = "One-time: install static route to peer board's /24"
description = """
Adds a persistent kernel route to the peer's PS-side /24 via the
local /24 gateway (mapstone-dev). Required for the stress runner's
peer-agent SSH spawn to work. Pair-bound action — uses
{pair.peer.host.ssh} to derive the peer's /24, {host.ssh} to derive
the local /24's .1 gateway. Idempotent.
"""
command     = ["make", "-C", "fpga", "provision_pynq_route",
               "PYNQ_HOST={host.ssh}",
               "PYNQ_PROXY={host.proxy}",
               "PEER_SSH={pair.peer.host.ssh}"]
secret_env  = { PYNQ_PASSWORD = "pynq.ssh_password" }
timeout_s   = 60

# Per-board SSH peer-key trust: generates a keypair for xilinx@<board>
# and propagates the pubkey to david@mapstone-dev (intermediate hop) and
# xilinx@<peer> (final hop). Required for the stress runner's peer-agent
# SSH chain when boards live on separate /24s and jump through
# mapstone-dev. Idempotent. Pair-bound action — uses {pair.peer.host.ssh}
# to identify the peer.
#
# Run after provision_pynq_sudo (we use sudo on the board to write
# ~/.ssh files when needed) and after the proxy field has been wired
# into /etc/fpgahub/config.toml (see fpga/scripts/setup_fpgahub_pynq_proxy.sh).
[[actions]]
id          = "provision_pynq_peer_keys"
title       = "One-time: generate + propagate xilinx@board SSH keys for peer-agent"
description = """
Generates xilinx@<board>:~/.ssh/id_ed25519 if missing, then appends the
pubkey to david@mapstone-dev:~/.ssh/authorized_keys (proxy hop) and
xilinx@<peer>:~/.ssh/authorized_keys (final hop). Idempotent.
Pair-bound — uses {pair.peer.host.ssh} to identify the peer.
"""
command     = ["make", "-C", "fpga", "provision_pynq_peer_keys",
               "PYNQ_HOST={host.ssh}",
               "PYNQ_PROXY={host.proxy}",
               "PEER_SSH={pair.peer.host.ssh}"]
secret_env  = { PYNQ_PASSWORD = "pynq.ssh_password" }
timeout_s   = 60

# ---------------------------------------------------------------------------
# Stress tests
# ---------------------------------------------------------------------------

[[actions]]
id          = "stress_single"
title       = "Solo stress test on single-instance board"
description = """
Runs pynq_host.stress.runner in --solo mode on the board over SSH.
Key-based auth + NOPASSWD sudo required (configure once per PYNQ image).
"""
command   = ["ssh",
             "-o", "StrictHostKeyChecking=no",
             "-o", "ConnectTimeout=10",
             "-o", "ServerAliveInterval=15",
             "{host.ssh}",
             "cd /home/xilinx/tidelink_overlay && sudo -n python3 -m pynq_host.stress.runner --solo --budget 300"]
requires  = ["bitstream_loaded"]
timeout_s = 900

# NOTE — env propagation choice for stress_pair:
#
# fpgahub injects FPGAHUB_PEER_* into the *local* action subprocess (the ssh
# client process).  ssh(1) does NOT forward those env vars to the remote shell
# by default; SendEnv / AcceptEnv require SSH server config that we cannot
# guarantee on stock PYNQ images.
#
# Option (a) — bake token substitutions into the command line (chosen here):
#   fpgahub renders {pair.peer.*} to concrete values at dispatch time, so the
#   peer's SSH address etc. are literal strings by the time ssh executes.
#   No env propagation needed at all; the remote runner receives everything as
#   CLI flags.
#
# Option (b) — "env KEY=VAL ... python3 ..." prefix in the remote command:
#   Would work but duplicates the token → env-var mapping that fpgahub already
#   maintains, and makes the command line harder to audit.
#
# Using option (a): cleaner, no SSH server policy dependency.
# The runner may also check FPGAHUB_* locally if needed (via sudo -E), but
# the critical peer-addressing data is in the flags.

[[actions]]
id          = "stress_pair"
title       = "Paired stress test (requires board to be in a pair)"
description = """
Runs pynq_host.stress.runner in --pair mode on the local board over SSH.
Pair tokens are baked into the command line at dispatch time by fpgahub, so
no SSH env propagation is required.  sudo -E is passed so that the local
FPGAHUB_* vars visible to the ssh process are forwarded into the sudo
environment on the board — useful for any ancillary lookups the runner does
locally, but the critical peer-addressing flags come from the CLI tokens.

IMPORTANT: this action uses {pair.*} tokens and MUST be run against a board
that is currently a member of an active pair lease.  Running it outside a
pair context will cause fpgahub to fail token resolution at dispatch time.
"""
command   = ["ssh",
             "-A",
             "-o", "StrictHostKeyChecking=no",
             "-o", "ConnectTimeout=10",
             "-o", "ServerAliveInterval=15",
             "{host.ssh}",
             "cd /home/xilinx/tidelink_overlay && sudo -E -n python3 -m pynq_host.stress.runner --pair --peer-ssh '{pair.peer.host.ssh}' --peer-proxy '{host.proxy}' --local-role '{pair.local.role}' --peer-role '{pair.peer.role}' --pair-id '{pair.id}' --budget 600"]
requires  = ["bitstream_loaded"]
timeout_s = 1500
# Background-tier revoke gives the runner this many seconds to unwind
# before SIGKILL. The runner's SIGTERM handler closes the peer SSH and
# kills the remote peer_agent; 30s leaves slack for slow PYNQ links.
revoke_grace_s = 30

# ---------------------------------------------------------------------------
# Composite CI flows
# ---------------------------------------------------------------------------

[[actions]]
id        = "ci_single_full"
title     = "Full CI: build → deploy → stress (single)"
steps     = ["build_z2_single", "deploy_z2_single", "stress_single"]
timeout_s = 0

[[actions]]
id        = "ci_pair_full"
title     = "Full CI: build → deploy → stress (pair, single bitstream)"
steps     = ["build_z2_pair", "deploy_z2_pair", "stress_pair"]
timeout_s = 0

# Role-aware pair CI: build BOTH master + slave bitstreams, then run
# the role-aware deploy on each pair member, then stress. This is the
# preferred end-to-end pipeline for bring-up validation — replaces the
# ad-hoc /tmp/deploy_pair_proxy.sh + sshpass flow.
[[actions]]
id        = "ci_pair_role_aware"
title     = "Full CI: build (master + slave) → deploy role-aware → stress"
steps     = ["build_z2_pair_all", "build_z2_pair_flip_all",
             "deploy_pair", "stress_pair"]
timeout_s = 0
